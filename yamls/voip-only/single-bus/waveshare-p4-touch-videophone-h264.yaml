# ==============================================================================================
# Waveshare ESP32-P4 Touch 10.1 / SIP videophone / H264
# Status: experimental H.264 profile
# Support: https://github.com/sponsors/n-IA-hane
#
# Main packages:
#   voip/waveshare_p4_touch_videophone_base.yaml
#   board/waveshare_p4_touch_10_1_videophone.yaml (through base)
#   voip/p4_video_h264.yaml (the selected video codec only)
#
# Audio inherited from the shared videophone board package:
# ┌─────────────────────────┐     ┌───────────────────────┐
# │   ES7210 mic slots 0,2  ├────>│    48 kHz -> 16 kHz   ├───┐
# │     microphone input    │     │  audio_stack capture  │   │   ┌─────────────────────────┐
# └─────────────────────────┘     └───────────────────────┘   └──>│   esp_afe: 2 mic + AEC  │
#                                                              ┌─>│    16 kHz processing    │
# ┌─────────────────────────┐     ┌───────────────────────┐    │  └────────────┬────────────┘
# │  ES7210 TDM ref slot 1  ├────>│    48 kHz -> 16 kHz   ├────┘               │
# │   AEC reference input   │     │ audio_stack reference │                    v
# └─────────────────────────┘     └───────────────────────┘       ┌─────────────────────────┐
#                                                                 │         mic_main        │
#                                                                 │         VoIP TX         │
#                                                                 └─────────────────────────┘
#
# Playback inherited from the same board package (no mixer):
# ┌─────────────────────────┐    ┌─────────────────────────┐    ┌─────────────────────────┐
# │         VoIP RX         ├───>│    voip_speaker_input   ├───>│        hw_speaker       │
# │       decoded PCM       │    │        resampler        │    │     ES8311 / 48 kHz     │
# └─────────────────────────┘    └─────────────────────────┘    └─────────────────────────┘
#
# This top-level YAML selects video parameters; audio bindings live in the base package.
# The SIP-only base has no VA, MWW, media_player, local audio files or TTS/media mixer.
# Video dimensions and isolated build-directory notes are preserved below.
# ==============================================================================================

# Waveshare ESP32-P4 Touch 10.1: experimental H.264 SIP videophone.
#
# Exactly one codec package is merged with the common SIP-only runtime. JPEG
# decoder/source symbols and buffers are absent from this firmware.

substitutions:
  # Scale the full native 800x800 sensor field to the 400x400 encoder input.
  # PPA performs the conversion without changing the square camera aspect.
  p4_video_width: "400"
  p4_video_height: "400"
  # Advertise the independently measured software-decoder envelope for the
  # peer -> P4 leg.
  p4_video_rx_width: "352"
  p4_video_rx_height: "288"
  p4_video_fps: "10"
  p4_camera_fps: "10"
  p4_camera_resolution: "800x800"
  p4_camera_rotation: "270"
  p4_h264_bitrate: "800000"
  p4_h264_gop: "10"
  # H.264 drives CSI, PPA, the hardware encoder, the software decoder and DSI
  # over shared PSRAM. Keep Espressif's split-core pipeline ordering: the
  # Core-0 feed bridge time-slices with the priority-19 I2S owner, while the
  # Core-1 SE/fetch result path gets priority 20 so complete 64 ms frames reach
  # the non-blocking consumer before its deadline. Raising feed above 19 can
  # starve I2S completion handling; leaving it at 18 misses AFE output frames.
  p4_afe_task_priority: "20"
  p4_afe_feed_task_priority: "19"
  p4_afe_fetch_task_priority: "20"

packages:
  base: github://n-IA-hane/esphome-intercom/packages/voip/waveshare_p4_touch_videophone_base.yaml@dev
  video: github://n-IA-hane/esphome-intercom/packages/voip/p4_video_h264.yaml@dev

# Codec profiles have different managed-component graphs and therefore must
# not reuse generated CMake components from another profile.
esphome:
  build_path: .esphome/build/waveshare-p4-touch-videophone-h264

api:
  custom_services: true
