# ==============================================================================================
# Generic ESP32-S3 / VoIP / single-bus
# Status: maintained generic wiring example; adapt GPIOs to the board
# Support: https://github.com/sponsors/n-IA-hane
#
# Device package: packages/devices/generic-s3-phone-single.yaml
# Features: edit the firmware_features list below.
#
# Capture and software AEC reference:
# ┌─────────────────────────┐     ┌───────────────────────┐
# │   I2S MEMS microphone   ├────>│    48 kHz -> 16 kHz   ├───┐
# │     microphone input    │     │  audio_stack capture  │   │   ┌─────────────────────────┐
# └─────────────────────────┘     └───────────────────────┘   └──>│         esp_aec         │
#                                                             ┌──>│    16 kHz processing    │
# ┌─────────────────────────┐     ┌───────────────────────┐   │   └────────────┬────────────┘
# │   PCM: previous_frame   ├────>│    48 kHz -> 16 kHz   ├───┘                │
# │   AEC reference input   │     │ audio_stack reference │                    v
# └─────────────────────────┘     └───────────────────────┘       ┌─────────────────────────┐
#                                                                 │         mic_main        │
#                                                                 │         VoIP TX         │
#                                                                 └─────────────────────────┘
#
# Playback (direct output, no mixer):
# ┌─────────────────────────┐    ┌─────────────────────────┐    ┌─────────────────────────┐
# │         VoIP RX         ├───>│    voip_speaker_input   ├───>│        hw_speaker       │
# │       decoded PCM       │    │   resampler to 48 kHz   │    │  audio_stack / I2S amp  │
# └─────────────────────────┘    └─────────────────────────┘    └─────────────────────────┘
#
# Shared BCLK/LRCLK, full-duplex I2S.
# The reference is the software playback PCM tap selected by aec_reference: previous_frame.
# No VA/MWW, media/TTS mixer or separate reference wire is configured here.
# ==============================================================================================

# =============================================================================
# GENERIC ESP32-S3 VOIP - Single I2S bus, no hardware codec
# =============================================================================
# Generic SIP phone profile. It keeps the AEC-only audio pipeline small and
# exposes standard SIP signaling plus RTP media through voip_stack.
#
# ESP-to-ESP calls use the unified phonebook from HA.
#
# HARDWARE (adapt GPIOs to YOUR board):
#   - Board: Any ESP32-S3 with PSRAM
#   - Microphone: Any I2S MEMS mic on DIN pin
#   - Speaker: Any I2S class-D amp on DOUT pin
#   - Mic and speaker SHARE BCLK + LRCLK (same I2S bus, full-duplex)
#   - LED: SK6812/WS2812 RGB (optional)
#
# GPIO PINOUT (example, change to match your wiring):
#   Shared I2S:  BCLK=GPIO36, LRCLK=GPIO37, DIN=GPIO35 (mic), DOUT=GPIO7 (speaker)
#   LED:         DATA=GPIO33
#
# =============================================================================

# =============================================================================
# PROJECT SETUP
# =============================================================================

substitutions:
  runtime_controller_components_source: "github://n-IA-hane/esphome-runtime-controller@dev"
  gmf_ai_audio_source: ""
  firmware_features: [voip, status_led, diagnostics]
  # Hardware identity stays stable across YAML updates so HA entities and
  # ESPHome build cache are reused.
  name: generic-s3
  friendly_name: Generic S3

  ext_components_source: "github://n-IA-hane/esphome-intercom@dev"
  voip_stack_components_source: "github://n-IA-hane/esphome-voip-stack@dev"
  audio_stack_components_source: "github://n-IA-hane/esphome-audio-stack@dev"

  # ---------------------------------------------------------------------------
  # Pinout: shared I2S bus
  # ---------------------------------------------------------------------------
  # BCLK/LRCLK are shared by mic and speaker on this full-duplex bus.
  i2s_bclk_pin: GPIO36
  i2s_lrclk_pin: GPIO37

  # ---------------------------------------------------------------------------
  # Pinout: microphone
  # ---------------------------------------------------------------------------
  i2s_din_pin: GPIO35

  # ---------------------------------------------------------------------------
  # Pinout: speaker
  # ---------------------------------------------------------------------------
  i2s_dout_pin: GPIO7

  # ---------------------------------------------------------------------------
  # Pinout: optional status LED
  # ---------------------------------------------------------------------------
  status_led_pin: GPIO33
  status_led_chipset: WS2812
  status_led_rgb_order: GRB

packages:
  device: github://n-IA-hane/esphome-intercom/packages/devices/generic-s3-phone-single.yaml@dev
