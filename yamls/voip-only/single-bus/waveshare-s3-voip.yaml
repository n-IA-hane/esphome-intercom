# ==============================================================================================
# Waveshare ESP32-S3 AUDIO Board / VoIP / ES7210 + ES8311
# Status: maintained VoIP-only board profile
# Support: https://github.com/sponsors/n-IA-hane
#
# Device package: packages/devices/waveshare-s3-phone.yaml
# Features: edit the firmware_features list below.
#
# Capture and hardware TDM reference:
# ┌─────────────────────────┐     ┌───────────────────────┐
# │  ES7210 TDM mic slot 0  ├────>│    48 kHz -> 16 kHz   ├───┐
# │     microphone input    │     │  audio_stack capture  │   │   ┌─────────────────────────┐
# └─────────────────────────┘     └───────────────────────┘   └──>│  esp_aec voip_high_perf │
#                                                             ┌──>│    16 kHz processing    │
# ┌─────────────────────────┐     ┌───────────────────────┐   │   └────────────┬────────────┘
# │  ES7210 TDM ref slot 1  ├────>│    48 kHz -> 16 kHz   ├───┘                │
# │   AEC reference input   │     │ audio_stack reference │                    v
# └─────────────────────────┘     └───────────────────────┘       ┌─────────────────────────┐
#                                                                 │         mic_main        │
#                                                                 │         VoIP TX         │
#                                                                 └─────────────────────────┘
#
# Playback: call and ringtone share the hardware speaker:
# ┌─────────────────────────┐
# │    voip_speaker_input   ├────┐
# │     voip_mixer_input    │    │    ┌──────────────────────┐      ┌─────────────────────────┐
# └─────────────────────────┘    ├───>│     audio_mixer      ├─────>│        hw_speaker       │
# ┌─────────────────────────┐    │    │     48 kHz mono      │      │   ES8311 / NS4150B amp  │
# │     ringtone_speaker    ├────┘    └──────────────────────┘      └─────────────────────────┘
# │   ringtone_speaker_mix  │
# └─────────────────────────┘
#
# Opus is the active default; substitutions define PCM boundary rates and packet time.
# No VA/MWW or general-purpose media playback is configured.
# ==============================================================================================

# =============================================================================
# WAVESHARE ESP32-S3 AUDIO BOARD - VoIP-only AEC
# =============================================================================
# A compact SIP phone profile for the Waveshare ESP32-S3-AUDIO-Board. It keeps
# only VoIP, single-mic AEC, local ringtone and the seven-LED status ring.
#
# The maintained default uses Opus. This profile has enough memory because it
# intentionally omits wake word, Voice Assistant and general media playback.
#
# ESP-to-ESP calls use the unified phonebook from HA.
#
# =============================================================================

# =============================================================================
# PROJECT SETUP
# =============================================================================

substitutions:
  runtime_controller_components_source: "github://n-IA-hane/esphome-runtime-controller@dev"
  gmf_ai_audio_source: ""
  firmware_features: [voip, status_led, diagnostics]
  # Hardware identity stays stable across YAML updates so HA entities and
  # ESPHome build cache are reused.
  name: waveshare-s3
  friendly_name: Waveshare S3 Audio

  ext_components_source: "github://n-IA-hane/esphome-intercom@dev"
  voip_stack_components_source: "github://n-IA-hane/esphome-voip-stack@dev"
  audio_stack_components_source: "github://n-IA-hane/esphome-audio-stack@dev"
  assets_base: "https://github.com/n-IA-hane/esphome-intercom/raw/dev/"

  # One firmware advertises one codec. Opus is the maintained VoIP-only
  # default and uses the mandatory RFC 7587 opus/48000/2 RTP mapping.
  voip_audio_codec: opus
  # These are codec PCM boundary rates, independent from the RTP clock.
  # Opus accepts 8000/12000/16000/24000/48000 Hz. For 32000 Hz hardware,
  # expose a supported rate through the microphone/speaker resampler below.
  # PCM additionally accepts 32000 and 44100 Hz. No codec fallback is used.
  voip_tx_sample_rate: "16000"
  voip_rx_sample_rate: "48000"
  voip_frame_ms: "20"

  # Prefer uncompressed PCM instead:
  # 1. Comment the four Opus substitutions above.
  # 2. Uncomment the four substitutions below.
  # 3. Uncomment audio.rx_formats below for direct PCM calls with 16 kHz peers.
  # voip_audio_codec: pcm
  # voip_tx_sample_rate: "16000"
  # voip_rx_sample_rate: "48000"
  # voip_frame_ms: "10"

  # ---------------------------------------------------------------------------
  # Pinout: shared ES7210/ES8311 TDM bus
  # ---------------------------------------------------------------------------
  i2s_mclk_pin: GPIO12
  i2s_bclk_pin: GPIO13
  i2s_lrclk_pin: GPIO14
  i2s_din_pin: GPIO15
  i2s_dout_pin: GPIO16

  codec_i2c_sda_pin: GPIO11
  codec_i2c_scl_pin: GPIO10

  # ---------------------------------------------------------------------------
  # Seven-pixel status ring
  # ---------------------------------------------------------------------------
  status_led_pin: GPIO38
  status_led_num_leds: "7"
  status_led_chipset: WS2812
  status_led_rgb_order: RGB

packages:
  device: github://n-IA-hane/esphome-intercom/packages/devices/waveshare-s3-phone.yaml@dev
