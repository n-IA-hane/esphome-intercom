                  width: ${settings_row_width}
                  height: 2
                  bg_color: 0x444444
                  border_width: 0
                  pad_all: 0
              - label:
                  width: ${settings_row_width}
                  text: "Audio"
                  text_align: CENTER
                  text_color: 0x88AAFF
                  text_font: ${settings_label_font}
              - obj:
                  width: ${settings_row_width}
                  height: ${settings_row_height}
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 12
                  pad_right: 12
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        width: ${settings_mid_width}
                        text: "Master volume"
                        text_align: LEFT
                        text_color: 0xFFFFFF
                        text_font: ${settings_label_font}
                    - slider:
                        width: ${settings_control_width}
