                        height: ${settings_slider_height}
                        adv_hittest: true
                        gesture_bubble: true
                        min_value: 0
                        max_value: 100
                        value: !lambda 'return id(master_volume).state;'
                        on_release:
                          - number.set:
                              id: master_volume
                              value: !lambda 'return x;'
              - obj:
                  width: ${settings_row_width}
                  height: ${settings_row_height}
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 12
                  pad_right: 12
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
