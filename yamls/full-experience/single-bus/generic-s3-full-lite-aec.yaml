# Experimental 4 MB profile with limited OTA headroom.
# Keeps Voice Assistant, wake word, HTTP media, TTS, VoIP and runtime controller.
# Sendspin is optional and disabled to fit the standard 4 MB OTA layout.
# Measured flash margin is small; adding features can exceed the OTA partition.
# =============================================================================
# GENERIC ESP32-S3 FULL LITE AEC - Single I2S bus, no hardware codec
# Profile: FULL LITE / shared I2S / software AEC / 4 MB flash
# Composition: Preset + component bindings + shared mono mixer/player; board owns I2S + esp_aec.
# Runtime facts: native media/VoIP/Wi-Fi/mute listeners; shared VA/MWW callbacks.
# YAML keeps user controls, board wiring and presentation hooks.
# Support: https://github.com/sponsors/n-IA-hane
# =============================================================================
#
# CAPTURE: software playback reference; mic output is 16 kHz mono.
# [MEMS mic / I2S RX 48 kHz] ───────────────┐
# [audio_stack TX: previous_frame REF] ─────┤
#                                           ▼
#                              [audio_stack: 48 → 16 kHz]
#                                           │
#                                           ▼
#                               [aec_processor: esp_aec]
#                                           │
#                                           ▼
#                                      [mic_main]──┬─► VA
#                                                  ├─► MWW (barge-in)
#                                                  └─► VoIP TX
# The REF is the previous software TX frame; no codec ADC loopback is configured.
#
# PLAYBACK: speaker_media_player owns the media + announcement pipelines.
#         [HTTP media]             [VA TTS / HTTP / files]              [VoIP RX]
#               │                             │                             │
#               ▼                             ▼                             │
#       [media_pipeline]           [announcement_pipeline]                  │
#               │                             │                             │
#               ▼                             ▼                             ▼
#     [media_speaker_input]          [tts_speaker_input]          [voip_speaker_input]
#           resampler                     resampler                     resampler
#               │                             │                             │
#               ▼                             ▼                             ▼
#      [media_mixer_input]            [tts_mixer_input]            [voip_mixer_input]
#               │                             │                             │
#               └─────────────────────────────┼─────────────────────────────┘
#                                             ▼
#                              ┌─────────────────────────────┐
#                              │   audio_mixer: 48 kHz mono  │
#                              └──────────────┬──────────────┘
#                                             ▼
#                                       [hw_speaker]
#                                             │
#                                             ▼
#                    [audio_stack shared-I2S TX → class-D amp → speaker]
#
# The three *_speaker_input nodes are resamplers; *_mixer_input are mixer ports.
# TTS, ringtone and timer files share the announcement pipeline, not VoIP RX.
# Reference labels above describe configured signal sources, not extra I2S buses.
#
# BOARD, WIRING AND USER CONTROLS
# -------------------------------
# Full-featured lightweight config: VoIP + Media Player + mixer + VA/MWW.
# For ESP32 boards where mic and speaker share the SAME I2S bus.
#
# HARDWARE (adapt GPIOs to YOUR board):
#   - Board: Any ESP32-S3 with PSRAM
#   - Flash: 4 MB or larger. This lite profile excludes Sendspin and uses SIZE.
#   - Microphone: Any I2S MEMS mic on DIN pin
#   - Speaker: Any I2S class-D amp on DOUT pin
#   - Mic and speaker SHARE BCLK + LRCLK (same I2S bus, full-duplex)
#   - LED: SK6812/WS2812 RGB (optional)
#   - ESP32-S3R8/S3R8V: do not use PSRAM pins for I2S/LED; the GPIOs below
#     are examples only and may need moving on those modules.
#
# GPIO PINOUT (example, change to match your wiring):
#   Shared I2S:  BCLK=GPIO36, LRCLK=GPIO37, DIN=GPIO35 (mic), DOUT=GPIO7 (speaker)
#   LED:         DATA=GPIO33
#

# =============================================================================
# PROJECT SETUP
# =============================================================================

substitutions:
  gmf_ai_audio_source: ""
  firmware_features: [voice, wake_word, voip, music, timers, status_led, diagnostics]
  # Hardware-shared identity: dropping firmware-variant suffix keeps build cache
  # and HA device entity stable across rebuilds.
  name: generic-s3
  friendly_name: Generic S3

  ext_components_source: "github://n-IA-hane/esphome-intercom@dev"
  voip_stack_components_source: "github://n-IA-hane/esphome-voip-stack@dev"
  audio_stack_components_source: "github://n-IA-hane/esphome-audio-stack@dev"
  runtime_controller_components_source: "github://n-IA-hane/esphome-runtime-controller@dev"

  assets_base: "https://github.com/n-IA-hane/esphome-intercom/raw/dev/"

  # Microphone ID for package mute switch
  mic_id: mic_main
  runtime_controller_led_preset: rgb_single

  # ---------------------------------------------------------------------------
  # Pinout: shared I2S bus
  # ---------------------------------------------------------------------------
  # BCLK/LRCLK are shared by mic and speaker on this full-duplex bus.
  i2s_bclk_pin: GPIO36
  i2s_lrclk_pin: GPIO37

  # ---------------------------------------------------------------------------
  # Pinout: microphone
  # ---------------------------------------------------------------------------
  i2s_din_pin: GPIO35

  # ---------------------------------------------------------------------------
  # Pinout: speaker
  # ---------------------------------------------------------------------------
  i2s_dout_pin: GPIO7

  # ---------------------------------------------------------------------------
  # Pinout: optional status LED
  # ---------------------------------------------------------------------------
  status_led_pin: GPIO33
  status_led_chipset: WS2812
  status_led_rgb_order: GRB

packages:
  device: github://n-IA-hane/esphome-intercom/packages/devices/generic-s3-lite-aec.yaml@dev
