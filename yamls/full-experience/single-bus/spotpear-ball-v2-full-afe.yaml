# =============================================================================
# SPOTPEAR BALL V2 - VOICE ASSISTANT + VOIP + WAKE WORD (esp_afe pipeline)
# Profile: FULL / single-mic AFE / round LVGL display
# Composition: Preset + component bindings + shared mixer/UI projection; player + LVGL stay here.
# Runtime facts: native media/VoIP/Wi-Fi/mute listeners; shared VA/MWW callbacks.
# YAML keeps user controls, board wiring and presentation hooks.
# Support: https://github.com/sponsors/n-IA-hane
# =============================================================================
#
# CAPTURE: ES8311 stereo RX; one microphone and the hardware DAC reference.
# [ES8311 RX left: microphone] ─────────────┐
# [ES8311 RX right: feedback REF] ──────────┤
#                                           ▼
#                              [audio_stack: 48 → 16 kHz]
#                                           │
#                                           ▼
#                            [afe_processor: AEC + NS + AGC]
#                                           │
#                                           ▼
#                                       [mic_afe]──┬─► VA
#                                                  ├─► MWW (barge-in)
#                                                  └─► VoIP TX
#
# PLAYBACK: speaker_media_player owns the media + announcement pipelines.
#       [HTTP / Sendspin]          [VA TTS / HTTP / files]              [VoIP RX]
#               │                             │                             │
#               ▼                             ▼                             │
#       [media_pipeline]           [announcement_pipeline]                  │
#               │                             │                             │
#               ▼                             ▼                             ▼
#     [media_speaker_input]          [tts_speaker_input]          [voip_speaker_input]
#           resampler                     resampler                     resampler
#               │                             │                             │
#               ▼                             ▼                             ▼
#      [media_mixer_input]            [tts_mixer_input]            [voip_mixer_input]
#               │                             │                             │
#               └─────────────────────────────┼─────────────────────────────┘
#                                             ▼
#                              ┌─────────────────────────────┐
#                              │   audio_mixer: 48 kHz mono  │
#                              └──────────────┬──────────────┘
#                                             ▼
#                                       [hw_speaker]
#                                             │
#                                             ▼
#                    [audio_stack I2S TX → ES8311 → amplifier → speaker]
#
# The three *_speaker_input nodes are resamplers; *_mixer_input are mixer ports.
# TTS, ringtone and timer files share the announcement pipeline, not VoIP RX.
# Reference labels above describe configured signal sources, not extra I2S buses.
#
# BOARD, WIRING AND USER CONTROLS
# -------------------------------
# Target board: Spotpear Ball v2 (ESP32-S3 with GC9A01A 240x240 round display,
# ES8311 mono codec, CST816 touch, GPIO0 button).
#
# Single GPIO0 button, page-aware:
#   VA idle           : click=start VA      | long (1-3s)=switch to VoIP
#   VA active         : click=stop VA
#   VoIP idle         : click=call          | double=next contact | long=switch to VA
#   VoIP dialer       : click=call number   | double=backspace    | long=switch to VA
#   VoIP ring in  : click=answer        | double=decline      | long=switch to VA
#   VoIP ring out : click=hangup        | long=switch to VA
#   VoIP in call  : click=hangup        | long=switch to VA
#   Timer ringing     : click=stop timer (any page)

# =============================================================================
# PROJECT SETUP
# =============================================================================

substitutions:
  gmf_ai_audio_source: ""
  firmware_features: [voice, wake_word, voip, music, sendspin, timers, status_led, display, diagnostics]
  runtime_controller_debug: "false"
  http_media_persistent_ring_buffer: "true"
  http_media_ring_buffer_size: "32768"
  sendspin_audio_ring_buffer_size: "262144"
  voip_audio_task_stacks_in_psram: "true"
  voip_tx_task_stack_size: "12288"
  voip_rx_task_stack_size: "12288"
  # Hardware-shared identity: all Spotpear Ball v2 firmware variants (voip / full-afe
  # / full-afe) share `spotpear-ball-v2` so a flash swap reuses the same HA device entity
  # and the same .esphome/build cache.
  name: spotpear-ball-v2
  friendly_name: Spotpear Ball v2
  mic_id: mic_afe
  afe_vad_restore_mode: ALWAYS_ON

  ext_components_source: "github://n-IA-hane/esphome-intercom@dev"
  voip_stack_components_source: "github://n-IA-hane/esphome-voip-stack@dev"
  audio_stack_components_source: "github://n-IA-hane/esphome-audio-stack@dev"
  runtime_controller_components_source: "github://n-IA-hane/esphome-runtime-controller@dev"

  assets_base: "https://github.com/n-IA-hane/esphome-intercom/raw/dev/"

  # AI avatar folder (${assets_base}assets/images/assistant/<ai_avatar>/)
  ai_avatar: default

  # Call layout proportions (relative to display_height)
  call_btn_size: "25%"
  call_btn_offset: "2%"
  call_btn_below_center: "19%"   # cornetta center between peer (50%) and battery overlay (82%)
  call_contacts_y: "31%"         # idle phonebook icon: visual midway between IDLE label (~y=58) and peer (~y=120)
  # Round 240x240 GC9A01: peer label widths derived from circle chord at the label's y.
  call_peer_width: "224"               # chord at y=120 (centre) minus 12 px side margin: idle/ringing_out/in_call
  call_ringing_in_peer_width: "139"    # call_ringing_in only: answer/decline buttons sit at LEFT_MID/RIGHT_MID at y=120
  call_title_width: "116"              # device-name title at y≈19 (8%): chord minus 12 px margin
  call_ended_text_width: "187"         # call_ended_page "Call ended" (y≈53) and "Reason:" (y≈139) labels: chord minus 12 px margin
  call_ended_reason_text_width: "177"  # call_ended_page reason text (dynamic) at y≈168: chord minus 12 px margin (above top_battery_label at y=197)
  # Settings page widths for the round 240x240 panel.
  settings_row_width: "170"
  settings_wide_width: "190"
  settings_mid_width: "170"
  settings_narrow_width: "150"
  settings_dropdown_width: "170"
  settings_slider_height: "12"
  settings_switch_width: "50"
  settings_switch_height: "26"
  settings_label_font: font_info
  settings_pad_row: "6"

  voice_assist_idle_phase_id: "1"
  voice_assist_listening_phase_id: "2"
  voice_assist_thinking_phase_id: "3"
  voice_assist_replying_phase_id: "4"
  voice_assist_not_ready_phase_id: "10"
  voice_assist_error_phase_id: "11"
  voice_assist_muted_phase_id: "12"
  runtime_controller_led_preset: spotpear_rgb

  # Font configuration
  font_glyphsets: "GF_Latin_Core"
  font_family: Figtree

  # Display constants
  display_width: "240"
  display_height: "240"

  # ---------------------------------------------------------------------------
  # Pinout: ES8311 codec control bus
  # ---------------------------------------------------------------------------
  codec_i2c_sda_pin: GPIO15
  codec_i2c_scl_pin: GPIO14

  # ---------------------------------------------------------------------------
  # Pinout: CST816 touch controller bus
  # ---------------------------------------------------------------------------
  touch_i2c_sda_pin: GPIO11
  touch_i2c_scl_pin: GPIO7

  # ---------------------------------------------------------------------------
  # Pinout: ES8311 audio bus
  # ---------------------------------------------------------------------------
  i2s_mclk_pin: GPIO16
  i2s_bclk_pin: GPIO9
  i2s_lrclk_pin: GPIO45
  i2s_din_pin: GPIO10
  i2s_dout_pin: GPIO8

  # ---------------------------------------------------------------------------
  # Pinout: board controls and display
  # ---------------------------------------------------------------------------
  battery_adc_pin: GPIO1
  main_button_pin: GPIO0
  speaker_enable_pin: GPIO46
  display_backlight_pin: GPIO42
  touch_interrupt_pin: GPIO12
  touch_reset_pin: GPIO6

# Shared packages: full VA/VoIP runtime, runtime controller, Spotpear LVGL
# navigation, ESP AFE controls, mixer/media player and assets.

packages:
  device: github://n-IA-hane/esphome-intercom/packages/devices/spotpear-ball-v2-full-afe.yaml@dev
