# =============================================================================
# SPOTPEAR BALL V2 - VOICE ASSISTANT + VOIP + WAKE WORD (esp_afe pipeline)
# =============================================================================
# Target board: Spotpear Ball v2 (ESP32-S3 with GC9A01A 240x240 round display,
# ES8311 mono codec, CST816 touch, GPIO0 button).
#
# Audio pipeline (esp_audio_stack @ 48 kHz, stereo AEC reference):
#
#   I2S RX 48kHz stereo -> L=mic R=ref -> esp_ae_rate_cvt x3 -> esp_afe (AEC+NS+AGC) -> mic_afe -> VA / VoIP TX / MWW
#
#   Music/radio -> media_speaker_input (resampler) -> mixer (48kHz)
#   VA TTS      -> tts_speaker_input (resampler)   -> mixer -> hw_speaker
#   VoIP RX     -> voip_speaker_input (resampler)  -> mixer -> ES8311
#
# Single GPIO0 button, page-aware:
#   VA idle           : click=start VA      | long (1-3s)=switch to VoIP
#   VA active         : click=stop VA
#   VoIP idle         : click=call          | double=next contact | long=switch to VA
#   VoIP dialer       : click=call number   | double=backspace    | long=switch to VA
#   VoIP ring in  : click=answer        | double=decline      | long=switch to VA
#   VoIP ring out : click=hangup        | long=switch to VA
#   VoIP in call  : click=hangup        | long=switch to VA
#   Timer ringing     : click=stop timer (any page)
# =============================================================================

# =============================================================================
# PROJECT SETUP
# =============================================================================

substitutions:
  runtime_controller_debug: "false"
  http_media_persistent_ring_buffer: "true"
  http_media_ring_buffer_size: "32768"
  sendspin_audio_ring_buffer_size: "262144"
  voip_audio_task_stacks_in_psram: "true"
  voip_tx_task_stack_size: "12288"
  voip_rx_task_stack_size: "12288"
  # Hardware-shared identity: all Spotpear Ball v2 firmware variants (voip / full-afe
  # / full-afe) share `spotpear-ball-v2` so a flash swap reuses the same HA device entity
  # and the same .esphome/build cache.
  name: spotpear-ball-v2
  friendly_name: Spotpear Ball v2
  mic_id: mic_afe
  afe_vad_restore_mode: ALWAYS_ON

  ext_components_source: "../../../esphome/components"
  voip_stack_components_source: "../../../../esphome-voip-stack/esphome/components"
  audio_stack_components_source: "../../../../esphome-audio-stack/esphome/components"
  runtime_controller_components_source: "../../../../esphome-runtime-controller/esphome/components"

  assets_base: "../../../"

  # AI avatar folder (${assets_base}assets/images/assistant/<ai_avatar>/)
  ai_avatar: default

  # Call layout proportions (relative to display_height)
  call_btn_size: "25%"
  call_btn_offset: "2%"
  call_btn_below_center: "19%"   # cornetta center between peer (50%) and battery overlay (82%)
  call_contacts_y: "31%"         # idle phonebook icon: visual midway between IDLE label (~y=58) and peer (~y=120)
  # Round 240x240 GC9A01: peer label widths derived from circle chord at the label's y.
  call_peer_width: "224"               # chord at y=120 (centre) minus 12 px side margin: idle/ringing_out/in_call
  call_ringing_in_peer_width: "139"    # call_ringing_in only: answer/decline buttons sit at LEFT_MID/RIGHT_MID at y=120
  call_title_width: "116"              # device-name title at y≈19 (8%): chord minus 12 px margin
  call_ended_text_width: "187"         # call_ended_page "Call ended" (y≈53) and "Reason:" (y≈139) labels: chord minus 12 px margin
  call_ended_reason_text_width: "177"  # call_ended_page reason text (dynamic) at y≈168: chord minus 12 px margin (above top_battery_label at y=197)
  # Settings page widths for the round 240x240 panel.
  settings_row_width: "170"
  settings_wide_width: "190"
  settings_mid_width: "170"
  settings_narrow_width: "150"
  settings_dropdown_width: "170"
  settings_slider_height: "12"
  settings_switch_width: "50"
  settings_switch_height: "26"
  settings_label_font: font_info
  settings_pad_row: "6"

  voice_assist_idle_phase_id: "1"
  voice_assist_listening_phase_id: "2"
  voice_assist_thinking_phase_id: "3"
  voice_assist_replying_phase_id: "4"
  voice_assist_not_ready_phase_id: "10"
  voice_assist_error_phase_id: "11"
  voice_assist_muted_phase_id: "12"
  runtime_controller_led_preset: spotpear_rgb

  # Font configuration
  font_glyphsets: "GF_Latin_Core"
  font_family: Figtree

  # Display constants
  display_width: "240"
  display_height: "240"

  # ---------------------------------------------------------------------------
  # Pinout: ES8311 codec control bus
  # ---------------------------------------------------------------------------
  codec_i2c_sda_pin: GPIO15
  codec_i2c_scl_pin: GPIO14

  # ---------------------------------------------------------------------------
  # Pinout: CST816 touch controller bus
  # ---------------------------------------------------------------------------
  touch_i2c_sda_pin: GPIO11
  touch_i2c_scl_pin: GPIO7

  # ---------------------------------------------------------------------------
  # Pinout: ES8311 audio bus
  # ---------------------------------------------------------------------------
  i2s_mclk_pin: GPIO16
  i2s_bclk_pin: GPIO9
  i2s_lrclk_pin: GPIO45
  i2s_din_pin: GPIO10
  i2s_dout_pin: GPIO8

  # ---------------------------------------------------------------------------
  # Pinout: board controls and display
  # ---------------------------------------------------------------------------
  battery_adc_pin: GPIO1
  main_button_pin: GPIO0
  speaker_enable_pin: GPIO46
  display_backlight_pin: GPIO42
  touch_interrupt_pin: GPIO12
  touch_reset_pin: GPIO6

# Shared packages: full VA/VoIP runtime, runtime controller, Spotpear LVGL
# navigation, ESP AFE controls, mixer/media player and assets.

packages:
  full_voice_voip_runtime: !include ../../../packages/presets/full_voice_voip_runtime.yaml
  runtime_controller: !include ../../../../esphome-runtime-controller/packages/runtime_controller/full_controller.yaml
  voice_assistant_runtime_controls: !include ../../../packages/voice_assistant/runtime_controls.yaml
  call_settings: !include ../../../packages/voip/call_settings.yaml
  ha_api: !include ../../../packages/voip/ha_api_runtime.yaml
  voice_assistant_local_commands: !include ../../../packages/voice_assistant/local_commands.yaml
  ota_maintenance: !include ../../../packages/ota/full_audio_lvgl_maintenance.yaml
  voip_transport: !include ../../../packages/voip/transport.yaml
  phonebook_subscribe: !include ../../../packages/voip/phonebook_subscribe.yaml
  s3_base: !include ../../../packages/platform/esp32s3_base.yaml
  native_diagnostics: !include ../../../packages/diagnostics/native.yaml
  status_led: !include ../../../packages/led/status_spotpear_ball_v2.yaml
  afe_entities: !include ../../../packages/esp_afe/single_mic_entities.yaml
  audio_stack_controls: !include ../../../packages/esp_audio_stack/controls.yaml
  speaker_power: !include ../../../packages/esp_audio_stack/speaker_power_output.yaml
  speaker_mixer: !include ../../../packages/audio/shared_mono_mixer_48k.yaml
  flac_codecs_psram: !include ../../../packages/audio/flac_codecs_psram.yaml
  sendspin_artwork: !include ../../../packages/media_player/sendspin_artwork.yaml
  lvgl_settings_nav: !include ../../../packages/lvgl/lvgl_settings_navigation.yaml
  lvgl_settings_sync_volumes: !include ../../../packages/lvgl/lvgl_settings_sync_volumes.yaml
  lvgl_settings_sync_mute: !include ../../../packages/lvgl/lvgl_settings_sync_mute.yaml
  lvgl_settings_sync_aec: !include ../../../packages/lvgl/lvgl_settings_sync_aec.yaml
  lvgl_settings_sync_va: !include ../../../packages/lvgl/lvgl_settings_sync_va.yaml
  spotpear_voip_nav: !include ../../../packages/lvgl/spotpear_voip/nav_full.yaml

# =============================================================================
# BOARD AND MEMORY
# =============================================================================

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%
      # Settings is a single vertical scroll page. The active dialer state is
      # retained while settings temporarily owns the screen.
      - lambda: |-
          id(g_settings_pages).clear();
          id(g_settings_pages).push_back(id(settings_continuous_page)->obj);
      - script.execute: backlight_timer
      - micro_wake_word.stop:
      - delay: 1s
      - lambda: id(peer_name) = id(phone).get_current_destination();
      - delay: 30s
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - globals.set:
                id: init_in_progress
                value: 'false'
            - script.execute: draw_display
            - script.execute: start_mww_when_ready

# ESP32-S3 target used by Spotpear Ball v2.

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      # -O2 codegen on our audio components: 5-15 % throughput on tight loops
      # (deinterleave, rate conversion, gain/scale, RMS) at the cost of +30-80 KB flash
      # and slightly higher stack peaks. Flash headroom is ~1.9 MB on this
      # build, audio_task stack has its own headroom from task_stack_size.
      compiler_optimization: PERF
    sdkconfig_options:
      # Keep the 8 MB PSRAM available to LVGL, audio, VoIP, MWW and Sendspin.
      # This full image is too large to mirror its flash instructions and
      # read-only data into PSRAM while retaining safe runtime headroom.
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "n"
      CONFIG_SPIRAM_RODATA: "n"
      # Keep TLS handshake/config memory short-lived on full audio builds.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA: "y"
      CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT: "y"

# OPI PSRAM is required by LVGL assets, codec buffers and full audio tasks.

psram:
  mode: octal
  speed: 80MHz

# =============================================================================
# EXTERNAL COMPONENTS
# =============================================================================

# Remote:
external_components:
  - source: ${voip_stack_components_source}
    components: [voip_stack]
  - source: ${ext_components_source}
    components: [audio_http, speaker, voice_assistant, spi]
  - source: ${runtime_controller_components_source}
    components: [runtime_controller]
  - source: ${audio_stack_components_source}
    components: [esp_audio_stack, esp_afe]

# The reducer owns large bounded rule/configuration tables but never touches
# them from ISR or DMA contexts. Keep those tables in PSRAM on this constrained
# full-audio S3 target while preserving the component's internal-RAM default.
runtime_controller:
  id: runtime
  storage_in_psram: true

# =============================================================================
# CONNECTIVITY
# =============================================================================

# High-performance network profile for Spotpear media + VoIP workloads.

network:
  enable_high_performance: true

# Normal Wi-Fi client mode. Power save is disabled for full audio stability and
# reliable HA API reconnects.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # ESP32 defaults to LIGHT power save; on full audio builds that can leave
  # the STA associated while ARP/API traffic stops. Keep realtime devices awake.
  power_save_mode: NONE
  on_connect:
    - script.execute: draw_display
  on_disconnect:
    - script.execute: draw_display

api:
  on_client_connected:
    - script.execute: draw_display

# USB Serial/JTAG logger. VoIP/audio domains stay visible at INFO; noisy entity
# domains stay WARN for normal field use.

logger:
  hardware_uart: USB_SERIAL_JTAG
  # DEBUG keeps SIP signaling + AEC/i2s lifecycle visible.
  # Mute chatty ESPHome built-ins below; project components stay at DEBUG.
  level: INFO
  logs:
    voip_stack: INFO
    voip_stack.fsm: INFO
    voip_stack.tcp: INFO
    voip_stack.udp: INFO
    voip_stack.audio: INFO
    voip_stack.settings: INFO
    sensor: WARN
    text_sensor: WARN
    binary_sensor: WARN
    switch: WARN
    number: WARN
    button: WARN
    api: WARN
    api.connection: WARN
    component: WARN

# SNTP clock used by LVGL status pages and diagnostics.

time:
  - platform: sntp
    id: my_time
    timezone: Europe/Rome
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

# =============================================================================
# BUSES
# =============================================================================

i2c:
  - id: i2c_bus
    sda: ${codec_i2c_sda_pin}
    scl: ${codec_i2c_scl_pin}
    scan: false
  - id: touchscreen_i2c_bus
    sda: ${touch_i2c_sda_pin}
    scl: ${touch_i2c_scl_pin}
    scan: false

spi:
  - id: spi_bus
    clk_pin: 4
    mosi_pin: 2

# =============================================================================
# OUTPUTS AND LIGHTS
# =============================================================================

output:
  - platform: gpio
    id: speaker_enable
    pin: ${speaker_enable_pin}
  - platform: ledc
    id: backlight_output
    pin: ${display_backlight_pin}
    inverted: true

# Round display backlight entity backed by GPIO42 PWM.

light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    icon: "mdi:brightness-6"
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# =============================================================================
# AUDIO PIPELINE
# =============================================================================

# AFE: Espressif front-end for mic cleanup, VAD, AEC, NS and AGC.
# Spotpear supplies the playback reference as the ES8311 stereo right channel.

esp_audio_stack:
  id: audio_stack
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}
  i2s_mclk_pin: ${i2s_mclk_pin}
  i2s_din_pin: ${i2s_din_pin}
  i2s_dout_pin: ${i2s_dout_pin}
  sample_rate: 48000             # I2S bus rate (ES8311 native)
  output_sample_rate: 16000      # Mic/AEC/MWW/VA output rate
  processor_id: afe_processor
  audio_effects:
    rate_cvt_complexity: 3
    rate_cvt_perf_type: speed
  num_channels: 2               # Drive DACL speaker and DACR AEC reference
  codec:
    i2c_id: i2c_bus
    input:
      type: es8311
      address: 0x18
      gain_db: 24.0
      use_mclk: true
      no_dac_ref: false
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: false
  # ES8311 digital feedback through the official codec driver: RX left is
  # ADC mic and RX right is DACR reference when no_dac_ref is false.
  # Sample-accurate reference alignment, no ring buffer delay needed.
  use_stereo_aec_reference: true
  reference_channel: right
  buffers_in_psram: true       # All audio buffers in PSRAM; required for 512-sample AEC frames
  audio_task_stack_in_psram: true   # Full VA + MWW + API needs internal heap headroom; keep only DMA/ESP-SR scratch internal.

esp_afe:
  id: afe_processor
  type: fd
  mode: high_perf
  mic_num: 1
  aec_enabled: true
  aec_filter_length: 4
  aec_nlp_level: normal
  se_enabled: false
  ns_enabled: true
  vad_enabled: true
  continuous_vad: true
  agc_enabled: true
  memory_alloc_mode: more_psram
  task_core: 1
  task_priority: 5
  ringbuf_size: 8
  feed_task_core: 0
  feed_task_priority: 5
  feed_task_stack_size: 3072
  fetch_task_core: 1
  fetch_task_priority: 5
  fetch_task_stack_size: 3072
  feed_buf_in_psram: false
  feed_ring_in_psram: true
  fetch_ring_in_psram: false

# =============================================================================
# Bus I2S: ES8311 shared backend for speaker, mic and AEC reference
# The bus runs at 48 kHz; Espressif rate conversion feeds 16 kHz to AFE/VA/VoIP.
# =============================================================================

microphone:
  - platform: esp_audio_stack
    id: mic_afe
    esp_audio_stack_id: audio_stack

speaker:
  - platform: esp_audio_stack
    id: hw_speaker
    esp_audio_stack_id: audio_stack
    sample_rate: 48000
    bits_per_sample: 16
    # ESPHome's mixer task can stop after all sources drain without forwarding
    # finish() to its output speaker. Bound the otherwise permanent silent TX
    # state; this is a lifecycle fail-safe, not an audio scheduling cadence.
    timeout: 1s

# =============================================================================
# MEDIA, ASSIST AND VOIP
# =============================================================================

# Sendspin media hub used by the full dashboard media experience.
sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

# Local FLAC assets for timer completion and VoIP ringing.

audio_file:
  - id: timer_finished_sound
    file: ${assets_base}assets/sounds/timer_finished.flac
  - id: voip_ringing_sound
    file: ${assets_base}assets/sounds/ringtone.flac

# Media sources for music, announcements, bundled sounds and Sendspin artwork.

media_source:
  - platform: audio_http
    id: media_http_source
    buffer_size: ${http_media_ring_buffer_size}
    task_stack_in_psram: true
    persistent_ring_buffer: ${http_media_persistent_ring_buffer}
  - platform: audio_http
    id: announcement_http_source
    buffer_size: ${http_media_ring_buffer_size}
    task_stack_in_psram: true
    persistent_ring_buffer: ${http_media_persistent_ring_buffer}
  - platform: audio_file
    id: announcement_file_source
    task_stack_in_psram: true
  - platform: sendspin
    id: sendspin_media_source
    sample_rate: 48000
    buffer_size: ${sendspin_audio_ring_buffer_size}
    task_stack_in_psram: true
    decode_memory: psram

# Speaker media player with separate media and announcement pipelines.

media_player:
  - platform: speaker_source
    name: None
    id: speaker_media_player
    internal: false
    volume_initial: 100%
    volume_min: 0%
    volume_max: 100%
    volume_increment: 5%
    media_pipeline:
      speaker: media_speaker_input
      sample_rate: 48000
      format: FLAC
      sources:
        - media_http_source
        - sendspin_media_source
    announcement_pipeline:
      speaker: tts_speaker_input
      format: FLAC
      sample_rate: 48000
      sources:
        - announcement_http_source
        - announcement_file_source
    on_announcement:
      - runtime_controller.event:
          id: runtime
          event: announcement_started
    on_play:
      - runtime_controller.event:
          id: runtime
          event: media_playing
      - script.execute: backlight_timer
    on_pause:
      - runtime_controller.event:
          id: runtime
          event: media_paused
      - script.execute: backlight_timer
    on_idle:
      - runtime_controller.event:
          id: runtime
          event: media_idle
      - delay: 200ms
      - script.execute: backlight_timer

# =============================================================================
# WAKE WORD & VOICE ASSISTANT
#
# MWW always-on (stop_after_detection: false) on mic_afe.
# SR linear AEC preserves spectral features for neural detection (10/10).
# Ducking is derived by runtime_controller from the active VA/media/VoIP policies.
# =============================================================================

micro_wake_word:
  id: mww
  microphone: mic_afe    # Post-AEC: SR linear AEC preserves spectral features
  stop_after_detection: false
  models:
    - model: alexa

# Voice Assistant uses post-AFE audio and the shared media player output.

voice_assistant:
  id: va
  microphone: mic_afe
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 0   # Standalone ESP-SR AEC path only
  auto_gain: 0dBFS             # Keep gain fixed for AEC/MWW stability
  volume_multiplier: 2.0
  on_timer_started:
    - script.execute: update_timer_state
  on_timer_cancelled:
    - script.execute: update_timer_state
  on_timer_updated:
    - script.execute: update_timer_state
  on_timer_tick:
    - script.execute: update_timer_state
  on_timer_finished:
    - runtime_controller.event:
        id: runtime
        event: timer_finished
    - script.execute: draw_display

voip_stack:
  task_stacks_in_psram: true   # save ~28KB internal heap on S3 PSRAM builds by placing task stacks in PSRAM
  audio_task_stacks_in_psram: ${voip_audio_task_stacks_in_psram}
  tx_task_stack_size: ${voip_tx_task_stack_size}
  rx_task_stack_size: ${voip_rx_task_stack_size}
  signaling_buffers_in_psram: true
  buffers_in_psram: true # VoIP staging buffers in PSRAM; AEC/AFE buffers live in esp_audio_stack
  id: phone
  # Optional local dial-plan alias published to HA. Keep it unique across your
  # devices; calls to the same extension become ambiguous and HA will use the
  # first matching phonebook entry.
  extension: "101"
  conference_groups: "CG Casa"
  conference_ring: false
  ring_groups: "RG Casa"
  audio:
    # SIP/RTP prefers the highest UDP-safe quality. TX is the AFE mic format,
    # with a 10 ms reframe available for peers that can drive the speaker at
    # 48 kHz/10 ms. RX is speaker-side audio through the resampler.
    tx:
      sample_rate: 16000
      pcm_format: s16le
      channels: 1
      frame_ms: 16
    tx_formats:
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 10
    rx:
      sample_rate: 48000
      pcm_format: s16le
      channels: 1
      frame_ms: 10
    # Additional accepted RX formats for direct ESP-to-ESP calls. These are valid
    # only because speaker: voip_speaker_input points at the resampler; do
    # not advertise additional formats when wiring voip_stack directly to a
    # fixed-rate mixer input.
    rx_formats:
      - sample_rate: 32000
        pcm_format: s16le
        channels: 1
        frame_ms: 16
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 10
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 16
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 32
  microphone: mic_afe
  speaker: voip_speaker_input
  ringing_timeout: 30s
  delete_contact_missing_from:
    updates_number: 1
  # Idle screen refresh hook: each merge cycle ends with publish_destination_,
  # so re-render so peer name + contact count reflect the new roster.
  on_phonebook_update:
    - lambda: id(peer_name) = destination;
    - script.execute: update_call_idle_labels
  on_destination_changed:
    - lambda: id(peer_name) = destination;
    - script.execute: update_call_idle_labels
    - script.execute: draw_display

# =============================================================================
# DISPLAY AND UI
# =============================================================================

display:
  - platform: mipi_spi
    id: s3_box_lcd
    model: GC9A01A
    invert_colors: true
    data_rate: 40MHz
    cs_pin: 5
    dc_pin: 47
    reset_pin:
      number: 38
    auto_clear_enabled: false
    dimensions:
      height: 240
      width: 240

# =============================================================================
# LVGL DISPLAY ENGINE
#
# Declarative widgets for VA + VoIP pages. Static idle image,
# mood-based replying backgrounds, timer overlay on top_layer.
# =============================================================================

touchscreen:
  - platform: cst816
    id: touch
    display: s3_box_lcd
    i2c_id: touchscreen_i2c_bus
    interrupt_pin: ${touch_interrupt_pin}
    reset_pin: ${touch_reset_pin}
    on_touch:
      - script.execute: backlight_timer
      - if:
          condition:
            runtime_controller.is_active:
              id: runtime
              activity: timer_ringing
          then:
            - runtime_controller.event:
                id: runtime
                event: timer_stopped
    # Gestures handled natively by LVGL on each page (on_swipe_up/down/left/right);
    # no manual dx/dy lambda needed. on_touch above is kept for backlight refresh.

font:
  - file:
      type: gfonts
      family: ${font_family}
      weight: 300
    id: font_response
    size: 15
    glyphsets:
      - ${font_glyphsets}
  - file:
      type: gfonts
      family: ${font_family}
      weight: 300
    id: font_timer
    size: 30
    glyphs: "0123456789:"
  - file:
      type: gfonts
      family: ${font_family}
      weight: 600
    id: font_clock
    size: 20
    glyphs: "0123456789:%"
    extras:
      - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
        glyphs:
          - "\U000F0079" # battery-100
          - "\U000F008E" # battery-alert (0%)
          - "\U000F007A" # battery-10
          - "\U000F007B" # battery-20
          - "\U000F007C" # battery-30
          - "\U000F007D" # battery-40
          - "\U000F007E" # battery-50
          - "\U000F007F" # battery-60
          - "\U000F0080" # battery-70
          - "\U000F0081" # battery-80
          - "\U000F0082" # battery-90
          - "\U000F0553" # battery-charging-100
          - "\U000F089F" # battery-charging-outline (0%)
          - "\U000F089C" # battery-charging-10
          - "\U000F0086" # battery-charging-20
          - "\U000F0087" # battery-charging-30
          - "\U000F0088" # battery-charging-40
          - "\U000F089D" # battery-charging-50
          - "\U000F0089" # battery-charging-60
          - "\U000F089E" # battery-charging-70
          - "\U000F008A" # battery-charging-80
          - "\U000F008B" # battery-charging-90
          - "\U000F08BF" # wifi-strength-outline (<20%)
          - "\U000F08BC" # wifi-strength-1 (<55%)
          - "\U000F08BD" # wifi-strength-2 (<80%)
          - "\U000F08BE" # wifi-strength-3 (>=80%)
          - "\U000F07D0" # home-assistant (HA connected)
          - "\U000F15D0" # home-alert (HA disconnected)
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: call_icons
    size: 42
    glyphs:
      - "\U000F03F2" # phone
      - "\U000F03F5" # phone-hangup
      - "\U000F0731" # arrow left bold
      - "\U000F0734" # arrow right bold
  # VoIP fonts
  - file:
      type: gfonts
      family: ${font_family}
      weight: 700
    id: font_title
    size: 24
    glyphsets:
      - GF_Latin_Core
    extras:
      - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
        glyphs:
          - "\U000F006E" # backspace
          - "\U000F06CB" # contacts (address book)
  - file:
      type: gfonts
      family: ${font_family}
      weight: 500
    id: font_state
    size: 28
    # Static call labels only: IDLE, RINGING, CALLING, IN CALL.
    # Explicit glyphs save ~150 KB flash vs GF_Latin_Core (319 glyphs).
    glyphs: " ACDEGILNR"
  - file:
      type: gfonts
      family: ${font_family}
      weight: 400
    id: font_info
    size: 20
    glyphsets:
      - GF_Latin_Core
  - file:
      type: gfonts
      family: Roboto Mono
      weight: 400
    id: font_page_counter
    size: 14
    glyphs: "0123456789/"

