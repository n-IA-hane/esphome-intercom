# GENERIC ESP32-S3 FULL AUDIO + VIDEO: one shared I2S bus, AEC and a DVP JPEG camera.
# Edit the substitutions below for your board, microphone, amplifier and camera.
# Reference hardware: Freenove FNK0085 N8R8, INMP441 and MAX98357A.
# Microphone/speaker operation and native SIP JPEG camera TX were exercised on this wiring.
# Adapt the pin and memory substitutions for other ESP32-S3 DVP-camera boards.
# Camera pinout reference: https://github.com/Freenove/Freenove_ESP32_S3_WROOM_Board
#
# Mic + amplifier share BCLK/WS; mic SD connects to DIN, amplifier DIN to DOUT.
# Power the INMP441 VDD and its right-channel L/R selector from 3V3, with a common GND.
# Audio Stack owns I2S and supplies the software playback reference to AEC.
# The bus/speaker run at 48 kHz; the processed microphone is 16 kHz for AEC/VA/MWW.
# The native camera sends JPEG over VoIP; this device does not need a display.
#
# This firmware is composed from packages. To inspect the complete configuration:
#   esphome config generic-s3-full-aec-camera.yaml

substitutions:
  name: generic-s3-audio-video
  friendly_name: Generic S3 Audio Video
  firmware_features: [voice, wake_word, voip, music, sendspin, timers, status_led, diagnostics, video]

  # Select the actual module memory. Full audio/video needs PSRAM and sufficient OTA space.
  board_type: freenove_esp32_s3_wroom
  board_flash_size: 8MB
  board_flash_mode: dio
  board_psram_mode: octal
  board_psram_speed: 80MHz

  # Shared I2S clocks and separate microphone/speaker data. Avoid camera/PSRAM pins.
  i2s_bclk_pin: GPIO14
  i2s_lrclk_pin: GPIO21
  i2s_din_pin: GPIO47
  i2s_dout_pin: GPIO1
  speaker_enable_pin: GPIO41  # Use "" if the amplifier enable is tied high.
  audio_mic_channel: right  # INMP441 L/R tied to 3V3 selects right; GND selects left.
  audio_bus_bits: 32
  audio_slot_bits: 32
  audio_task_core: 0

  # Native parallel DVP camera. Data pins are ordered D0 through D7.
  camera_sda_pin: GPIO4
  camera_scl_pin: GPIO5
  camera_xclk_pin: GPIO15
  camera_xclk_frequency: 20MHz
  camera_vsync_pin: GPIO6
  camera_href_pin: GPIO7
  camera_pclk_pin: GPIO13
  camera_data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]
  camera_width: 640
  camera_height: 480
  camera_framerate: 10
  camera_jpeg_quality: 10
  camera_frame_buffers: 1
  camera_idle_framerate: 0.1 fps
  camera_vertical_flip: true
  camera_horizontal_mirror: true

  # Optional addressable status LED.
  status_led_pin: GPIO48
  status_led_chipset: WS2812
  status_led_rgb_order: GRB
  runtime_controller_led_preset: rgb_single
  mic_id: mic_main

  ext_components_source: github://n-IA-hane/esphome-intercom@main
  voip_stack_components_source: github://n-IA-hane/esphome-voip-stack@main
  audio_stack_components_source: github://n-IA-hane/esphome-audio-stack@main
  runtime_controller_components_source: github://n-IA-hane/esphome-runtime-controller@main
  assets_base: https://github.com/n-IA-hane/esphome-intercom/raw/main/

packages:
  device: github://n-IA-hane/esphome-intercom/packages/devices/generic-s3-single-aec-camera.yaml@main
