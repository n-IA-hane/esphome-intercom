# =============================================================================
# Waveshare ESP32-S3-AUDIO-Board: VA + VoIP + MWW (no display)
# Profile: FULL / dual-mic AFE / LED and physical buttons
# Composition: Preset + component bindings + shared mono mixer/player; codec/AFE bindings below.
# Runtime facts: native media/VoIP/Wi-Fi/mute listeners; shared VA/MWW callbacks.
# YAML keeps user controls, board wiring and presentation hooks.
# Support: https://github.com/sponsors/n-IA-hane
# =============================================================================
#
# CAPTURE: hardware feedback and two physical microphones, 4-slot TDM.
# [ES7210 slots 0 + 2: microphones] ────────┐
# [ES7210 slot 1: ES8311 feedback REF] ─────┤
#                                           ▼
#                              [audio_stack: 48 → 16 kHz]
#                                           │
#                                           ▼
#                          [afe_processor: AEC + dual-mic SE]
#                                           │
#                                           ▼
#                                      [mic_main]──┬─► VA
#                                                  ├─► MWW (barge-in)
#                                                  └─► VoIP TX
# Slot 3 is unused. The reference comes from the configured ADC TDM slot.
#
# PLAYBACK: speaker_media_player owns the media + announcement pipelines.
#       [HTTP / Sendspin]          [VA TTS / HTTP / files]              [VoIP RX]
#               │                             │                             │
#               ▼                             ▼                             │
#       [media_pipeline]           [announcement_pipeline]                  │
#               │                             │                             │
#               ▼                             ▼                             ▼
#     [media_speaker_input]          [tts_speaker_input]          [voip_speaker_input]
#           resampler                     resampler                     resampler
#               │                             │                             │
#               ▼                             ▼                             ▼
#      [media_mixer_input]            [tts_mixer_input]            [voip_mixer_input]
#               │                             │                             │
#               └─────────────────────────────┼─────────────────────────────┘
#                                             ▼
#                              ┌─────────────────────────────┐
#                              │   audio_mixer: 48 kHz mono  │
#                              └──────────────┬──────────────┘
#                                             ▼
#                                       [hw_speaker]
#                                             │
#                                             ▼
#                     [audio_stack I2S TX → ES8311 → NS4150 → speaker]
#
# The three *_speaker_input nodes are resamplers; *_mixer_input are mixer ports.
# TTS, ringtone and timer files share the announcement pipeline, not VoIP RX.
# Reference labels above describe configured signal sources, not extra I2S buses.
#
# BOARD, WIRING AND USER CONTROLS
# -------------------------------
#
# Hardware:
#   - ESP32-S3R8 (16MB Flash, 8MB PSRAM octal)
#   - ES8311 Audio DAC (speaker) + ES7210 Audio ADC (dual mic array)
#   - NS4150 3W mono Class-D speaker amp (via TCA9555 EXIO pin 8)
#   - 7x WS2812 addressable RGB LEDs (GPIO38)
#   - 3 user buttons via TCA9555 (EXIO 9/10/11) + BOOT button (GPIO0)
#   - Battery: MX1.25 3.7V Li-ion connector + charging IC
#
# Pin Map:
#   I2S: MCLK=GPIO12 BCLK=GPIO13 LRCLK=GPIO14 DIN=GPIO15 DOUT=GPIO16
#   I2C: SDA=GPIO11 SCL=GPIO10 (ES8311@0x18, ES7210@0x40, TCA9555@0x20)
#   LEDs: GPIO38 (WS2812 x7)
#   BOOT: GPIO0
#
# Capture slot mapping (board-specific reference):
#
# Verified Waveshare ESP32-S3-AUDIO-Board slot map, board oriented with:
#   - speaker at the bottom
#   - GPIO/header connector at the top
#
# Empirical TDM mapping on this board:
#   - slot 2 = left microphone  (left of the GPIO connector)
#   - slot 0 = right microphone (right of the GPIO connector)
#   - slot 1 = playback reference used by AEC
#   - slot 3 = near-silent / unused on this board revision
#

# =============================================================================
# PROJECT SETUP
# =============================================================================

substitutions:
  gmf_ai_audio_source: ""
  firmware_features: [voice, wake_word, voip, music, sendspin, timers, status_led, diagnostics]
  runtime_controller_debug: "false"
  # Hardware-shared identity: all Waveshare S3 firmware variants share the same
  # name so HA reuses the device entity and ESPHome reuses the build cache.
  name: waveshare-s3
  friendly_name: Waveshare S3 Audio

  ext_components_source: "github://n-IA-hane/esphome-intercom@dev"
  voip_stack_components_source: "github://n-IA-hane/esphome-voip-stack@dev"
  audio_stack_components_source: "github://n-IA-hane/esphome-audio-stack@dev"
  runtime_controller_components_source: "github://n-IA-hane/esphome-runtime-controller@dev"

  assets_base: "https://github.com/n-IA-hane/esphome-intercom/raw/dev/"

  # Microphone ID for package mute switch
  mic_id: mic_main
  afe_aec_restore_mode: RESTORE_DEFAULT_ON
  runtime_controller_led_preset: ws2812_ring

  # ---------------------------------------------------------------------------
  # Pinout: shared codec/control I2C bus
  # ---------------------------------------------------------------------------
  codec_i2c_sda_pin: GPIO11
  codec_i2c_scl_pin: GPIO10

  # ---------------------------------------------------------------------------
  # Pinout: shared ES7210/ES8311 TDM audio bus
  # ---------------------------------------------------------------------------
  i2s_mclk_pin: GPIO12
  i2s_bclk_pin: GPIO13
  i2s_lrclk_pin: GPIO14
  i2s_din_pin: GPIO15
  i2s_dout_pin: GPIO16

  # ---------------------------------------------------------------------------
  # Pinout: board controls and status ring
  # ---------------------------------------------------------------------------
  boot_button_pin: GPIO0
  status_led_pin: GPIO38

packages:
  device: github://n-IA-hane/esphome-intercom/packages/devices/waveshare-s3-full-afe.yaml@dev
