# =============================================================================
# WAVESHARE ESP32-S3-TOUCH-LCD-1.85C-BOX V2 - VOICE ASSISTANT + VOIP + WAKE WORD
# =============================================================================
# Experimental target board: Waveshare ESP32-S3-Touch-LCD-1.85C-BOX V2
# (ESP32-S3R8, ST77916 360x360 round QSPI display, CST816 touch, TCA/PCA9554
# expander, ES8311 DAC, ES7210 ADC, NS4150B PA on GPIO15).
#
# V2 is required. Waveshare documents V1 with PCM5101 + digital MEMS mic and V2
# with ES8311 + ES7210 + dual analog microphones. This YAML targets V2/BOX only.
#
# Audio pipeline (esp_audio_stack @ 48 kHz, single-mic AEC):
#
#   ES7210 slot 0 mic + slot 1 hardware ref -> esp_ae_rate_cvt x3 -> esp_aec -> mic_afe -> VA / VoIP TX / MWW
#
#   Music/radio → media_speaker_input (resampler) ────────────┐
#   VA TTS      → tts_speaker_input (resampler) ──────────────┼── mixer (48kHz) → hw_speaker → ES8311
#   VoIP RX     → voip_speaker_input (resampler) ─────────────┘
#
# BOOT GPIO0 button, page-aware:
#   VA idle           : click=start VA      | long (1-3s)=switch to VoIP
#   VA active         : click=stop VA
#   VoIP idle     : click=call          | double=next contact | long=switch to VA
#   VoIP ring in  : click=answer        | double=decline      | long=switch to VA
#   VoIP ring out : click=hangup        | long=switch to VA
#   VoIP in call  : click=hangup        | long=switch to VA
#   Timer ringing     : click=stop timer (any page)
# =============================================================================

# =============================================================================
# PROJECT SETUP
# =============================================================================

substitutions:
  # Experimental board profile. Keep the slug stable across future variants so
  # ESPHome reuses the same HA device entity and build cache.
  name: waveshare-s3-touch-lcd-185c
  friendly_name: Waveshare S3 Touch LCD 1.85C
  mic_id: mic_afe
  afe_vad_restore_mode: ALWAYS_ON

  ext_components_source: "../../../esphome/components"
  voip_stack_components_source: "../../../../esphome-voip-stack/esphome/components"
  audio_stack_components_source: "../../../../esphome-audio-stack/esphome/components"
  runtime_controller_components_source: "../../../../esphome-runtime-controller/esphome/components"

  assets_base: "../../../"

  # AI avatar folder (${assets_base}assets/images/assistant/<ai_avatar>/)
  ai_avatar: default

  # Call layout proportions (relative to display_height)
  call_btn_size: "25%"
  call_btn_offset: "2%"
  call_btn_below_center: "19%"   # cornetta center between peer (50%) and battery overlay (82%)
  call_contacts_y: "31%"         # idle phonebook icon: visual midway between IDLE label (~y=58) and peer (~y=120)
  # Round 360x360 ST77916: peer label widths derived from circle chord at the label's y.
  call_peer_width: "224"               # chord at y=120 (centre) minus 12 px side margin: idle/ringing_out/in_call
  call_ringing_in_peer_width: "139"    # call_ringing_in only: answer/decline buttons sit at LEFT_MID/RIGHT_MID at y=120
  call_title_width: "116"              # device-name title at y≈19 (8%): chord minus 12 px margin
  call_ended_text_width: "187"         # call_ended_page "Call ended" (y≈53) and "Reason:" (y≈139) labels: chord minus 12 px margin
  call_ended_reason_text_width: "177"  # call_ended_page reason text (dynamic) at y≈168: chord minus 12 px margin (above top_battery_label at y=197)
  # Settings page widths for the round 360x360 panel.
  settings_row_width: "170"
  settings_wide_width: "190"
  settings_mid_width: "170"
  settings_narrow_width: "150"
  settings_dropdown_width: "170"
  settings_slider_height: "12"
  settings_switch_width: "50"
  settings_switch_height: "26"
  settings_label_font: font_info
  settings_pad_row: "6"

  voice_assist_idle_phase_id: "1"
  voice_assist_listening_phase_id: "2"
  voice_assist_thinking_phase_id: "3"
  voice_assist_replying_phase_id: "4"
  voice_assist_not_ready_phase_id: "10"
  voice_assist_error_phase_id: "11"
  voice_assist_muted_phase_id: "12"

  # Font configuration
  font_glyphsets: "GF_Latin_Core"
  font_family: Figtree

  # Display constants: ST77916 round LCD, 360x360.
  display_width: "360"
  display_height: "360"

  # ---------------------------------------------------------------------------
  # Pinout: shared board I2C bus.
  # ---------------------------------------------------------------------------
  board_i2c_sda_pin: GPIO11
  board_i2c_scl_pin: GPIO10

  # ---------------------------------------------------------------------------
  # Pinout: ES8311/ES7210 audio bus (Waveshare V2 docs).
  # ---------------------------------------------------------------------------
  i2s_mclk_pin: GPIO2
  i2s_bclk_pin: GPIO48
  i2s_lrclk_pin: GPIO38
  i2s_din_pin: GPIO39
  i2s_dout_pin: GPIO47

  # ---------------------------------------------------------------------------
  # Pinout: board controls and display
  # ---------------------------------------------------------------------------
  # Battery ADC is not published in Waveshare's visible pin table. Keep GPIO1 as
  # an experimental placeholder inherited from the Spotpear profile; verify on
  # hardware before relying on battery percentage.
  battery_adc_pin: GPIO1
  main_button_pin: GPIO0
  speaker_enable_pin: GPIO15
  display_backlight_pin: GPIO5
  touch_interrupt_pin: GPIO4
  display_qspi_clk_pin: GPIO40
  display_qspi_d0_pin: GPIO46
  display_qspi_d1_pin: GPIO45
  display_qspi_d2_pin: GPIO42
  display_qspi_d3_pin: GPIO41
  display_cs_pin: GPIO21
  display_reset_expander_pin: "2"

# Shared packages: full VA/VoIP runtime, runtime controller, round-display LVGL
# navigation, ESP AFE controls, mixer/media player and assets.

packages:
  full_voice_voip_runtime: !include ../../../packages/presets/full_voice_voip_runtime.yaml
  runtime_controller: !include ../../../../esphome-runtime-controller/packages/runtime_controller/full_controller_no_led.yaml
  voice_assistant_runtime_controls: !include ../../../packages/voice_assistant/runtime_controls.yaml
  call_settings: !include ../../../packages/voip/call_settings.yaml
  ha_api: !include ../../../packages/voip/ha_api_runtime.yaml
  voice_assistant_local_commands: !include ../../../packages/voice_assistant/local_commands.yaml
  ota_maintenance: !include ../../../packages/ota/full_audio_lvgl_maintenance.yaml
  voip_transport: !include ../../../packages/voip/transport.yaml
  phonebook_subscribe: !include ../../../packages/voip/phonebook_subscribe.yaml
  s3_base: !include ../../../packages/platform/esp32s3_base.yaml
  native_diagnostics: !include ../../../packages/diagnostics/native.yaml
  aec_entities: !include ../../../packages/esp_audio_stack/aec_controls.yaml
  audio_stack_controls: !include ../../../packages/esp_audio_stack/controls.yaml
  speaker_power: !include ../../../packages/esp_audio_stack/speaker_power_output.yaml
  speaker_mixer: !include ../../../packages/audio/shared_mono_mixer_48k.yaml
  flac_codecs_psram: !include ../../../packages/audio/flac_codecs_psram.yaml
  sendspin_artwork: !include ../../../packages/media_player/sendspin_artwork.yaml
  lvgl_settings_nav: !include ../../../packages/lvgl/lvgl_settings_navigation.yaml
  lvgl_settings_sync_volumes: !include ../../../packages/lvgl/lvgl_settings_sync_volumes.yaml
  lvgl_settings_sync_mute: !include ../../../packages/lvgl/lvgl_settings_sync_mute.yaml
  lvgl_settings_sync_aec: !include ../../../packages/lvgl/lvgl_settings_sync_aec.yaml
  lvgl_settings_sync_va: !include ../../../packages/lvgl/lvgl_settings_sync_va.yaml
  spotpear_voip_nav: !include ../../../packages/lvgl/spotpear_voip/nav_full.yaml

# =============================================================================
# BOARD AND MEMORY
# =============================================================================

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%
      - script.execute: compute_layout_metrics
      - script.execute: reposition_widgets
      # Settings is a single vertical scroll page. VoIP swipe-up opens it;
      # swipe-down at scroll top returns to VoIP.
      - lambda: |-
          id(g_settings_pages).clear();
          id(g_settings_pages).push_back(id(settings_continuous_page)->obj);
      - script.execute: backlight_timer
      - micro_wake_word.stop:
      - delay: 1s
      - lambda: id(peer_name) = id(phone).get_current_destination();
      - delay: 30s
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - globals.set:
                id: init_in_progress
                value: 'false'
            - script.execute: draw_display
            - script.execute: start_mww_when_ready

# ESP32-S3 target used by Waveshare ESP32-S3-Touch-LCD-1.85C.

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  # ESPHome 2026.7+ native ESP-IDF builds no longer consume PlatformIO's
  # board_build.partitions option. Keep the intentionally single-app layout
  # explicit here: the raw 360x360 LVGL assets do not fit in the default
  # dual-slot OTA table.
  partitions: partitions_16mb_huge_factory.csv
  framework:
    type: esp-idf
    advanced:
      # -O2 codegen on our audio components: 5-15 % throughput on tight loops
      # (deinterleave, rate conversion, gain/scale, RMS) at the cost of +30-80 KB flash
      # and slightly higher stack peaks. Flash headroom is ~1.9 MB on this
      # build, audio_task stack has its own headroom from task_stack_size.
      compiler_optimization: PERF
    sdkconfig_options:
      # Keep TLS handshake/config memory short-lived on full audio builds.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA: "y"
      CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT: "y"

# OPI PSRAM is required by LVGL assets, codec buffers and full audio tasks.

psram:
  mode: octal
  speed: 80MHz

# =============================================================================
# EXTERNAL COMPONENTS
# =============================================================================

# Remote:
external_components:
  - source: ${voip_stack_components_source}
    components: [voip_stack]
  - source: ${ext_components_source}
    components: [speaker, voice_assistant]
  - source: ${runtime_controller_components_source}
    components: [runtime_controller]
  - source: ${audio_stack_components_source}
    components: [esp_audio_stack, esp_aec]

# =============================================================================
# CONNECTIVITY
# =============================================================================

# High-performance network profile for full media + VoIP workloads.

network:
  enable_high_performance: true

# Normal Wi-Fi client mode. Power save is disabled for full audio stability and
# reliable HA API reconnects.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # ESP32 defaults to LIGHT power save; on full audio builds that can leave
  # the STA associated while ARP/API traffic stops. Keep realtime devices awake.
  power_save_mode: NONE
  on_connect:
    - script.execute: draw_display
  on_disconnect:
    - script.execute: draw_display

api:
  on_client_connected:
    - script.execute: draw_display

# OTA update endpoint used by ESPHome Dashboard and `esphome upload`.

ota:
  - platform: esphome
    id: ota_esphome

# USB Serial/JTAG logger. VoIP/audio domains stay visible at INFO; noisy entity
# domains stay WARN for normal field use.

logger:
  hardware_uart: USB_SERIAL_JTAG
  # DEBUG keeps SIP signaling + AEC/i2s lifecycle visible.
  # Mute chatty ESPHome built-ins below; project components stay at DEBUG.
  level: INFO
  logs:
    voip_stack: INFO
    voip_stack.fsm: INFO
    voip_stack.tcp: INFO
    voip_stack.udp: INFO
    voip_stack.audio: INFO
    voip_stack.settings: INFO
    sensor: WARN
    text_sensor: WARN
    binary_sensor: WARN
    switch: WARN
    number: WARN
    button: WARN
    api: WARN
    api.connection: WARN
    component: WARN

# SNTP clock used by LVGL status pages and diagnostics.

time:
  - platform: sntp
    id: my_time
    timezone: Europe/Rome
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

# =============================================================================
# BUSES
# =============================================================================

i2c:
  - id: i2c_bus
    sda: ${board_i2c_sda_pin}
    scl: ${board_i2c_scl_pin}
    scan: true

pca9554:
  - id: io_expander
    address: 0x20
    i2c_id: i2c_bus

spi:
  - id: display_qspi
    type: quad
    clk_pin: ${display_qspi_clk_pin}
    data_pins:
      - ${display_qspi_d0_pin}
      - ${display_qspi_d1_pin}
      - ${display_qspi_d2_pin}
      - ${display_qspi_d3_pin}

# =============================================================================
# OUTPUTS AND LIGHTS
# =============================================================================

output:
  - platform: gpio
    id: speaker_enable
    pin: ${speaker_enable_pin}
  - platform: ledc
    id: backlight_output
    pin: ${display_backlight_pin}
    inverted: false

# Round display backlight entity backed by the board BL PWM pin.

light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    icon: "mdi:brightness-6"
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# =============================================================================
# AUDIO PIPELINE
# =============================================================================

# AFE: Espressif front-end for mic cleanup, VAD, AEC, NS and AGC.
# The board has an ES7210 dual-mic ADC, but this experimental profile starts
# with one microphone only while still using the ES7210 TDM hardware reference.
# S3 + 360px LVGL + VA + MWW + VoIP is already tight; BSS/SE can be evaluated
# later after the single-mic path boots and plays.

esp_audio_stack:
  id: audio_stack
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}
  i2s_mclk_pin: ${i2s_mclk_pin}
  i2s_din_pin: ${i2s_din_pin}
  i2s_dout_pin: ${i2s_dout_pin}
  sample_rate: 48000             # I2S bus rate (ES8311 native)
  output_sample_rate: 16000      # Mic/AEC/MWW/VA output rate
  bits_per_sample: 16
  slot_bit_width: 16
  processor_id: aec_processor
  audio_effects:
    rate_cvt_complexity: 3
    rate_cvt_perf_type: speed
  num_channels: 2               # Drive DACL speaker and DACR AEC reference
  codec:
    i2c_id: i2c_bus
    input:
      type: es7210
      address: 0x40
      mic_selected: 0x0F
      gain_db: 24.0
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: true
  tdm_total_slots: 4
  tdm_mic_slot: 0
  use_tdm_reference: true
  tdm_ref_slot: 1
  buffers_in_psram: true       # All audio buffers in PSRAM; required for 512-sample AEC frames
  audio_task_stack_in_psram: true   # Full VA + MWW + API needs internal heap headroom; keep only DMA/ESP-SR scratch internal.

esp_aec:
  id: aec_processor
  sample_rate: 16000
  filter_length: 4
  mode: sr_low_cost

# =============================================================================
# Bus I2S: ES8311 shared backend for speaker, mic and AEC reference
# The bus runs at 48 kHz; Espressif rate conversion feeds 16 kHz to AFE/VA/VoIP.
# =============================================================================

microphone:
  - platform: esp_audio_stack
    id: mic_afe
    esp_audio_stack_id: audio_stack

speaker:
  - platform: esp_audio_stack
    id: hw_speaker
    esp_audio_stack_id: audio_stack
    sample_rate: 48000
    bits_per_sample: 16
    timeout: 1s

# =============================================================================
# MEDIA, ASSIST AND VOIP
# =============================================================================

# Sendspin media hub used by the full dashboard media experience.
sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

# Local FLAC assets for timer completion and VoIP ringing.

audio_file:
  - id: timer_finished_sound
    file: ${assets_base}assets/sounds/timer_finished.flac
  - id: voip_ringing_sound
    file: ${assets_base}assets/sounds/ringtone.flac

# Media sources for music, announcements, bundled sounds and Sendspin artwork.

media_source:
  - platform: audio_http
    id: media_http_source
    buffer_size: 65536
    task_stack_in_psram: true
  - platform: audio_http
    id: announcement_http_source
    buffer_size: 65536
    task_stack_in_psram: true
  - platform: audio_file
    id: announcement_file_source
    task_stack_in_psram: true
  - platform: sendspin
    id: sendspin_media_source
    sample_rate: 48000
    buffer_size: 262144
    task_stack_in_psram: true
    decode_memory: psram

# Speaker media player with separate media and announcement pipelines.

media_player:
  - platform: speaker_source
    name: None
    id: speaker_media_player
    internal: false
    volume_initial: 100%
    volume_min: 0%
    volume_max: 100%
    volume_increment: 5%
    media_pipeline:
      speaker: media_speaker_input
      sample_rate: 48000
      format: FLAC
      sources:
        - media_http_source
        - sendspin_media_source
    announcement_pipeline:
      speaker: tts_speaker_input
      format: FLAC
      sample_rate: 48000
      sources:
        - announcement_http_source
        - announcement_file_source
    on_announcement:
      - runtime_controller.event:
          id: runtime
          event: announcement_started
    on_play:
      - runtime_controller.event:
          id: runtime
          event: media_playing
      - script.execute: backlight_timer
    on_pause:
      - runtime_controller.event:
          id: runtime
          event: media_paused
      - script.execute: backlight_timer
    on_idle:
      - runtime_controller.event:
          id: runtime
          event: media_idle
      - delay: 200ms
      - script.execute: backlight_timer

# =============================================================================
# WAKE WORD & VOICE ASSISTANT
#
# MWW always-on (stop_after_detection: false) on mic_afe.
# SR linear AEC preserves spectral features for neural detection (10/10).
# Ducking is derived by runtime_controller from the active VA/media/VoIP policies.
# =============================================================================

micro_wake_word:
  id: mww
  microphone: mic_afe    # Post-AEC: SR linear AEC preserves spectral features
  stop_after_detection: false
  models:
    - model: alexa

# Voice Assistant uses post-AFE audio and the shared media player output.

voice_assistant:
  id: va
  microphone: mic_afe
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 0   # Standalone ESP-SR AEC path only
  auto_gain: 0dBFS             # Keep gain fixed for AEC/MWW stability
  volume_multiplier: 2.0
  on_timer_started:
    - script.execute: update_timer_state
  on_timer_cancelled:
    - script.execute: update_timer_state
  on_timer_updated:
    - script.execute: update_timer_state
  on_timer_tick:
    - script.execute: update_timer_state
  on_timer_finished:
    - runtime_controller.event:
        id: runtime
        event: timer_finished
    - script.execute: draw_display

voip_stack:
  task_stacks_in_psram: true   # save ~28KB internal heap on S3 PSRAM builds by placing task stacks in PSRAM
  buffers_in_psram: true # VoIP staging buffers in PSRAM; AEC/AFE buffers live in esp_audio_stack
  id: phone
  # Optional local dial-plan alias published to HA. Keep it unique across your
  # devices; calls to the same extension become ambiguous and HA will use the
  # first matching phonebook entry.
  extension: "101"
  audio:
    # SIP/RTP prefers the highest UDP-safe quality. TX is the AFE mic format,
    # with a 10 ms reframe available for peers that can drive the speaker at
    # 48 kHz/10 ms. RX is speaker-side audio through the resampler.
    tx:
      sample_rate: 16000
      pcm_format: s16le
      channels: 1
      frame_ms: 16
    tx_formats:
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 10
    rx:
      sample_rate: 48000
      pcm_format: s16le
      channels: 1
      frame_ms: 10
    # Additional accepted RX formats for direct ESP-to-ESP calls. These are valid
    # only because speaker: voip_speaker_input points at the resampler; do
    # not advertise additional formats when wiring voip_stack directly to a
    # fixed-rate mixer input.
    rx_formats:
      - sample_rate: 32000
        pcm_format: s16le
        channels: 1
        frame_ms: 16
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 10
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 16
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 32
  microphone: mic_afe
  speaker: voip_speaker_input
  ringing_timeout: 30s
  delete_contact_missing_from:
    updates_number: 1
  # Idle screen refresh hook: each merge cycle ends with publish_destination_,
  # so re-render so peer name + contact count reflect the new roster.
  on_phonebook_update:
    - lambda: id(peer_name) = destination;
    - script.execute: update_call_idle_labels
  on_destination_changed:
    - lambda: id(peer_name) = destination;
    - script.execute: update_call_idle_labels
    - script.execute: draw_display

# =============================================================================
# DISPLAY AND UI
# =============================================================================

display:
  - platform: qspi_dbi
    id: s3_box_lcd
    model: CUSTOM
    spi_id: display_qspi
    color_order: rgb
    invert_colors: true
    data_rate: 80MHz
    cs_pin: ${display_cs_pin}
    reset_pin:
      pca9554: io_expander
      number: ${display_reset_expander_pin}
    auto_clear_enabled: false
    dimensions:
      height: ${display_height}
      width: ${display_width}
    init_sequence:
      # Waveshare ST77916 init sequence for ESP32-S3-Touch-LCD-1.85C.
      - [0xF0, 0x28]
      - [0xF2, 0x28]
      - [0x73, 0xF0]
      - [0x7C, 0xD1]
      - [0x83, 0xE0]
      - [0x84, 0x61]
      - [0xF2, 0x82]
      - [0xF0, 0x00]
      - [0xF0, 0x01]
      - [0xF1, 0x01]
      - [0xB0, 0x56]
      - [0xB1, 0x4D]
      - [0xB2, 0x24]
      - [0xB4, 0x87]
      - [0xB5, 0x44]
      - [0xB6, 0x8B]
      - [0xB7, 0x40]
      - [0xB8, 0x86]
      - [0xBA, 0x00]
      - [0xBB, 0x08]
      - [0xBC, 0x08]
      - [0xBD, 0x00]
      - [0xC0, 0x80]
      - [0xC1, 0x10]
      - [0xC2, 0x37]
      - [0xC3, 0x80]
      - [0xC4, 0x10]
      - [0xC5, 0x37]
