lvgl:
  displays:
    - s3_box_lcd
  buffer_size: 50%
  color_depth: 16
  log_level: WARN
  top_layer:
    widgets:
      # Timer overlay bar (hidden by default, shown on idle/listening/thinking/muted)
      # Dimensions set by reposition_widgets from y_metrics[13] and y_metrics[2]
      - obj:
          id: timer_overlay
          align: TOP_MID
          width: 1
          height: 1
          bg_color: 0xFFFFFF
          border_color: 0x000000
          border_width: 1
          hidden: true
          widgets:
            - bar:
                id: timer_bar
                align: CENTER
                width: 1
                height: 1
                min_value: 0
                max_value: 100
                value: 50
                indicator:
                  bg_color: 0x26ED3A
            - label:
                id: timer_label
                align: CENTER
                text: ""
                text_color: 0x000000
                text_font: font_timer
      # Clock + battery/wifi status bar (always visible)
      - label:
          id: top_clock_label
          align: TOP_MID
          y: 90%
          text: ""
          text_color: 0xFFFFFF
          text_font: font_clock
      - label:
          id: top_battery_label
          align: TOP_MID
          y: 82%
          text: ""
          text_color: 0xFFFFFF
          text_font: font_clock
  pages:
    # ========================================================================
    # INITIALIZATION PAGE
    # ========================================================================
    - id: initializing_page
      bg_color: 0x000000
      widgets:
        - image:
            align: CENTER
            src: assistant_gui_initializing

    # ========================================================================
    # VA: IDLE PAGE
    # ========================================================================
    - id: idle_page
      bg_color: 0x000000
      on_swipe_up:
        - script.execute: swipe_to_voip
      widgets:
        # Idle animation: fwd 0→19 + 2s hold + bwd 18→0 = 55 frames @ 120ms = 6.6s
        - animimg:
            id: idle_anim
            align: CENTER
            width: 360
            height: 360
            src:
              - idle_00
              - idle_01
              - idle_02
              - idle_03
              - idle_04
              - idle_05
              - idle_06
              - idle_07
              - idle_08
              - idle_09
              - idle_10
              - idle_11
