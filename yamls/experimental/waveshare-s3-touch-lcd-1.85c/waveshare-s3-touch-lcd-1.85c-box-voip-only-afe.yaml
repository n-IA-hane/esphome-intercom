# =============================================================================
# Waveshare ESP32-S3-Touch-LCD-1.85C v2: BARE MINIMUM VoIP caller
#
# Tested by contributor; untested by maintainer.
# Contributor: Noxeus
# Source: https://github.com/n-IA-hane/esphome-intercom/issues/64
#
# This profile preserves the contributor's hardware-qualified audio path while
# completing the call-state UI callbacks needed by the maintained VoIP FSM.
# Compile validation does not constitute maintainer hardware qualification.
#
# One screen only: shows call/hangup button + status text, which switches
# appearance depending on call state (idle / ringing in / ringing out /
# in call). No voice assistant, no wake word, no settings page, no call
# history navigation. Just call and hang up.
# =============================================================================

substitutions:
  name: waveshare-s3-185c-voip
  friendly_name: "Waveshare S3 Touch LCD 1.85C VoIP"

  # Local sources keep repository builds reproducible. Release examples replace
  # these with the corresponding pinned public component revisions.
  voip_stack_components_source: "github://n-IA-hane/esphome-voip-stack@dev"
  audio_stack_components_source: "github://n-IA-hane/esphome-audio-stack@dev"

  i2s_mclk_pin: GPIO2
  i2s_bclk_pin: GPIO48
  i2s_lrclk_pin: GPIO38
  i2s_din_pin: GPIO39
  i2s_dout_pin: GPIO47
  speaker_enable_pin: GPIO15

external_components:
  - source: ${voip_stack_components_source}
    components: [voip_stack]
  - source: ${audio_stack_components_source}
    components: [esp_audio_stack, esp_afe]

packages:
  voip_transport: github://n-IA-hane/esphome-intercom/packages/voip/transport.yaml@dev
  phonebook_subscribe: github://n-IA-hane/esphome-intercom/packages/voip/phonebook_subscribe.yaml@dev
  ha_api: github://n-IA-hane/esphome-intercom/packages/voip/ha_api.yaml@dev
  ha_integration: github://n-IA-hane/esphome-intercom/packages/voip/ha_integration.yaml@dev
  afe_entities: github://n-IA-hane/esphome-intercom/packages/esp_afe/single_mic_entities.yaml@dev

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
    board_build.arduino.memory_type: qio_opi
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - output.turn_on: speaker_enable
      - script.execute: draw_call_screen

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_AND_LWIP_STACKS_IN_EXTERNAL_RAM: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  on_client_connected:
    - script.execute: draw_call_screen

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  on_connect:
    - script.execute: draw_call_screen
  on_disconnect:
    - script.execute: draw_call_screen

# =============================================================================
# HARDWARE: I2C, I/O Expander, Display, Touch
# =============================================================================

i2c:
  id: i2c_bus
  sda: GPIO11
  scl: GPIO10
  scan: true

pca9554:
  - id: pca9554_device
    address: 0x20

output:
  - platform: ledc
    pin: GPIO5
    id: backlight_pwm
  - platform: gpio
    id: speaker_enable
    pin: ${speaker_enable_pin}

light:
  - platform: monochromatic
    output: backlight_pwm
    id: display_backlight
    name: "Display Backlight"
    restore_mode: ALWAYS_ON

spi:
