# ==============================================================================================
# Waveshare S3 Touch LCD 1.85C V2 / minimal VoIP + AFE
# Status: contributor-tested (Noxeus); not hardware-qualified by the maintainer
# Support: https://github.com/sponsors/n-IA-hane
#
# Device package: packages/devices/waveshare-s3-box-v1-phone-afe.yaml
# Features: edit the firmware_features list below.
#
# Contributor-qualified 32 kHz bus and hardware reference:
# ┌─────────────────────────┐     ┌───────────────────────┐
# │  ES7210 TDM mic slot 0  ├────>│    32 kHz -> 16 kHz   ├───┐
# │     microphone input    │     │  audio_stack capture  │   │   ┌─────────────────────────┐
# └─────────────────────────┘     └───────────────────────┘   └──>│  esp_afe vc / low_cost  │
#                                                             ┌──>│    16 kHz processing    │
# ┌─────────────────────────┐     ┌───────────────────────┐   │   └────────────┬────────────┘
# │  ES7210 TDM ref slot 1  ├────>│    32 kHz -> 16 kHz   ├───┘                │
# │   AEC reference input   │     │ audio_stack reference │                    v
# └─────────────────────────┘     └───────────────────────┘       ┌─────────────────────────┐
#                                                                 │         mic_afe         │
#                                                                 │         VoIP TX         │
#                                                                 └─────────────────────────┘
#
# Direct playback (no mixer):
# ┌─────────────────────────┐    ┌─────────────────────────┐    ┌─────────────────────────┐
# │         VoIP RX         ├───>│    voip_speaker_input   ├───>│        hw_speaker       │
# │       decoded PCM       │    │   resampler to 32 kHz   │    │     ES8311 / 32 kHz     │
# └─────────────────────────┘    └─────────────────────────┘    └─────────────────────────┘
#
# One logical microphone; AFE AEC/NS/AGC enabled, VAD and dual-mic SE disabled.
# No Voice Assistant, MWW, media/TTS mixer or separate ringtone player is configured.
# ==============================================================================================

# =============================================================================
# Waveshare ESP32-S3-Touch-LCD-1.85C v2: BARE MINIMUM VoIP caller
#
# Tested by contributor; untested by maintainer.
# Contributor: Noxeus
# Source: https://github.com/n-IA-hane/esphome-intercom/issues/64
#
# This profile preserves the contributor's hardware-qualified audio path while
# completing the call-state UI callbacks needed by the maintained VoIP FSM.
# Compile validation does not constitute maintainer hardware qualification.
#
# One screen only: shows call/hangup button + status text, which switches
# appearance depending on call state (idle / ringing in / ringing out /
# in call). No voice assistant, no wake word, no settings page, no call
# history navigation. Just call and hang up.
# =============================================================================

substitutions:
  ext_components_source: "github://n-IA-hane/esphome-intercom@dev"
  runtime_controller_components_source: "github://n-IA-hane/esphome-runtime-controller@dev"
  gmf_ai_audio_source: ""
  firmware_features: [voip, display]
  name: waveshare-s3-185c-voip
  friendly_name: "Waveshare S3 Touch LCD 1.85C VoIP"

  # Local sources keep repository builds reproducible. Release examples replace
  # these with the corresponding pinned public component revisions.
  voip_stack_components_source: "github://n-IA-hane/esphome-voip-stack@dev"
  audio_stack_components_source: "github://n-IA-hane/esphome-audio-stack@dev"

  i2s_mclk_pin: GPIO2
  i2s_bclk_pin: GPIO48
  i2s_lrclk_pin: GPIO38
  i2s_din_pin: GPIO39
  i2s_dout_pin: GPIO47
  speaker_enable_pin: GPIO15

packages:
  device: github://n-IA-hane/esphome-intercom/packages/devices/waveshare-s3-box-v1-phone-afe.yaml@dev
