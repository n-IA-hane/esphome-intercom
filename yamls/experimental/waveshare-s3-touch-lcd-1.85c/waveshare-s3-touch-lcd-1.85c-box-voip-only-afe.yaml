touchscreen:
  platform: cst816
  id: my_touchscreen
  address: 0x15
  interrupt_pin: GPIO4
  skip_probe: true
  transform:
    mirror_x: true
    mirror_y: true

# =============================================================================
# AUDIO: esp_audio_stack owns the shared I2S bus in full-duplex mode so mic
# and speaker can run at the same time during a call (required for VoIP).
# =============================================================================

esp_audio_stack:
  id: audio_stack
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}
  i2s_mclk_pin: ${i2s_mclk_pin}
  i2s_din_pin: ${i2s_din_pin}
  i2s_dout_pin: ${i2s_dout_pin}
  sample_rate: 32000
  output_sample_rate: 16000
  bits_per_sample: 16
  slot_bit_width: 32
  correct_dc_offset: true
  processor_id: afe_processor
  audio_effects:
    rate_cvt_complexity: 3
    rate_cvt_perf_type: speed
  num_channels: 2
  codec:
    i2c_id: i2c_bus
    input:
      type: es7210
      address: 0x40
      mic_selected: 0x0F
      gain_db: 12.0
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: true
  tdm_total_slots: 4
  tdm_mic_slot: 0
  use_tdm_reference: true
  tdm_ref_slot: 1
  buffers_in_psram: true
  audio_task_stack_in_psram: true

esp_afe:
  id: afe_processor
  type: vc              # voice communication profile (VoIP), not sr (wake word/ASR)
  mode: low_cost         # lighter CPU load; switch to high_perf if quality needs it
  mic_num: 1             # TDM mic_slot 0 is a single logical mic channel
  aec_enabled: true
  aec_filter_length: 4
  aec_nlp_level: normal
  se_enabled: false      # requires 2 independent mic channels, not available here
  ns_enabled: true
  vad_enabled: false
  continuous_vad: true
  agc_enabled: true
  memory_alloc_mode: more_psram

microphone:
  - platform: esp_audio_stack
    id: mic_afe
    esp_audio_stack_id: audio_stack

speaker:
  - platform: esp_audio_stack
    id: hw_speaker
    esp_audio_stack_id: audio_stack
    sample_rate: 32000
    bits_per_sample: 16

  - platform: resampler
    id: voip_speaker_input
    output_speaker: hw_speaker
    bits_per_sample: 16

number:
  - platform: esp_audio_stack
    esp_audio_stack_id: audio_stack
    master_volume:
      name: "Speaker Volume"
      speaker_id: hw_speaker
    mic_gain:
      name: "Microphone Gain"


# =============================================================================
# FONTS AND ICONS
# =============================================================================

font:
  - file:
      type: gfonts
      family: Figtree
      weight: 700
    id: font_title
    size: 24
    glyphsets:
      - GF_Latin_Core
  - file:
      type: gfonts
      family: Figtree
      weight: 500
    id: font_state
    size: 28
    glyphs: " ACDEGILNR"
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: call_icons
    size: 48
    glyphs:
      - "\U000F03F2"
      - "\U000F03F5"

# =============================================================================
# LVGL: ONE screen only. Content and button behaviour change depending on
# the current call state (idle / ringing in / ringing out / in call).
# =============================================================================

lvgl:
  displays:
    - main_display
  touchscreens:
    - touchscreen_id: my_touchscreen
  buffer_size: 50%
  color_depth: 16
  log_level: WARN
  rotation: 180
  pages:
    - id: call_page
      bg_color: 0x000000
      widgets:
        - label:
            align: TOP_MID
            y: 30
            text: "${friendly_name}"
            text_color: 0xFFFFFF
            text_font: font_title
            text_align: CENTER
        - label:
            id: call_status_label
            align: CENTER
            y: -40
            text: "IDLE"
            text_color: 0x00FF00
            text_font: font_state
            text_align: CENTER
        - label:
            id: call_peer_label
            align: CENTER
            y: 10
            text: "-"
            text_color: 0xFFFFFF
            text_font: font_title
            text_align: CENTER
            width: 260
            long_mode: SCROLL
        - button:
            id: call_action_btn
            align: CENTER
            y: 100
            width: 90
            height: 90
            bg_color: 0x00AA00
            radius: 45
            widgets:
              - label:
                  id: call_action_icon
                  text: "\U000F03F2"
                  align: CENTER
                  text_color: 0xFFFFFF
                  text_font: call_icons
            on_short_click:
              - voip_stack.call_toggle:

# =============================================================================
# UI update logic: one script re-reads the call state and updates the single
# screen's text/color/button so it "switches" appearance during calls.
# =============================================================================

script:
  - id: draw_call_screen
    then:
      - lambda: |-
          auto s = id(phone).get_state_str();
          std::string status_text = "IDLE";
          uint32_t status_color = 0x00FF00;
          uint32_t btn_color = 0x00AA00;
          std::string icon = "\U000F03F2";
          std::string peer = id(phone).get_current_destination();

          if (s == "ringing") {
            status_text = "RINGING";
            status_color = 0xFFFF00;
            btn_color = 0x00AA00;
            icon = "\U000F03F2";
          } else if (s == "calling" || s == "remote_ringing") {
            status_text = "CALLING";
            status_color = 0xFFFF00;
            btn_color = 0xAA0000;
            icon = "\U000F03F5";
          } else if (s == "in_call" || s == "connecting") {
            status_text = "IN CALL";
            status_color = 0x00AAFF;
            btn_color = 0xAA0000;
            icon = "\U000F03F5";
          } else {
            status_text = "IDLE";
            status_color = 0x00FF00;
            btn_color = 0x00AA00;
            icon = "\U000F03F2";
          }

          lv_label_set_text(id(call_status_label), status_text.c_str());
          lv_obj_set_style_text_color(id(call_status_label), lv_color_hex(status_color), 0);
          lv_label_set_text(id(call_peer_label), peer.empty() ? "-" : peer.c_str());
          lv_label_set_text(id(call_action_icon), icon.c_str());
          lv_obj_set_style_bg_color(id(call_action_btn), lv_color_hex(btn_color), 0);

voip_stack:
  id: phone
  transport: udp
  microphone: mic_afe
  speaker: voip_speaker_input
  buffers_in_psram: true
  ringing_timeout: 30s
  audio:
    tx:
      sample_rate: 16000
      pcm_format: s16le
      channels: 1
      frame_ms: 20
    rx:
      sample_rate: 16000
      pcm_format: s16le
      channels: 1
      frame_ms: 20
  on_calling:
    - script.execute: draw_call_screen
  on_ringing:
    - script.execute: draw_call_screen
  on_dest_ringing:
    - script.execute: draw_call_screen
  on_in_call:
    - script.execute: draw_call_screen
  on_idle:
    - script.execute: draw_call_screen
  on_hangup:
    - logger.log:
        format: "Call ended: %s"
        args: ['reason.c_str()']
    - script.execute: draw_call_screen
  on_call_failed:
    - logger.log:
        format: "Call failed: %s"
        args: ['reason.c_str()']
    - script.execute: draw_call_screen
  on_phonebook_update:
    - script.execute: draw_call_screen
  on_destination_changed:
    - script.execute: draw_call_screen
