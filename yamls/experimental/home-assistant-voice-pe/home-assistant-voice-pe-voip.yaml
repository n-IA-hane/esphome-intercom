# ==============================================================================================
# Home Assistant Voice PE / native-audio VoIP overlay
# Status: experimental overlay; inherits the official Voice PE dev package
# Support: https://github.com/sponsors/n-IA-hane
#
# Main packages:
#   esphome/home-assistant-voice-pe/home-assistant-voice.yaml@dev
#   voip/transport.yaml; voip/call_settings.yaml
#
# Microphone boundary inherited from the official base:
# ┌─────────────────────────┐    ┌─────────────────────────┐    ┌─────────────────────────┐
# │      XMOS front end     ├───>│   i2s_mics / channel 0  ├───>│         VoIP TX         │
# │  base-owned processing  │    │    microphone_source    │    │     16 kHz mono PCM     │
# └─────────────────────────┘    └─────────────────────────┘    └─────────────────────────┘
#
# The local overlay adds one input to the existing mixer:
# ┌─────────────────────────┐    ┌─────────────────────────┐    ┌─────────────────────────┐
# │         VoIP RX         ├───>│ voip_resampling_speaker ├───>│      mixing_speaker     │
# │        48 kHz PCM       │    │    voip_mixing_input    │    │   official base output  │
# └─────────────────────────┘    └─────────────────────────┘    └─────────────────────────┘
#
# The official base owns its microphone processing, hardware speaker, media and announcements.
# This overlay does not declare a software-AEC node or reference binding; those remain upstream.
# The mixer extension preserves existing inputs; it is not a replacement audio stack.
# ==============================================================================================

# =============================================================================
# Home Assistant Voice PE + voip_stack experiment.
#
# This YAML keeps the official Voice PE audio stack intact and only adds the
# native VoIP layer. The Voice PE is not a Generic S3: its microphones are
# processed by the onboard XMOS voice front-end before ESPHome receives them.
#
# This is an experimental bring-up target, not a validated release preset.
# =============================================================================

# =============================================================================
# PROJECT SETUP
# =============================================================================

substitutions:
  name: ha-voice-pe-voip
  friendly_name: Home Assistant Voice PE VoIP
  ext_components_source: "github://n-IA-hane/esphome-intercom@dev"
  voip_stack_components_source: "github://n-IA-hane/esphome-voip-stack@dev"
  audio_stack_components_source: "github://n-IA-hane/esphome-audio-stack@dev"

# Start from the official Voice PE YAML, then add only VoIP transport,
# phonebook sync and HA call-control actions.

packages:
  voice_pe_base: github://esphome/home-assistant-voice-pe/home-assistant-voice.yaml@dev
  voip_transport: github://n-IA-hane/esphome-intercom/packages/voip/transport.yaml@dev
  voip_settings: github://n-IA-hane/esphome-intercom/packages/voip/call_settings.yaml@dev

# =============================================================================
# BOARD AND MEMORY
# =============================================================================

# Device identity. The MAC suffix keeps this experimental profile from
# colliding with a normal Voice PE already adopted in HA.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true

# =============================================================================
# EXTERNAL COMPONENTS
# =============================================================================

# Only project components that are missing from the official Voice PE base.

external_components:
  - source: ${voip_stack_components_source}
    components: [voip_stack]

# =============================================================================
# CONNECTIVITY
# =============================================================================

# Standard Wi-Fi credentials; the base package owns the rest of the Voice PE
# platform configuration.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# =============================================================================
# AUDIO PIPELINE
# =============================================================================

# Extend the official Voice PE mixer with a dedicated VoIP input.

speaker:
  # The official Voice PE mixer already combines media and announcements.
  # Add one more input for VoIP audio instead of replacing the hardware
  # speaker, DAC, sendspin, jack compensation or media player.
  - id: !extend mixing_speaker
    source_speakers:
      - id: voip_mixing_input
        timeout: never
        buffer_duration: 100ms
        sample_rate: 48000
        bits_per_sample: 32
        num_channels: 2

  - platform: resampler
    id: voip_resampling_speaker
    output_speaker: voip_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
    num_channels: 1

# =============================================================================
# MEDIA, ASSIST AND VOIP
# =============================================================================

# Local SIP phone using the Voice PE processed XMOS microphone and the extra
# mixer input above for RTP receive audio.

voip_stack:
  use_ha_as_first_contact: true
  id: phone
  audio:
    # The XMOS microphone produces 16 kHz PCM. Match the RX packet time;
    # auto would inherit 16 ms and leave no common TX/RX RTP cadence.
    tx:
      sample_rate: 16000
      pcm_format: s16le
      channels: 1
      frame_ms: 10
    rx:
      sample_rate: 48000
      pcm_format: s16le
      channels: 1
      frame_ms: 10
    # Plain SIP peers require a format usable in both directions. The
    # resampler accepts this fallback while its hardware output stays 48 kHz.
    rx_formats:
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 10
  microphone_source:
    microphone: i2s_mics
    channels: 0
  speaker: voip_resampling_speaker
  task_stacks_in_psram: true
  network_socket_headroom: 4
  ringing_timeout: 30s
  calling_timeout: 30s

  on_in_call:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 20
        duration: 0.0s

  on_idle:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s

  on_hangup:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s

  on_call_failed:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s

# =============================================================================
# RUNTIME LOGIC AND ENTITIES
# =============================================================================

# The official GPIO0 center button keeps all of its normal click/hold actions.
# Consume both edges of a press used to answer so its delayed single-click
# automation cannot also start Assist after the call has been accepted.

binary_sensor:
  - id: !extend center_button
    filters:
      - lambda: |-
          static bool voip_press_consumed = false;

          if (voip_press_consumed) {
            if (!x) {
              voip_press_consumed = false;
            }
            return {};
          }

          if (x && !id(center_button).state && id(phone).is_ringing() &&
              !id(init_in_progress) && !id(color_changed) &&
              !id(group_volume_changed) && !id(disable_buttons).state) {
            voip_press_consumed = true;
            id(phone).answer_call();
            return {};
          }

          return x;

# Optional HA buttons for manual call control from the ESPHome integration.

button:
  - platform: voip_stack
    voip_stack_id: phone
    call:
      name: Call
      id: call_button
      icon: mdi:phone
    next_contact:
      name: Next Contact
      id: next_contact_button
      icon: mdi:skip-next
    previous_contact:
      name: Previous Contact
      id: prev_contact_button
      icon: mdi:skip-previous
    decline:
      name: Decline
      id: decline_button
      icon: mdi:phone-hangup

api:
  custom_services: true
