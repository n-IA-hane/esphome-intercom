# ==============================================================================================
# ESP32-S3-BOX-3 / Assist + VoIP / single active ADC microphone
# Status: contributor-tested (mwhdc); not hardware-qualified by the maintainer
# Support: https://github.com/sponsors/n-IA-hane
#
# Device package: packages/devices/esp32-s3-box-3-aec.yaml
# Features: edit the firmware_features list below.
#
# Capture and software playback reference:
# ┌─────────────────────────┐     ┌───────────────────────┐
# │    ES7210 MIC1 (0x01)   ├────>│    48 kHz -> 16 kHz   ├───┐
# │     microphone input    │     │  audio_stack capture  │   │   ┌─────────────────────────┐
# └─────────────────────────┘     └───────────────────────┘   └──>│   esp_aec fd_high_perf  │
#                                                             ┌──>│    16 kHz processing    │
# ┌─────────────────────────┐     ┌───────────────────────┐   │   └────────────┬────────────┘
# │   PCM: previous_frame   ├────>│    48 kHz -> 16 kHz   ├───┘                │
# │   AEC reference input   │     │ audio_stack reference │                    v
# └─────────────────────────┘     └───────────────────────┘       ┌─────────────────────────┐
#                                                                 │         mic_main        │
#                                                                 │    VA / MWW / VoIP TX   │
#                                                                 └─────────────────────────┘
#
# Shared playback mixer (first column is a resampler input):
# ┌─────────────────────────┐
# │   media_speaker_input   ├────┐
# │    media_mixer_input    │    │    ┌──────────────────────┐      ┌─────────────────────────┐
# └─────────────────────────┘    ├───>│     audio_mixer      ├─────>│        hw_speaker       │
# ┌─────────────────────────┐    │    │     48 kHz mono      │      │   ES8311 DAC / 48 kHz   │
# │    tts_speaker_input    ├────┤    └──────────────────────┘      └─────────────────────────┘
# │     tts_mixer_input     │    │
# └─────────────────────────┘    │
# ┌─────────────────────────┐    │
# │    voip_speaker_input   ├────┘
# │     voip_mixer_input    │
# └─────────────────────────┘
#
# This preset enables one of the board's two wired microphones; it is not a dual-mic AFE.
# Box-3 has no hardware TDM reference in this configuration.
# Existing contributor notes, amplifier enable, LCD-backlight status and pin notes remain below.
# ==============================================================================================

# =============================================================================
# ESP32-S3-BOX-3 VOIP + VA AEC LIGHT - Single I2S bus, ES7210/ES8311 codec
# =============================================================================
# Tested by contributor; untested by maintainer.
# Contributor: mwhdc
# Source: https://github.com/n-IA-hane/esphome-intercom/issues/80
#
# The maintainer does not own this board. Repository validation covers YAML and
# compilation only; field behaviour remains based on the contributor's report.
#
# Adapted from yamls/full-experience/single-bus/generic-s3-full-aec.yaml and
# esphome/wake-word-voice-assistants/esp32-s3-box-3/esp32-s3-box-3.yaml
#
# Full-featured lightweight config: VoIP + Media Player + mixer + VA/MWW.
# Box-3 has a real ES7210 ADC + ES8311 DAC codec (unlike the no-codec generic-s3
# profile this file started from), so esp_audio_stack owns codec I2C init via
# its `codec:` block instead of talking to raw ADC/DAC-less I2S pins.
#
# HARDWARE (ESP32-S3-BOX-3):
#   - Board: esp32s3box (ESP32-S3R8, 16MB flash, octal PSRAM)
#   - Codec: ES7210 ADC (two wired microphones, one enabled here) + ES8311 DAC, both on I2C
#   - Mic and speaker SHARE BCLK + LRCLK (same I2S bus, full-duplex) + MCLK
#   - Speaker amp has a dedicated enable GPIO that must be driven high
#   - No addressable status LED on this board. runtime_controller's `outputs:
#     led:` is hard-required by full_controller.yaml (not optional), so this
#     profile repoints it at Box-3's own LCD backlight (monochromatic, GPIO47)
#     instead of the generic profile's WS2812 status_led package. Effects that
#     need an addressable strip (Ringing/Blink/pulses) silently no-op on a
#     monochromatic light; state changes still show as backlight brightness
#     steps.
#
# VERIFIED AGAINST COMPONENT SOURCE (esphome-audio-stack, esphome-runtime-
# controller checked out locally):
#   - codec.input.mic_selected passes straight through to Espressif's
#     es7210_codec_cfg_t.mic_selected bitmask (bit0=MIC1). Box-3 wires two
#     microphones; this contributor-tested baseline enables only MIC1 (0x01).
#     The sibling full-afe profile enables both microphones for field testing.
#   - codec.input.gain_db left at this component's own default (30.0 dB)
#     rather than copying Waveshare's tuned 24.0 dB, since Box-3's mic/PCB
#     differs and there's no evidence 24.0 is the right number here.
#   - slot_bit_width/correct_dc_offset from the no-codec generic-s3 profile
#     were dropped: those exist to frame raw MEMS-mic I2S bitstreams with no
#     codec register config. With ES7210/ES8311 present, esp_audio_stack's
#     own "auto" slot width (matches bits_per_sample) is what the validated
#     waveshare-s3-full-afe.yaml codec profile uses, so this follows suit.
#
# KNOWN OPEN QUESTIONS (monitor and adjust):
#   - mic_selected/gain_db above are correct in shape but not volume-tested;
#     adjust gain_db if capture is too quiet/clipped.
#   - codec.output.no_dac_ref mirrors aec_reference: previous_frame (software
#     reference instead of a hardware loopback reference); revisit together if
#     echo cancellation performs poorly.
#   - If perceived speaker volume seems too quiet in the low/mid range,
#     esp_audio_stack.master_volume_min_db: -30.0 is a documented fix for the
#     same ES8311 codec-dev default on waveshare-s3-full-afe.yaml; untested
#     here since amp circuits differ.
#
# GPIO PINOUT (from esp32-s3-box-3.yaml):
#   Codec I2C:  SDA=GPIO8, SCL=GPIO18
#   Shared I2S: MCLK=GPIO2, BCLK=GPIO17, LRCLK=GPIO45, DIN=GPIO16 (mic), DOUT=GPIO15 (speaker)
#   Speaker enable: GPIO46
#
# =============================================================================

# =============================================================================
# PROJECT SETUP
# =============================================================================

substitutions:
  gmf_ai_audio_source: ""
  firmware_features: [voice, wake_word, voip, music, sendspin, timers, display, status_led, sensor_dock, diagnostics]
  # Hardware-shared identity: dropping firmware-variant suffix keeps build cache
  # and HA device entity stable across rebuilds.
  name: esp32-s3-box-3
  friendly_name: ESP32-S3-Box-3

  # Local sources keep repository builds reproducible. Release examples replace
  # these with the corresponding pinned public component revisions.
  ext_components_source: "github://n-IA-hane/esphome-intercom@dev"
  voip_stack_components_source: "github://n-IA-hane/esphome-voip-stack@dev"
  audio_stack_components_source: "github://n-IA-hane/esphome-audio-stack@dev"
  runtime_controller_components_source: "github://n-IA-hane/esphome-runtime-controller@dev"

  assets_base: "https://github.com/n-IA-hane/esphome-intercom/raw/dev/"

  # Microphone ID for package mute switch
  mic_id: mic_main

  # runtime_controller's full_controller.yaml hard-requires an `outputs: led:`
  # light entity to exist (it is not optional there, even though the
  # runtime_controller component itself treats it as optional). Box-3 has no
  # addressable status LED, so this repoints it at the LCD backlight (`led`,
  # defined further down) instead of the generic profile's WS2812 status_led.
  # To detach the backlight from status and use a no-op entity instead (e.g.
  # to keep the screen on constantly or manage it elsewhere), override this
  # substitution and add the `status_led_null` light - see
  # esp32-s3-box-3-detached-backlight.yaml.
  runtime_controller_led_id: led
  runtime_controller_led_preset: rgb_single

  # ---------------------------------------------------------------------------
  # Pinout: shared codec/control I2C bus
  # ---------------------------------------------------------------------------
  codec_i2c_sda_pin: GPIO8
  codec_i2c_scl_pin: GPIO18

  # ---------------------------------------------------------------------------
  # Pinout: shared ES7210/ES8311 I2S bus
  # ---------------------------------------------------------------------------
  # BCLK/LRCLK/MCLK are shared by mic and speaker on this full-duplex bus.
  i2s_mclk_pin: GPIO2
  i2s_bclk_pin: GPIO17
  i2s_lrclk_pin: GPIO45

  # ---------------------------------------------------------------------------
  # Pinout: microphone
  # ---------------------------------------------------------------------------
  i2s_din_pin: GPIO16

  # ---------------------------------------------------------------------------
  # Pinout: speaker
  # ---------------------------------------------------------------------------
  i2s_dout_pin: GPIO15

packages:
  device: github://n-IA-hane/esphome-intercom/packages/devices/esp32-s3-box-3-aec.yaml@dev
