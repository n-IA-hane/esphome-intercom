# ==============================================================================================
# ESP32-S3-BOX-3 / display, touch and optional sensor-dock additions
# Status: optional contributor-tested overlay; no audio path is declared here
# Support: https://github.com/sponsors/n-IA-hane
#
# Main packages:
#   Parent: esp32-s3-box-3-full-aec.yaml
#   Requires parent I2C ids internal_i2c and external_i2c
#
# Dependency boundary (audio remains in the parent YAML):
# ┌─────────────────────────┐    ┌─────────────────────────┐    ┌─────────────────────────┐
# │   Parent core profile   ├───>│  This additions overlay ├───>│  Shared parent I2C ids  │
# │   codec + AEC + mixer   │    │  display / touch / dock │    │   hardware integration  │
# └─────────────────────────┘    └─────────────────────────┘    └─────────────────────────┘
#
# The connection above is a configuration dependency, not an audio signal path.
# Removing this overlay removes its UI/dock hardware declarations; it does not reroute audio.
# ==============================================================================================

# =============================================================================
# Box-3 additions - NOT part of esphome-intercom's core audio/VoIP path
# =============================================================================
# Tested by contributor; untested by maintainer.
# Contributor: mwhdc
# Source: https://github.com/n-IA-hane/esphome-intercom/issues/80
#
# Two independent, optional groups relative to the core profile
# (esp32-s3-box-3-full-aec.yaml). Kept in one separate file, included via a
# single `packages:` line, so dropping either (or both) means deleting
# entries here rather than hunting through the core profile.
#
# Requires (defined in the parent yaml):
#   i2c bus id `internal_i2c` - shared with the ES7210/ES8311 codec, GPIO8/18
#     (the stock esp32-s3-box-3.yaml reference calls this bus `i2c_adc_dac`
#     instead; renamed here to match this profile's naming)
#   i2c bus id `external_i2c` - GPIO41 sda / GPIO40 scl, only needed for the
#     ESP32-S3-BOX-3-SENSOR dock group below
# =============================================================================

# -----------------------------------------------------------------------------
# Display + touch - integral Box-3 hardware (every unit has this)
# -----------------------------------------------------------------------------
# Hardware wiring only, no pages/UI yet (that's the follow-up "icing on the
# cake" step). update_interval: never means nothing renders until a page is
# added and explicitly shown/updated. Home Button is a fixed capacitive zone
# on the same GT911 touch controller, not a separate part.

packages:
  display: github://n-IA-hane/esphome-intercom/packages/board/box3/display_legacy.yaml@dev
  sensor_dock: github://n-IA-hane/esphome-intercom/packages/board/box3/sensor_entities.yaml@dev
