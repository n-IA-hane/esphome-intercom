# ESP32-S3-BOX-3 / FULL / experimental dual-microphone AFE
# Derived from the contributor-tested AEC profile by mwhdc (issue #80).
# Dual-mic request: https://github.com/n-IA-hane/esphome-intercom/issues/116
# Maintainer has no BOX-3: compile validation is not hardware qualification.
# Keep esp32-s3-box-3-full-aec.yaml as the single-mic reference.
#
#  MIC1 + MIC2 -> ES7210 (0x40) -> STD I2S left/right -> dual-mic AFE
#                                                       ^       |
#  Speaker playback -> software AEC reference -----------+       v
#                                                     mono microphone
#                                                     MWW / Assist / VoIP
#  Media / TTS / VoIP -> mixer -> ES8311 (0x18) -> amplifier / speaker
#
# Two physical microphones share the ES7210 data output on GPIO16.
# Select ADC MIC1/MIC2 (0x03), capture both STD slots and feed MMR to AFE.
# There is no hardware playback-reference slot in this configuration.
# Do not copy the Waveshare four-slot TDM mapping onto this board.
#
# Codec I2C GPIO8/18; I2S MCLK2, BCLK17, LRCLK45, DIN16, DOUT15; amp46.
# Existing display, touch, dock, buttons and playback configuration are retained.
# Low-cost FD keeps both microphones, AEC and speech enhancement enabled.
# This first candidate requires measurements of channel levels, echo, available
# internal/DMA memory and concurrent Assist/VoIP/media operation on real hardware.
# Support: https://github.com/sponsors/n-IA-hane

substitutions:
  # Hardware-shared identity: dropping firmware-variant suffix keeps build cache
  # and HA device entity stable across rebuilds.
  name: esp32-s3-box-3
  friendly_name: ESP32-S3-Box-3

  # Local sources keep repository builds reproducible. Release examples replace
  # these with the corresponding pinned public component revisions.
  ext_components_source: "github://n-IA-hane/esphome-intercom@main"
  voip_stack_components_source: "github://n-IA-hane/esphome-voip-stack@main"
  audio_stack_components_source: "github://n-IA-hane/esphome-audio-stack@main"
  runtime_controller_components_source: "github://n-IA-hane/esphome-runtime-controller@main"

  assets_base: "https://github.com/n-IA-hane/esphome-intercom/raw/main/"

  # Microphone ID for package mute switch
  mic_id: mic_main

  # runtime_controller's full_controller.yaml hard-requires an `outputs: led:`
  # light entity to exist (it is not optional there, even though the
  # runtime_controller component itself treats it as optional). Box-3 has no
  # addressable status LED, so this repoints it at the LCD backlight (`led`,
  # defined further down) instead of the generic profile's WS2812 status_led.
  # To detach the backlight from status and use a no-op entity instead (e.g.
  # to keep the screen on constantly or manage it elsewhere), override this
  # substitution and add the `status_led_null` light - see
  # esp32-s3-box-3-detached-backlight.yaml.
  runtime_controller_led_id: led
  runtime_controller_led_preset: rgb_single

  # ---------------------------------------------------------------------------
  # Pinout: shared codec/control I2C bus
  # ---------------------------------------------------------------------------
  codec_i2c_sda_pin: GPIO8
  codec_i2c_scl_pin: GPIO18

  # ---------------------------------------------------------------------------
  # Pinout: shared ES7210/ES8311 I2S bus
  # ---------------------------------------------------------------------------
  # BCLK/LRCLK/MCLK are shared by mic and speaker on this full-duplex bus.
  i2s_mclk_pin: GPIO2
  i2s_bclk_pin: GPIO17
  i2s_lrclk_pin: GPIO45

  # ---------------------------------------------------------------------------
  # Pinout: microphone
  # ---------------------------------------------------------------------------
  i2s_din_pin: GPIO16

  # ---------------------------------------------------------------------------
  # Pinout: speaker
  # ---------------------------------------------------------------------------
  i2s_dout_pin: GPIO15

packages:
  full_voice_voip_runtime: github://n-IA-hane/esphome-intercom/packages/presets/full_voice_voip_runtime.yaml@main
  runtime_controller: github://n-IA-hane/esphome-runtime-controller/packages/runtime_controller/full_controller.yaml@main
  voice_assistant_runtime_controls: github://n-IA-hane/esphome-intercom/packages/voice_assistant/runtime_controls.yaml@main
  call_settings: github://n-IA-hane/esphome-intercom/packages/voip/call_settings.yaml@main
  ha_api: github://n-IA-hane/esphome-intercom/packages/runtime/ha_connectivity.yaml@main
  voice_assistant_local_commands: github://n-IA-hane/esphome-intercom/packages/voice_assistant/local_commands.yaml@main
  ota_maintenance: github://n-IA-hane/esphome-intercom/packages/ota/full_audio_maintenance.yaml@main
  voip_transport: github://n-IA-hane/esphome-intercom/packages/voip/transport.yaml@main
  speaker_mute: github://n-IA-hane/esphome-intercom/packages/voip/speaker_mute_runtime.yaml@main
  s3_base: github://n-IA-hane/esphome-intercom/packages/platform/esp32s3_base.yaml@main
  native_diagnostics: github://n-IA-hane/esphome-intercom/packages/diagnostics/native.yaml@main
  speaker_mixer: github://n-IA-hane/esphome-intercom/packages/audio/shared_mono_mixer_48k.yaml@main
  speaker_media_player: github://n-IA-hane/esphome-intercom/packages/media_player/runtime_controller_mono_media_player_48k.yaml@main
  va_timers: github://n-IA-hane/esphome-intercom/packages/voice_assistant/timers_runtime.yaml@main
  audio_stack_controls: github://n-IA-hane/esphome-intercom/packages/esp_audio_stack/controls.yaml@main
  afe_entities: github://n-IA-hane/esphome-intercom/packages/esp_afe/dual_mic_entities.yaml@main
  # Not part of esphome-intercom - Box-3 display/touch hardware plus the
  # optional ESP32-S3-BOX-3-SENSOR dock. Safe to delete this one line + its
  # file on a headless build, a different board, or a unit without the dock.
  box3_additions: github://n-IA-hane/esphome-intercom/yamls/experimental/esp32-s3-box-3/esp32-s3-box-3-additions.yaml@main

# =============================================================================
# BOARD AND MEMORY
# =============================================================================

# Device identity exposed to ESPHome, HA and the shared VoIP phonebook.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Required by the mipi_spi S3BOX display model, per the stock
  # esp32-s3-box-3.yaml reference this hardware profile is derived from.
  min_version: 2026.9.0
  platformio_options:
    board_build.flash_mode: dio

# ESP32-S3-BOX-3 target and ESP-IDF tuning.

esp32:
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      # Allow mbedtls to allocate its working buffers in PSRAM.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      # Route ESP-IDF stdout (and ESPHome logger when hardware_uart=USB_SERIAL_JTAG)
      # to the built-in USB-Serial-JTAG peripheral. Box-3's USB-C connector is
      # wired to the S3's native USB-Serial-JTAG peripheral.
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: "y"
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: "y"
      # Keep Wi-Fi buffering below ESPHome's streaming high-performance preset
      # (64 dynamic RX + 64 dynamic TX + BA windows 32), matching the validated
      # waveshare-s3-full-afe.yaml profile's full-duplex resource-pressure
      # handling (see network: enable_high_performance below). Not the fix for
      # the Sendspin discovery issue - that's esphome#17742 / the ESP-IDF
      # version pin above.
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "10"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_TX_BA_WIN: "16"
      CONFIG_ESP_WIFI_RX_BA_WIN: "16"

# Box-3 uses octal PSRAM (not the quad PSRAM on generic devkit-style boards).

psram:
  mode: octal
  speed: 80MHz

# Persist user settings without excessive flash writes.

preferences:
  flash_write_interval: 5min

# =============================================================================
# EXTERNAL COMPONENTS
# =============================================================================

# Project components for full VA/VoIP, runtime controller and codec AEC.

external_components:
  - source: ${voip_stack_components_source}
    components: [voip_stack]
  - source: ${ext_components_source}
    components: [speaker, voice_assistant]
  - source: ${runtime_controller_components_source}
    components: [runtime_controller]
  - source: ${audio_stack_components_source}
    components: [esp_audio_stack, esp_afe]

# =============================================================================
# CONNECTIVITY
# =============================================================================

# The speaker media player requests high-performance networking by default,
# which expands lwIP to 65KB TCP windows and 64-entry mailboxes. Matches the
# validated waveshare-s3-full-afe.yaml profile, which disables this for the
# same full-duplex audio + api + sendspin combination this profile also runs.

network:
  enable_high_performance: false

# Normal Wi-Fi client mode. Power save is disabled for low-latency SIP/RTP and
# reliable HA API updates.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

# Home Assistant native API for entities, service actions and phonebook sync.

api:
  custom_services: true
# OTA update endpoint used by ESPHome Dashboard and `esphome upload`.

ota:
  - platform: esphome

# USB Serial/JTAG logger. VoIP and audio domains stay visible at INFO; noisy
# entity domains stay WARN for normal field use.

logger:
  hardware_uart: USB_SERIAL_JTAG
  # DEBUG keeps SIP signaling + AEC/AFE/i2s lifecycle visible.
  # Mute chatty ESPHome built-ins below; project components stay at DEBUG.
  level: INFO
  logs:
    voip_stack: INFO
    voip_stack.fsm: INFO
    voip_stack.tcp: INFO
    voip_stack.udp: INFO
    voip_stack.audio: INFO
    voip_stack.settings: INFO
    sensor: WARN
    text_sensor: WARN
    binary_sensor: WARN
    switch: WARN
    number: WARN
    button: WARN
    api: WARN
    api.connection: WARN
    component: WARN
    api.service: INFO
    light: INFO
    select: INFO
    speaker: INFO
    audio: INFO
    micro_wake_word: INFO
    voice_assistant: INFO
    media_player: INFO
    resampler: INFO
    mixer_speaker: INFO
    wifi: INFO
    json: INFO

# =============================================================================
# BUSES
# =============================================================================

i2c:
  - id: internal_i2c
    sda: ${codec_i2c_sda_pin}
    scl: ${codec_i2c_scl_pin}
    scan: false
  - id: external_i2c
    sda: GPIO41
    scl: GPIO40
    scan: true
    sda_pullup_enabled: true
    scl_pullup_enabled: true
    frequency: 50kHz

# =============================================================================
# AUDIO PIPELINE
# =============================================================================

esp_audio_stack:
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}
  i2s_mclk_pin: ${i2s_mclk_pin}
  i2s_din_pin: ${i2s_din_pin}
  i2s_dout_pin: ${i2s_dout_pin}
  sample_rate: 48000
  output_sample_rate: 16000
  processor_id: afe_processor
  # Software AEC reference (no hardware loopback/TDM reference slot on Box-3).
  aec_reference: previous_frame
  rx_slot_mode: stereo
  rx_mic_slots: [left, right]
  buffers_in_psram: true
  codec:
    i2c_id: internal_i2c
    input:
      type: es7210
      address: 0x40
      # STD I2S maps MIC1/MIC2 to left/right in esp_codec_dev.
      mic_selected: 0x03
      # Component default (30.0dB); no board-specific data to justify changing it.
      gain_db: 30.0
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: true

esp_afe:
  id: afe_processor
  type: fd
  mode: low_cost
  mic_num: 2
  se_enabled: true
  aec_enabled: true
  ns_enabled: false
  agc_enabled: false
  vad_enabled: true
  aec_filter_length: 4
  memory_alloc_mode: more_psram
  task_core: 1
  task_priority: 5
  feed_task_core: 0
  fetch_task_core: 1
  feed_buf_in_psram: true
  feed_ring_in_psram: true
  fetch_ring_in_psram: true

microphone:
  - platform: esp_audio_stack
    id: mic_main

speaker:
  - platform: esp_audio_stack
    id: hw_speaker
    sample_rate: 48000
    bits_per_sample: 16
    timeout: 1s

# =============================================================================
# MEDIA, ASSIST AND VOIP
# =============================================================================

micro_wake_word:
  microphone: mic_main
  models:
    - model: alexa

voice_assistant:
  microphone: mic_main
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0

runtime_controller:
  storage_in_psram: true

voip_stack:
  use_ha_as_first_contact: true
  task_stacks_in_psram: true   # save ~28KB internal heap on S3 by placing task stacks in PSRAM
  signaling_buffers_in_psram: true
  buffers_in_psram: true # VoIP staging buffers in PSRAM; AEC/AFE buffers live in esp_audio_stack
  audio:
    # Primary/preferred RTP profile: 48 kHz/10 ms toward the speaker, and a
    # matching 10 ms TX reframe of the 16 kHz AEC mic for peers that negotiate
    # ptime 10. 32 kHz/16 ms remains an alternate advertised format.
    tx_formats:
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 10
    rx:
      sample_rate: 48000
      pcm_format: s16le
      channels: 1
      frame_ms: 10
    # Additional accepted RX formats for direct ESP-to-ESP calls. These are valid
    # only because speaker: voip_speaker_input points at the resampler; do
    # not advertise additional formats when wiring voip_stack directly to a
    # fixed-rate mixer input.
    rx_formats:
      - sample_rate: 32000
        pcm_format: s16le
        channels: 1
        frame_ms: 16
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 10
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 16
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 32
  microphone: mic_main
  speaker: voip_speaker_input
  ringing_timeout: 30s
  delete_contact_missing_from:
    updates_number: 1

# =============================================================================
# RUNTIME LOGIC AND ENTITIES
# =============================================================================

# Local BOOT button: short press controls VA/call toggle, double press changes
# contact, long press toggles microphone mute.

binary_sensor:
  # BOOT button (GPIO0), multi-click
  - platform: gpio
    name: Boot Button
    id: boot_button
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    on_multi_click:
      # Single click: call toggle if VoIP call active, otherwise VA start/stop
      - timing:
          - ON for at most 500ms
          - OFF for at least 400ms
        then:
          - if:
              condition:
                not:
                  - voip_stack.is_idle:
              then:
                - voip_stack.call_toggle:
              else:
                - runtime_controller.event:
                    id: runtime
                    event: wake_word
      # Double click: next contact
      - timing:
          - ON for 50ms to 500ms
          - OFF for at most 300ms
          - ON for 50ms to 500ms
          - OFF for at least 400ms
        then:
          - voip_stack.next_contact:
      # Long press (1-3s): toggle mute
      - timing:
          - ON for 1s to 3s
          - OFF for at least 300ms
        then:
          - switch.toggle: mute

# LCD backlight, repurposed as the runtime_controller status LED (see
# runtime_controller_led_id above) since Box-3 has no addressable RGB LED.

output:
  - platform: ledc
    pin: GPIO47
    id: backlight_output

light:
  - platform: monochromatic
    id: led
    name: Screen
    icon: "mdi:television"
    entity_category: config
    output: backlight_output
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

switch:
  # Speaker amp enable. Box-3's class-D amp is gated by this GPIO; without it
  # driven high the ES8311 DAC output never reaches the speaker.
  - platform: gpio
    name: Speaker Enable
    id: speaker_enable
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

select:
  - platform: template
    name: AEC Mode
    id: aec_mode_select
    icon: mdi:tune-vertical
    # Start with the lower-cost dual-mic FD profile until hardware qualification.
    options:
      - "fd_low_cost"
      - "fd_high_perf"
    initial_option: "fd_low_cost"
    # Non-optimistic: template_select::control runs the set_action first
    # and only auto-publishes `index` when optimistic=true, overwriting
    # whatever we published. With optimistic=false, the final lambda
    # publish_state drives HA state from the live esp_afe mode.
    optimistic: false
    restore_value: false
    set_action:
      - if:
          condition:
            lambda: |-
              return !id(init_in_progress) && x != id(afe_processor).get_mode_name();
          then:
            - if:
                condition:
                  or:
                    - voice_assistant.is_running:
                    - not:
                        voip_stack.is_idle:
                then:
                  - logger.log:
                      level: WARN
                      format: "Cannot switch AEC mode during active VA/VoIP"
                else:
                  - logger.log:
                      format: "Switching AEC mode to %s"
                      args: ['x.c_str()']
                  - micro_wake_word.stop:
                  - esp_audio_stack.stop:
                  - wait_until:
                      condition:
                        esp_audio_stack.is_idle:
                      timeout: 2s
                  - esp_afe.set_mode:
                      id: afe_processor
                      mode: !lambda 'return x;'
                  - wait_until:
                      condition:
                        lambda: 'return id(afe_processor).is_reconfigure_idle();'
                      timeout: 20s
                  - if:
                      condition:
                        lambda: 'return id(afe_processor).is_reconfigure_idle() && id(afe_processor).get_last_reconfigure_ok();'
                      then:
                        - esp_audio_stack.start:
                        - delay: 300ms
                        - if:
                            condition:
                              switch.is_off: mute
                            then:
                              - script.execute: start_mww_when_ready
                      else:
                        - logger.log:
                            level: ERROR
                            tag: main
                            format: "AFE mode switch did not complete cleanly; audio restart skipped"
      - lambda: |-
          id(aec_mode_select).publish_state(id(afe_processor).get_mode_name());

# Enable these entities in HA if hidden by default. Speak near each microphone
# and compare both readings; this does not require disabling AEC.
sensor:
  - platform: esp_audio_stack
    std_slot_levels:
      - name: Microphone Left Level
        slot: left
      - name: Microphone Right Level
        slot: right
