# ESP32-S3-BOX-3 / FULL / experimental dual-microphone AFE
# Derived from the contributor-tested AEC profile by mwhdc (issue #80).
# Dual-mic request: https://github.com/n-IA-hane/esphome-intercom/issues/116
# Maintainer has no BOX-3: compile validation is not hardware qualification.
# Keep esp32-s3-box-3-full-aec.yaml as the single-mic reference.
#
#  MIC1 + MIC2 -> ES7210 (0x40) -> STD I2S left/right -> dual-mic AFE
#                                                       ^       |
#  Speaker playback -> software AEC reference -----------+       v
#                                                     mono microphone
#                                                     MWW / Assist / VoIP
#  Media / TTS / VoIP -> mixer -> ES8311 (0x18) -> amplifier / speaker
#
# Two physical microphones share the ES7210 data output on GPIO16.
# Select ADC MIC1/MIC2 (0x03), capture both STD slots and feed MMR to AFE.
# There is no hardware playback-reference slot in this configuration.
# Do not copy the Waveshare four-slot TDM mapping onto this board.
#
# Codec I2C GPIO8/18; I2S MCLK2, BCLK17, LRCLK45, DIN16, DOUT15; amp46.
# Existing display, touch, dock, buttons and playback configuration are retained.
# Low-cost FD keeps both microphones, AEC and speech enhancement enabled.
# This first candidate requires measurements of channel levels, echo, available
# internal/DMA memory and concurrent Assist/VoIP/media operation on real hardware.
# Support: https://github.com/sponsors/n-IA-hane

substitutions:
  gmf_ai_audio_source: ""
  firmware_features: [voice, wake_word, voip, music, sendspin, timers, display, status_led, sensor_dock, diagnostics]
  # Hardware-shared identity: dropping firmware-variant suffix keeps build cache
  # and HA device entity stable across rebuilds.
  name: esp32-s3-box-3
  friendly_name: ESP32-S3-Box-3

  # Local sources keep repository builds reproducible. Release examples replace
  # these with the corresponding pinned public component revisions.
  ext_components_source: "github://n-IA-hane/esphome-intercom@dev"
  voip_stack_components_source: "github://n-IA-hane/esphome-voip-stack@dev"
  audio_stack_components_source: "github://n-IA-hane/esphome-audio-stack@dev"
  runtime_controller_components_source: "github://n-IA-hane/esphome-runtime-controller@dev"

  assets_base: "https://github.com/n-IA-hane/esphome-intercom/raw/dev/"

  # Microphone ID for package mute switch
  mic_id: mic_main

  # runtime_controller's full_controller.yaml hard-requires an `outputs: led:`
  # light entity to exist (it is not optional there, even though the
  # runtime_controller component itself treats it as optional). Box-3 has no
  # addressable status LED, so this repoints it at the LCD backlight (`led`,
  # defined further down) instead of the generic profile's WS2812 status_led.
  # To detach the backlight from status and use a no-op entity instead (e.g.
  # to keep the screen on constantly or manage it elsewhere), override this
  # substitution and add the `status_led_null` light - see
  # esp32-s3-box-3-detached-backlight.yaml.
  runtime_controller_led_id: led
  runtime_controller_led_preset: rgb_single

  # ---------------------------------------------------------------------------
  # Pinout: shared codec/control I2C bus
  # ---------------------------------------------------------------------------
  codec_i2c_sda_pin: GPIO8
  codec_i2c_scl_pin: GPIO18

  # ---------------------------------------------------------------------------
  # Pinout: shared ES7210/ES8311 I2S bus
  # ---------------------------------------------------------------------------
  # BCLK/LRCLK/MCLK are shared by mic and speaker on this full-duplex bus.
  i2s_mclk_pin: GPIO2
  i2s_bclk_pin: GPIO17
  i2s_lrclk_pin: GPIO45

  # ---------------------------------------------------------------------------
  # Pinout: microphone
  # ---------------------------------------------------------------------------
  i2s_din_pin: GPIO16

  # ---------------------------------------------------------------------------
  # Pinout: speaker
  # ---------------------------------------------------------------------------
  i2s_dout_pin: GPIO15

packages:
  device: github://n-IA-hane/esphome-intercom/packages/devices/esp32-s3-box-3-afe.yaml@dev
