name: Qualification

on:
  # The definition stays on the trusted base branch. Hosted jobs still test
  # the pull request head with no token permissions.
  pull_request_target:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete qualification plan
        type: boolean
        default: true
  schedule:
    - cron: "17 2 * * *"

permissions: {}

concurrency:
  group: qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      required_jobs: ${{ steps.metadata.outputs.required_jobs }}
      candidate_id: ${{ steps.metadata.outputs.candidate_id }}
      plan_id: ${{ steps.metadata.outputs.plan_id }}
    steps:
      - name: Check out intercom candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: workspace/esphome-intercom
          fetch-depth: 0
          persist-credentials: false
      - name: Check out VoIP stack dependency
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: n-IA-hane/esphome-voip-stack
          ref: dev
          path: workspace/esphome-voip-stack
          persist-credentials: false
      - name: Check out audio stack dependency
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: n-IA-hane/esphome-audio-stack
          ref: dev
          path: workspace/esphome-audio-stack
          persist-credentials: false
      - name: Check out runtime controller dependency
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: n-IA-hane/esphome-runtime-controller
          ref: dev
          path: workspace/esphome-runtime-controller
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.2"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Resolve exact candidate and risk plan
        id: metadata
        working-directory: workspace/esphome-intercom
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MANUAL_FULL: ${{ inputs.full }}
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-test.txt
          .venv/bin/pip install -r requirements-firmware-test.txt
          python -m venv .ha-venv
          .ha-venv/bin/pip install -r requirements-ha-test.txt
          mkdir -p evidence
          .venv/bin/python scripts/candidate_lock.py \
            --ha-python .ha-venv/bin/python \
            --output evidence/candidate-lock.json
          if [ "$EVENT_NAME" = pull_request_target ]; then
            base=$PR_BASE
            event=pull-request
            full=
          elif [ "$EVENT_NAME" = push ]; then
            base=$EVENT_BEFORE
            event=push-dev
            full=
          elif [ "$EVENT_NAME" = schedule ]; then
            base="$(git rev-parse HEAD^)"
            event=schedule
            full=--full
          else
            base="$(git rev-parse HEAD^)"
            event=manual
            full=--full
          fi
          .venv/bin/python scripts/qualification_plan.py \
            --base "$base" --head "${{ github.event.pull_request.head.sha || github.sha }}" --event "$event" $full \
            --output evidence/qualification-plan.json
          .venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          plan = json.loads(Path("evidence/qualification-plan.json").read_text())
          candidate = json.loads(Path("evidence/candidate-lock.json").read_text())
          print("required_jobs=" + json.dumps(plan["required_jobs"], separators=(",", ":")))
          print("plan_id=" + plan["plan_id"])
          print("candidate_id=" + candidate["candidate_id"])
          PY
          ./scripts/yaml_paths.sh check --expect remote
          git diff --exit-code
      - name: Upload immutable qualification inputs
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: qualification-input-${{ github.event.pull_request.head.sha || github.sha }}
          path: workspace/esphome-intercom/evidence/
          if-no-files-found: error

  software:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [static, qualification-selftest, software-full, ha-runtime, cpp-contract, coverage, release-package]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: workspace/esphome-intercom
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        with:
          python-version: "3.14.2"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        with:
          node-version: "24"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        with:
          name: qualification-input-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/input
      - name: Resolve C++ contract source
        if: matrix.job == 'cpp-contract' && contains(needs.plan.outputs.required_jobs, '"cpp-contract"')
        id: cpp_contract_ref
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          repositories = json.loads(Path("evidence/input/candidate-lock.json").read_text())["repositories"]
          print("commit=" + repositories["esphome-voip-stack"]["commit"])
          PY
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: matrix.job == 'cpp-contract' && contains(needs.plan.outputs.required_jobs, '"cpp-contract"')
        with:
          repository: n-IA-hane/esphome-voip-stack
          ref: ${{ steps.cpp_contract_ref.outputs.commit }}
          path: workspace/esphome-voip-stack
          persist-credentials: false
      - name: Install test environments
        if: contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        working-directory: workspace/esphome-intercom
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-test.txt
          if [ "${{ matrix.job }}" = cpp-contract ]; then
            .venv/bin/pip install -r requirements-firmware-test.txt
          fi
          python -m venv .ha-venv
          .ha-venv/bin/pip install -r requirements-ha-test.txt
      - name: Execute ${{ matrix.job }}
        if: contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        working-directory: workspace/esphome-intercom
        env:
          HA_PYTHON: .ha-venv/bin/python
          JOB: ${{ matrix.job }}
        run: |
          case "$JOB" in
            static) command=(./scripts/test_suite.sh fast) ;;
            qualification-selftest) command=(.venv/bin/python -m pytest -q tests/test_qualification_pipeline.py) ;;
            software-full) command=(./scripts/test_suite.sh software-full) ;;
            ha-runtime) command=(./scripts/test_suite.sh ha) ;;
            cpp-contract) command=(.venv/bin/python -m pytest -q ../esphome-voip-stack/tests) ;;
            coverage)
              command=(
                bash -lc
                './scripts/test_suite.sh coverage && cp coverage.xml "$GITHUB_WORKSPACE/evidence/results/coverage.xml"'
              )
              ;;
            release-package)
              command=(
                .venv/bin/python -m scripts.package_release_candidate
                --source custom_components/voip_stack
                --archive "$GITHUB_WORKSPACE/evidence/results/voip_stack.zip"
                --candidate "$GITHUB_WORKSPACE/evidence/input/candidate-lock.json"
                --plan "$GITHUB_WORKSPACE/evidence/input/qualification-plan.json"
                --output "$GITHUB_WORKSPACE/evidence/results/release-package.json"
              )
              ;;
            *) exit 2 ;;
          esac
          artifacts=()
          if [ "$JOB" = release-package ]; then
            artifacts=(
              --artifact "$GITHUB_WORKSPACE/evidence/results/voip_stack.zip"
              --artifact "$GITHUB_WORKSPACE/evidence/results/release-package.json"
            )
          elif [ "$JOB" = coverage ]; then
            artifacts=(
              --artifact "$GITHUB_WORKSPACE/evidence/results/coverage.xml"
            )
          fi
          .venv/bin/python scripts/run_qualification_command.py \
            --job "$JOB" \
            --plan "$GITHUB_WORKSPACE/evidence/input/qualification-plan.json" \
            --candidate "$GITHUB_WORKSPACE/evidence/input/candidate-lock.json" \
            --evidence-root "$GITHUB_WORKSPACE/evidence/results" \
            "${artifacts[@]}" \
            -- "${command[@]}"
      - name: Upload ${{ matrix.job }} evidence
        if: always() && contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: qualification-result-${{ matrix.job }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/results/
          if-no-files-found: error

  firmware:
    needs: plan
    if: contains(needs.plan.outputs.required_jobs, '"firmware"')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: workspace/esphome-intercom
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.2"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: qualification-input-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/input
      - name: Check out exact dependency commits
        id: refs
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          repos = json.loads(Path("evidence/input/candidate-lock.json").read_text())["repositories"]
          print("voip=" + repos["esphome-voip-stack"]["commit"])
          print("audio=" + repos["esphome-audio-stack"]["commit"])
          print("runtime=" + repos["esphome-runtime-controller"]["commit"])
          PY
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: n-IA-hane/esphome-voip-stack
          ref: ${{ steps.refs.outputs.voip }}
          path: workspace/esphome-voip-stack
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: n-IA-hane/esphome-audio-stack
          ref: ${{ steps.refs.outputs.audio }}
          path: workspace/esphome-audio-stack
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: n-IA-hane/esphome-runtime-controller
          ref: ${{ steps.refs.outputs.runtime }}
          path: workspace/esphome-runtime-controller
          persist-credentials: false
      - name: Build locked local firmware sequentially
        run: |
          build_root="$RUNNER_TEMP/candidate"
          mkdir -p "$build_root"
          rsync -a --exclude .venv workspace/esphome-intercom/ "$build_root/esphome-intercom/"
          rsync -a workspace/esphome-voip-stack/ "$build_root/esphome-voip-stack/"
          rsync -a workspace/esphome-audio-stack/ "$build_root/esphome-audio-stack/"
          rsync -a workspace/esphome-runtime-controller/ "$build_root/esphome-runtime-controller/"
          cd "$build_root/esphome-intercom"
          python -m venv .venv
          .venv/bin/pip install -r requirements-test.txt
          .venv/bin/pip install -r requirements-firmware-test.txt
          ./scripts/yaml_paths.sh --local
          .venv/bin/python scripts/run_qualification_command.py \
            --job firmware \
            --plan "$GITHUB_WORKSPACE/evidence/input/qualification-plan.json" \
            --candidate "$GITHUB_WORKSPACE/evidence/input/candidate-lock.json" \
            --evidence-root "$GITHUB_WORKSPACE/evidence/results" \
            -- .venv/bin/python scripts/compile_qualification_profiles.py \
              --plan "$GITHUB_WORKSPACE/evidence/input/qualification-plan.json" \
              --index "$GITHUB_WORKSPACE/evidence/results/firmware-build-index.json"
          .venv/bin/python scripts/firmware_manifest.py \
            --expected "$(python -c 'import json, os; print(len(json.load(open(os.environ["GITHUB_WORKSPACE"] + "/evidence/input/qualification-plan.json"))["firmware_profiles"]))')" \
            --plan "$GITHUB_WORKSPACE/evidence/input/qualification-plan.json" \
            --candidate "$GITHUB_WORKSPACE/evidence/input/candidate-lock.json" \
            --bundle "$GITHUB_WORKSPACE/evidence/results/firmware" \
            --index "$GITHUB_WORKSPACE/evidence/results/firmware-build-index.json" \
            --output "$GITHUB_WORKSPACE/evidence/results/firmware-manifest.json"
          plan_id="$(python -c 'import json, os; print(json.load(open(os.environ["GITHUB_WORKSPACE"] + "/evidence/input/qualification-plan.json"))["plan_id"])')"
          candidate_id="$(python -c 'import json, os; print(json.load(open(os.environ["GITHUB_WORKSPACE"] + "/evidence/input/candidate-lock.json"))["candidate_id"])')"
          .venv/bin/python scripts/record_qualification_result.py \
            --job firmware --status success \
            --artifact "$GITHUB_WORKSPACE/evidence/results/firmware.log" \
            --artifact "$GITHUB_WORKSPACE/evidence/results/firmware-manifest.json" \
            --root "$GITHUB_WORKSPACE/evidence/results" \
            --plan-id "$plan_id" --candidate-id "$candidate_id" --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "$GITHUB_WORKSPACE/evidence/results/result-firmware.json"
      - name: Upload firmware evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: qualification-result-firmware-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/results/
          if-no-files-found: error

  mutation:
    needs: plan
    if: contains(needs.plan.outputs.required_jobs, '"mutation"')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.2"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: qualification-input-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/input
      - name: Create disposable mutation checkout
        run: |
          python -m venv .mutation-venv
          .mutation-venv/bin/pip install -r requirements-mutation-test.txt
          git worktree add --detach "$RUNNER_TEMP/mutation-worktree" HEAD
          ln -s "$GITHUB_WORKSPACE/.mutation-venv" "$RUNNER_TEMP/mutation-worktree/.venv"
      - name: Execute mutation gate
        run: |
          .mutation-venv/bin/python scripts/run_qualification_command.py \
            --job mutation \
            --plan evidence/input/qualification-plan.json \
            --candidate evidence/input/candidate-lock.json \
            --evidence-root evidence/results \
            -- bash -lc \
              "cd '$RUNNER_TEMP/mutation-worktree' && HA_PYTHON=.venv/bin/python ./scripts/test_suite.sh mutation"
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: qualification-result-mutation-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/results/
          if-no-files-found: error

  live:
    needs: plan
    if: github.event_name != 'pull_request_target' && (contains(needs.plan.outputs.required_jobs, '"peer-live"') || contains(needs.plan.outputs.required_jobs, '"browser-real"'))
    runs-on: [self-hosted, voip-lab]
    strategy:
      fail-fast: false
      matrix:
        job: [peer-live, browser-real]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        with:
          name: qualification-input-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/input
      - name: Prepare qualification environment
        if: contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-test.txt
      - name: Execute ${{ matrix.job }}
        if: contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        env:
          JOB: ${{ matrix.job }}
          HA_PYTHON: /home/codex/ha-voip-lab/.venv/bin/python
          HA_LAB_SIP_HOST: 192.168.1.48
          HA_LAB_SIP_PORT: 15060
          VOIP_QUALIFICATION_POLICY_ENDPOINT_ID: ${{ vars.VOIP_QUALIFICATION_POLICY_ENDPOINT_ID }}
          SIP_REGRESSION_CAPTURE_DIR: evidence/results/browser-real
        run: |
          case "$JOB" in
            peer-live) command=(./scripts/run_peer_live_qualification.sh evidence/results) ;;
            browser-real) command=(./scripts/run_lab_regression_gate.sh) ;;
            *) exit 2 ;;
          esac
          artifacts=()
          if [ "$JOB" = peer-live ]; then
            artifacts=(
              --artifact evidence/results/peer-live.json
              --artifact evidence/results/dtmf-extension-precedence.json
              --artifact evidence/results/wildix-trunk-dtmf.json
            )
          elif [ "$JOB" = browser-real ]; then
            artifacts=(
              --artifact evidence/results/browser-real/browser-matrix.json
              --artifact evidence/results/browser-real/video-reinvite.json
            )
          fi
          .venv/bin/python scripts/run_qualification_command.py \
            --job "$JOB" \
            --plan evidence/input/qualification-plan.json \
            --candidate evidence/input/candidate-lock.json \
            --evidence-root evidence/results \
            "${artifacts[@]}" \
            -- ./scripts/with_ha_lab_candidate.sh -- "${command[@]}"
      - name: Upload ${{ matrix.job }} evidence
        if: always() && contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: qualification-result-${{ matrix.job }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/results/
          if-no-files-found: error

  hil:
    needs: [plan, firmware]
    if: github.event_name != 'pull_request_target' && (contains(needs.plan.outputs.required_jobs, '"hil-s3"') || contains(needs.plan.outputs.required_jobs, '"hil-p4"'))
    runs-on: [self-hosted, voip-lab]
    strategy:
      fail-fast: false
      matrix:
        job: [hil-s3, hil-p4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        with:
          name: qualification-input-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/input
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        if: contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        with:
          name: qualification-result-firmware-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/firmware-input
      - name: Prepare qualification environment
        if: contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-test.txt
          .venv/bin/pip install -r requirements-firmware-test.txt
      - name: Execute ${{ matrix.job }}
        if: contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        env:
          JOB: ${{ matrix.job }}
          HA_PYTHON: /home/codex/ha-voip-lab/.venv/bin/python
        run: |
          hardware_map=${VOIP_HARDWARE_MAP:-/home/codex/.config/voip-qualification/hardware-map.yaml}
          test -f "$hardware_map"
          mkdir -p evidence/results
          .venv/bin/python scripts/run_qualification_command.py \
            --job "$JOB" \
            --plan evidence/input/qualification-plan.json \
            --candidate evidence/input/candidate-lock.json \
            --evidence-root evidence/results \
            --artifact "evidence/results/$JOB.json" \
            -- ./scripts/with_ha_lab_candidate.sh -- \
              .venv/bin/python scripts/run_hil_qualification.py \
                --job "$JOB" \
                --plan evidence/input/qualification-plan.json \
                --candidate evidence/input/candidate-lock.json \
                --firmware-manifest evidence/firmware-input/firmware-manifest.json \
                --firmware-root evidence/firmware-input \
                --hardware-map "$hardware_map" \
                --output "evidence/results/$JOB.json"
      - name: Upload ${{ matrix.job }} evidence
        if: always() && contains(needs.plan.outputs.required_jobs, format('"{0}"', matrix.job))
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: qualification-result-${{ matrix.job }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/results/
          if-no-files-found: error

  qualification-summary:
    if: always()
    needs: [plan, software, firmware, mutation, live, hil]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: qualification-input-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/input
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: qualification-result-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/results
          merge-multiple: true
      - name: Verify complete candidate evidence
        id: verify
        continue-on-error: true
        run: |
          python scripts/merge_qualification_results.py \
            evidence/results/result-*.json \
            --output evidence/qualification-results.json
          python scripts/verify_qualification.py \
            --plan evidence/input/qualification-plan.json \
            --candidate evidence/input/candidate-lock.json \
            --results evidence/qualification-results.json \
            --artifact-root evidence/results \
            --output evidence/qualification-manifest.json
      - name: Upload final qualification manifest
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: qualification-summary-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
      - name: Enforce qualification result
        if: steps.verify.outcome != 'success'
        run: exit 1
