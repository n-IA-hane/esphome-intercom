name: Build HACS release asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to update
        required: true
        type: string
      replace_existing:
        description: Replace an existing voip_stack.zip asset
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: hacs-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.2"
      - name: Resolve successful qualification for tag commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_sha=$(git rev-parse HEAD)
          run_id=$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/qualification.yml/runs?head_sha=$tag_sha&status=success&per_page=20" \
              --jq '.workflow_runs | map(select(.event == "push" or .event == "workflow_dispatch")) | first | .id // empty'
          )
          test -n "$run_id"
          printf 'TAG_SHA=%s\nQUALIFICATION_RUN_ID=%s\n' "$tag_sha" "$run_id" >> "$GITHUB_ENV"
      - name: Download qualified archive and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$QUALIFICATION_RUN_ID" \
            --name "qualification-result-release-package-$TAG_SHA" \
            --dir release-evidence
          gh run download "$QUALIFICATION_RUN_ID" \
            --name "qualification-summary-$TAG_SHA" \
            --dir qualification-evidence
          cp release-evidence/voip_stack.zip voip_stack.zip
      - name: Verify exact qualified artifact
        run: |
          python scripts/verify_release_candidate.py \
            --tag-sha "$TAG_SHA" \
            --package release-evidence/release-package.json \
            --qualification qualification-evidence/qualification-manifest.json \
            --archive voip_stack.zip
          python -m zipfile -t voip_stack.zip
          sha256sum voip_stack.zip
      - name: Upload new release asset
        if: ${{ github.event_name == 'release' || !inputs.replace_existing }}
        run: gh release upload "$RELEASE_TAG" voip_stack.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace existing release asset
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_existing }}
        run: gh release upload "$RELEASE_TAG" voip_stack.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
