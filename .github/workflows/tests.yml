name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  quality-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.2"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install test deps
        run: python -m pip install -r requirements-test.txt
      - name: Lint Python
        run: python -m ruff check custom_components esphome scripts tests tools
      - name: Parse browser modules
        run: >-
          find custom_components/voip_stack/frontend -name '*.js' -print0
          | xargs -0 -n1 node --check
      - name: Check YAML source paths
        run: ./scripts/yaml_paths.sh check --expect remote
      - name: Run test suite
        run: ./scripts/test_suite.sh full
      - name: Measure runtime coverage
        run: ./scripts/test_suite.sh coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  home-assistant-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.2"
      - name: Install Home Assistant test deps
        run: python -m pip install -r requirements-ha-test.txt
      - name: Check YAML source paths
        run: ./scripts/yaml_paths.sh check --expect remote
      - name: Run Home Assistant API tests
        env:
          HA_PYTHON: python
        run: ./scripts/test_suite.sh ha
