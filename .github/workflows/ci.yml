name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      component_manifest:
        description: Exact coordinated-sources.json from a previous run (blank follows dev/main)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify committed YAML and package source channel
        env:
          COMPONENT_REF: ${{ (github.base_ref == 'main' || github.ref_name == 'main' || (github.ref_type == 'tag' && !(endsWith(github.ref_name, '-dev') || contains(github.ref_name, '-dev.')))) && 'main' || 'dev' }}
        run: python3 scripts/yaml_paths.sh check --expect remote --ref "$COMPONENT_REF"

  software:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check out coordinated ESP component sources
        env:
          COMPONENT_REF: ${{ (github.base_ref == 'main' || github.ref_name == 'main' || (github.ref_type == 'tag' && !(endsWith(github.ref_name, '-dev') || contains(github.ref_name, '-dev.')))) && 'main' || 'dev' }}
          COMPONENT_MANIFEST: ${{ inputs.component_manifest }}
        run: >-
          python3 scripts/coordinated_sources.py --root .. --ref "$COMPONENT_REF"
          --output test-results/coordinated-sources.json
      - name: Preserve coordinated source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coordinated-sources
          path: test-results/coordinated-sources.json
          if-no-files-found: error
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt -r requirements-firmware-test.txt
      - name: Verify Node frontend test dependency
        run: node --version
      - name: Install independent capture-file tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wireshark-common tshark
      - name: Check Python code and test fixtures
        run: python -m ruff check custom_components/voip_stack scripts tests tools/esp_profile.py
      - name: Run software suite
        env:
          PYTEST_ADDOPTS: --junitxml=test-results/software.xml -ra -vv
          AUDIO_STACK_REPO: ${{ github.workspace }}/../esphome-audio-stack
          AUDIO_LIBS_REPO: ${{ github.workspace }}/.test-deps/esp-audio-libs
        run: PYTHON=python scripts/test_suite.sh software-full --keep-going
      - name: Require executed software tests
        run: python scripts/check_test_results.py test-results/software.xml
      - name: Preserve software test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-results
          path: test-results/software.xml
          if-no-files-found: error

  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check out coordinated ESP component sources
        env:
          COMPONENT_REF: ${{ (github.base_ref == 'main' || github.ref_name == 'main' || (github.ref_type == 'tag' && !(endsWith(github.ref_name, '-dev') || contains(github.ref_name, '-dev.')))) && 'main' || 'dev' }}
          COMPONENT_MANIFEST: ${{ inputs.component_manifest }}
        run: >-
          python3 scripts/coordinated_sources.py --root .. --ref "$COMPONENT_REF"
          --output test-results/ha-coordinated-sources.json
      - name: Preserve coordinated source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ha-coordinated-sources
          path: test-results/ha-coordinated-sources.json
          if-no-files-found: error
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies for independent SIP and video peers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake libssl-dev libsndfile1-dev zlib1g-dev ldap-utils \
            sip-tester libavcodec-dev libavfilter-dev libavformat-dev \
            libswscale-dev libavdevice-dev libavutil-dev
          command -v ldapsearch
      - name: Build pinned independent SIP test peer
        run: |
          scripts/build_sip_test_peer.sh "$RUNNER_TEMP/sip-peer"
          echo "$RUNNER_TEMP/sip-peer/bin" >> "$GITHUB_PATH"
          echo "VOIP_TEST_BARESIP_MODULE_PATH=$RUNNER_TEMP/sip-peer/lib/baresip/modules" >> "$GITHUB_ENV"
      - name: Install Home Assistant test dependencies
        run: python -m pip install -r requirements-test.txt -r requirements-ha-test.txt
      - name: Run Home Assistant suite
        env:
          PYTEST_ADDOPTS: --junitxml=test-results/home-assistant.xml -ra
        run: PYTHON=python HA_PYTHON=python scripts/test_suite.sh ha --keep-going
      - name: Require executed Home Assistant tests
        run: python scripts/check_test_results.py test-results/home-assistant.xml
      - name: Preserve Home Assistant test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: home-assistant-results
          path: test-results/home-assistant.xml
          if-no-files-found: error

  browser-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-browser-test.txt
      - name: Install browser and media fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/browser-bin"
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as runner:
              Path(os.environ["RUNNER_TEMP"], "browser-bin", "chromium").symlink_to(
                  runner.chromium.executable_path
              )
          PY
          echo "$RUNNER_TEMP/browser-bin" >> "$GITHUB_PATH"
      - name: Check call controls and decoded video in Chromium
        env:
          PYTEST_ADDOPTS: --junitxml=test-results/browser.xml -ra
        run: PYTHON=python scripts/test_suite.sh browser --keep-going
      - name: Require executed browser tests
        run: python scripts/check_test_results.py test-results/browser.xml
      - name: Preserve browser test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results
          path: test-results/browser.xml
          if-no-files-found: error

  assist-media-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install host compiler and the official ESPHome Python dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build
          python -m pip install -r requirements-firmware-test.txt pytest==9.0.3 pytest-asyncio==1.4.0 pytest-timeout==2.4.0
      - name: Read the pinned official host runner
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: esphome/esphome
          ref: 704551a6c93c29a311802f7ee97d67a9e9bce718
          path: .test-deps/esphome
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /esphome/
            /script/
            /tests/testing_helpers.py
            /tests/__init__.py
            /pyproject.toml
            /platformio.ini
      - name: Read pinned micro-decoder0.4.0 host sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: esphome-libs/micro-decoder
          ref: 4d06df93a1ee69788dfc7d8676cbd66371b3eae9
          path: .test-deps/micro-decoder
          persist-credentials: false
      - name: Read pinned micro-flac0.3.0 host sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: esphome-libs/micro-flac
          ref: f9c27d4d0166021db977d7fc37d205b21d81e9f2
          path: .test-deps/micro-flac
          persist-credentials: false
      - name: Run six actual VA transition-method cases
        run: >-
          python -m pytest -q tests/test_voice_assistant_idle_runtime.py
          --junitxml=test-results/voice-assistant-idle.xml
      - name: Run twelve real HTTP/player/FLAC lifecycle cases with sanitizers
        run: |
          python scripts/test_assist_media_host.py --esphome-source .test-deps/esphome \
            --micro-decoder .test-deps/micro-decoder --micro-flac .test-deps/micro-flac \
            --build-parent "$RUNNER_TEMP/assist-media-host" --junit test-results/assist-media.xml
          python scripts/check_test_results.py test-results/voice-assistant-idle.xml
          python scripts/check_test_results.py test-results/assist-media.xml
      - name: Preserve media lifecycle results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assist-media-host-results
          path: |
            test-results/voice-assistant-idle.xml
            test-results/assist-media.xml
          if-no-files-found: error

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - run: python -m pip install mkdocs==1.6.1
      - run: mkdocs build --strict

  box-v2-firmware:
    name: ${{ matrix.job_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            job_name: box-v2-firmware
            label: FULL dual-microphone AFE with the native UI
            profile: yamls/full-experience/single-bus/waveshare-s3-touch-lcd-1.85c-box-v2-full.yaml
            build_dir: box-v2
          - variant: voip-only
            job_name: box-v2-voip-only-firmware
            label: VoIP-only dual-microphone AEC and Opus with the native UI
            profile: yamls/voip-only/single-bus/waveshare-s3-touch-lcd-1.85c-box-v2-voip.yaml
            build_dir: box-v2-voip-only
    env:
      FIRMWARE_VARIANT: ${{ matrix.variant }}
      FIRMWARE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check out coordinated ESP component sources
        env:
          COMPONENT_REF: ${{ (github.base_ref == 'main' || github.ref_name == 'main' || (github.ref_type == 'tag' && !(endsWith(github.ref_name, '-dev') || contains(github.ref_name, '-dev.')))) && 'main' || 'dev' }}
          COMPONENT_MANIFEST: ${{ inputs.component_manifest }}
        run: >-
          python3 scripts/coordinated_sources.py --root .. --ref "$COMPONENT_REF"
          --output "test-results/${{ matrix.build_dir }}-coordinated-sources.json"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.2"
      - name: Install official ESPHome and composition helper dependency
        run: python -m pip install esphome==2026.10.0 pytest==9.0.3 pytest-asyncio==1.4.0 pytest-timeout==2.4.0
      - name: Compile and link ${{ matrix.label }}
        env:
          FIRMWARE_BUILD_DIR: ${{ runner.temp }}/${{ matrix.build_dir }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from esphome import yaml_util
          from tests.test_package_composition import device_config
          profile = os.environ['FIRMWARE_PROFILE']
          original = yaml_util.load_yaml(Path(profile))
          config = device_config(Path(os.environ['FIRMWARE_BUILD_DIR']),
                                 original['substitutions']['firmware_features'], profile)
          if os.environ['FIRMWARE_VARIANT'] == 'full':
              data = yaml_util.load_yaml(config)
              data['substitutions'].update(audio_processor='afe', mic_mix='passthrough')
              config.write_text(yaml_util.dump(data))
          PY
          set -o pipefail
          python -m esphome compile "$FIRMWARE_BUILD_DIR/device.yaml" 2>&1 | tee "test-results/${{ matrix.build_dir }}-firmware.log"
      - name: Verify native round text and visibility with the compiled LVGL source
        if: matrix.variant == 'full'
        env:
          FIRMWARE_BUILD_DIR: ${{ runner.temp }}/${{ matrix.build_dir }}
          RESULT_PREFIX: ${{ matrix.build_dir }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          project = Path(os.environ['FIRMWARE_BUILD_DIR'])
          sources = list(project.rglob('managed_components/lvgl__lvgl/.component_hash'))
          assert len(sources) == 1, sources
          host = Path(os.environ['RUNNER_TEMP']) / 'lvgl-round-text'
          host.mkdir(parents=True, exist_ok=True)
          env = dict(os.environ, LVGL_HOST_SOURCE=str(sources[0].parent),
                     LVGL_HOST_BUILD_ROOT=str(host))
          prefix = os.environ['RESULT_PREFIX']
          subprocess.run([sys.executable, '-m', 'pytest', '-q',
              'tests/test_lvgl_round_text_runtime.py',
              'tests/test_lvgl_round_text_caller_runtime.py',
              'tests/test_p4_ui_updates_runtime.py',
              '--basetemp=' + str(host / 'text-pytest'),
              '--junitxml=test-results/' + prefix + '-round-text.xml'], env=env, check=True)
          # Reuse the same plain library and configuration rather than building
          # LVGL again for the existing visibility contracts.
          library = host / 'round-text/lvgl/lib/liblvgl.a'
          assert library.is_file(), library
          env.update(LVGL_HOST_LIBRARY=str(library),
                     LVGL_HOST_CONFIG=str(Path('tests/fixtures/lvgl_round_text/lv_conf.h').resolve()))
          subprocess.run([sys.executable, '-m', 'pytest', '-q',
              'tests/test_lvgl_visibility_runtime.py',
              '--basetemp=' + str(host / 'visibility-pytest'),
              '--junitxml=test-results/' + prefix + '-visibility.xml'], env=env, check=True)
          PY
      - name: Preserve full firmware build and source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.job_name }}
          path: test-results/${{ matrix.build_dir }}-*
          if-no-files-found: error

  ws3-public-firmware:
    needs: source-channel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.2"
      - name: Install the reported official ESPHome version
        run: python -m pip install esphome==2026.10.2
      - name: Copy the public WS3 Audio profile without source overrides
        run: |
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          profile = Path('yamls/full-experience/single-bus/waveshare-s3-full-afe.yaml')
          project = Path(os.environ['RUNNER_TEMP']) / 'ws3-public-project'
          project.mkdir(parents=True)
          device = project / 'device.yaml'
          shutil.copyfile(profile, device)
          assert device.read_bytes() == profile.read_bytes()
          (project / 'secrets.yaml').write_text(
              'wifi_ssid: ci-fixture-network\nwifi_password: ci-fixture-password\n')
          output = Path('test-results/ws3-public')
          output.mkdir(parents=True)
          shutil.copyfile(device, output / 'input.yaml')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == os.environ['GITHUB_SHA']
          version = importlib.metadata.version('esphome')
          assert version == '2026.10.2'
          (output / 'input.json').write_text(json.dumps({
              'checkout_commit': commit,
              'profile': profile.as_posix(),
              'profile_sha256': hashlib.sha256(profile.read_bytes()).hexdigest(),
              'copied_input_sha256': hashlib.sha256(device.read_bytes()).hexdigest(),
              'esphome_version': version,
              'source_overrides': False,
              'secrets': ['wifi_ssid', 'wifi_password'],
          }, indent=2) + '\n')
          PY
      - name: Compile the literal public WS3 Audio configuration
        id: ws3_compile
        run: |
          set -o pipefail
          python -m esphome compile "$RUNNER_TEMP/ws3-public-project/device.yaml" 2>&1 | tee test-results/ws3-public/compile.log
      - name: Record actual fetched source commits and firmware artifacts
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.ws3_compile.outcome }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          from scripts.firmware_manifest import stage_distribution_notices
          project = Path(os.environ['RUNNER_TEMP']) / 'ws3-public-project'
          output = Path('test-results/ws3-public')
          output.mkdir(parents=True, exist_ok=True)
          stage_distribution_notices(output / 'firmware')
          clones = []
          for domain in ('packages', 'external_components'):
              cache = project / '.esphome' / domain
              for checkout in sorted(cache.iterdir()) if cache.is_dir() else []:
                  if not (checkout / '.git').exists():
                      continue
                  def git(*args):
                      return subprocess.check_output(['git', '-C', str(checkout), *args], text=True).strip()
                  clones.append({
                      'cache': checkout.relative_to(project).as_posix(),
                      'url': git('remote', 'get-url', 'origin'),
                      'commit': git('rev-parse', 'HEAD'),
                      'tree': git('rev-parse', 'HEAD^{tree}'),
                      'tracked_changes': git('status', '--porcelain', '--untracked-files=no'),
                  })
          (output / 'fetched-sources.json').write_text(json.dumps(clones, indent=2) + '\n')
          artifacts = []
          for build in sorted((project / '.esphome/build').glob('*')):
              for name in ('firmware.elf', 'firmware.ota.bin', 'firmware.factory.bin'):
                  source = build / 'build' / name
                  if source.is_file():
                      target = output / 'firmware' / build.name / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source, target)
                      artifacts.append({
                          'path': target.relative_to(output).as_posix(),
                          'bytes': target.stat().st_size,
                          'sha256': hashlib.sha256(target.read_bytes()).hexdigest(),
                      })
              lock = build / 'dependencies.lock'
              if lock.is_file():
                  shutil.copyfile(lock, output / (build.name + '-dependencies.lock'))
          (output / 'firmware.json').write_text(json.dumps(artifacts, indent=2) + '\n')
          if os.environ['BUILD_OUTCOME'] == 'success':
              assert clones, 'Successful public build must record fetched Git sources'
              assert any(item['path'].endswith('firmware.ota.bin') for item in artifacts)
              assert any(item['path'].endswith('firmware.elf') for item in artifacts)
          PY
      - name: Preserve public WS3 firmware, inputs and actual source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ws3-public-firmware
          path: test-results/ws3-public
          if-no-files-found: error
