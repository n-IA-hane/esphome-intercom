# Optional board extensions for voice content. No display dependency.
script:
  - id: ui_tts_started
    parameters:
      text: string
    then: []
  - id: ui_stt_ended
    parameters:
      text: string
    then: []
  - id: ui_va_end
    then:
      - globals.set:
          id: runtime_response_text_ready
          value: "false"
  - id: ui_va_barge_start
    then: []
