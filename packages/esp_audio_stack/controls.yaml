# =============================================================================
# User controls for audio-stack devices
# =============================================================================
# Drop-in for devices using:
#   one esp_audio_stack component
#   speaker id: hw_speaker
#
# Exposes the stable user-facing controls:
#   - Master Volume: speaker-backed software volume for non-codec boards
#   - Mic Gain: retained only for standalone phones without Assist
# =============================================================================

substitutions:
  mic_gain_min: "-20"
  mic_gain_max: "30"

number:
  - platform: esp_audio_stack
    master_volume:
      id: master_volume
      name: Master Volume
      speaker_id: hw_speaker

button:
  - platform: template
    name: Audio Diagnostics
    entity_category: diagnostic
    icon: mdi:clipboard-text-search
    on_press:
      - esp_audio_stack.dump_diagnostics:

# FULL microphone consumers use unity gain after their processor.
defaults:
  _stack_phone_mic_control:
    number:
      - platform: esp_audio_stack
        mic_gain:
          id: mic_gain
          name: Mic Gain
          min_value: ${mic_gain_min}
          max_value: ${mic_gain_max}
          initial_value: ${ mic_gain_initial | default(0) }
packages:
  phone_mic_gain: ${ _stack_phone_mic_control if "voice" not in firmware_features else {} }
