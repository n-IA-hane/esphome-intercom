# Add esp_screenshot from n-IA-hane/esphome-screenshot and choose its display backend in the main YAML.
# This package exposes a native button and the existing native API action.
# The screenshot component ID defaults to screen_capture.
defaults:
  screenshot_id: screen_capture
button:
  - platform: template
    name: Take screenshot
    icon: mdi:monitor-screenshot
    entity_category: diagnostic
    on_press:
      - esp_screenshot.capture:
          id: ${screenshot_id}
api:
  actions:
    - action: take_screenshot
      then:
        - esp_screenshot.capture:
            id: ${screenshot_id}
