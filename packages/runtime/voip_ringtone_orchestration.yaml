# Optional local incoming-call sound. The player owns its source and playlist.
runtime_controller:
  activities:
    ringtone_draining:
      priority: 0

script:
  - id: voip_start_ringtone
    mode: restart
    then:
      - wait_until:
          not:
            script.is_running: voip_ringing_loop
      - if:
          condition:
            and:
              - voip_stack.is_ringing:
              - lambda: 'return !id(g_ota_in_progress);'
          then:
            - script.execute: voip_ringing_loop

  - id: voip_ringing_loop
    mode: single
    then:
      - runtime_controller.set_activity:
          id: runtime
          activity: ringtone_draining
          active: true
      - mixer_speaker.apply_ducking:
          id: tts_mixer_input
          decibel_reduction: 0
          duration: 0ms
      - while:
          condition:
            and:
              - voip_stack.is_ringing:
              - lambda: 'return !id(g_ota_in_progress);'
          then:
            - media_player.play_media:
                id: speaker_media_player
                media_url: "audio-file://voip_ringing_sound"
                announcement: true
            - wait_until:
                condition:
                  lambda: |-
                    return id(announcement_file_source).get_state() !=
                           media_source::MediaSourceState::IDLE;
                timeout: 2s
            - wait_until:
                condition:
                  or:
                    - not:
                        voip_stack.is_ringing:
                    - lambda: |-
                        return id(announcement_file_source).get_state() ==
                               media_source::MediaSourceState::IDLE;
                timeout: 5s
      - script.execute: voip_stop_ringtone

  - id: voip_stop_ringtone
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(runtime).is_activity_active("ringtone_draining");'
          then:
            # Cancel future ring requests before submitting STOP to the owner.
            # Direct source commands leave the player's playlist active.
            - script.stop: voip_ringing_loop
            - media_player.stop:
                id: speaker_media_player
                announcement: true
            - mixer_speaker.apply_ducking:
                id: tts_mixer_input
                decibel_reduction: 0
                duration: 0ms
            - runtime_controller.set_activity:
                id: runtime
                activity: ringtone_draining
                active: false
