# Official MWW trigger; user automations coexist through normal package merging.
external_components:
- source: ${ext_components_source}
  components: [micro_wake_word]

packages:
  mww_start: !include mww_safe_start.yaml

runtime_controller:
  observe:
    micro_wake_word: mww

micro_wake_word:
  id: mww
  stop_after_detection: false
  on_wake_word_detected:
    - globals.set:
        id: g_last_wake_word
        value: !lambda 'return wake_word;'

voice_assistant:
  id: va
  on_client_connected:
    - script.execute: start_mww_when_ready
  on_end:
    - script.execute: start_mww_when_ready
  on_error:
    - script.execute: start_mww_when_ready
