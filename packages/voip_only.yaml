# =============================================================================
# VoIP-only preset.
# Simple phones use voip_stack callbacks directly, without runtime_controller.
# Full profiles use runtime_controller because VA/media/LVGL need arbitration.
#
# This preset includes the complete HA phone surface through ha_phone.yaml.
# Maintained profiles keep optional local controls next to this preset:
#   - voip/entities_full_duplex.yaml   call/next/prev/decline buttons + mic mute
#   - voip/call_settings.yaml          auto-answer + DND switches
#
# Required IDs (defined by device):
#   mic_main                - Microphone
#   hw_speaker              - Hardware speaker
#   speaker_mute            - Speaker mute switch supplied by the device YAML
#                             or packages/voip/speaker_mute.yaml
#   status_led              - LED/light entity
#   voip_ringing_sound  - Media file for ringtone (if device runs one)
#
# Required substitutions:
#   ${friendly_name}        - used in homeassistant.event payload
# =============================================================================

packages:
  ha_phone: !include voip/ha_phone.yaml
  simple_led_status_full_duplex: !include voip/simple_led_status_full_duplex.yaml
  callbacks: !include voip/callbacks.yaml

# voip_stack reserves socket headroom in validation; no lwIP override here.
