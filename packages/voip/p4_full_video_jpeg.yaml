# P4 JPEG video. Camera/rendering retain their original owners and frame gates.
packages:
  csi_contract: !include 'p4_video_csi.yaml'
  call_media_route: !include '../lvgl/p4_call_media_route.yaml'
  video_entities: !include 'video_entities.yaml'
  wake_word: ${ _p4_video_wake_word_hooks if _p4_video_has_wake_word else {} }
substitutions:
  p4_sip_jpeg_width: '800'
  p4_sip_jpeg_height: '800'
  p4_sip_jpeg_fps: '10'
external_components:
- source: ${voip_stack_components_source}
  components:
  - esp_jpeg_video_source
  - p4_video_renderer
esp_jpeg_video_source:
  id: p4_jpeg_video
  camera_id: p4_camera
  width: ${p4_sip_jpeg_width}
  height: ${p4_sip_jpeg_height}
  framerate: ${p4_sip_jpeg_fps}
p4_video_renderer:
  id: p4_video
  codec: jpeg
  width: ${p4_sip_jpeg_width}
  height: ${p4_sip_jpeg_height}
  framerate: ${p4_sip_jpeg_fps}
  max_decode_width: 800
  max_decode_height: 800
  display_id: main_display
  display_rotation: 270
  on_first_frame:
  - script.execute: show_call_video_page
  on_video_ended:
  - script.execute: hide_call_video_page
voip_stack:
  id: phone
  video:
    codec: jpeg
    source: p4_jpeg_video
    sink: p4_video
    width: ${p4_sip_jpeg_width}
    height: ${p4_sip_jpeg_height}
    framerate: ${p4_sip_jpeg_fps}
    rtp_port: 40002
    offer_payload_type: 26
    max_rtp_payload: 1400
lvgl:
  on_boot:
  - lambda: id(p4_video).attach_video_container(id(call_video_surface));
  pages:
  - id: call_video_page
    bg_color: 0
    widgets:
    - obj:
        id: call_video_surface
        align: TOP_MID
        width: 1280
        height: 720
        bg_color: 0
        border_width: 0
        pad_all: 0
        scrollable: false
    - obj:
        align: BOTTOM_MID
        width: 1280
        height: 80
        bg_color: 1053468
        border_width: 0
        pad_all: 8
        scrollable: false
        widgets:
        - label:
            id: call_video_peer_label
            align: LEFT_MID
            x: 24
            y: -15
            width: 900
            text: Video call
            text_color: 16777215
            text_font: font_ui_medium
            long_mode: DOT
        - label:
            id: p4_video_media_route_label
            align: LEFT_MID
            x: 24
            y: 15
            width: 900
            text: ''
            text_color: 9741240
            text_font: font_body
            long_mode: DOT
        - button:
            align: RIGHT_MID
            x: -24
            width: 220
            height: 60
            bg_color: 15680580
            border_width: 0
            radius: 10
            on_click:
            - voip_stack.call_toggle: null
            widgets:
            - label:
                align: CENTER
                text: HANG UP
                text_color: 16777215
                text_font: font_ui_medium
script:
- id: show_call_video_page
  mode: restart
  then:
  - script.stop: draw_display
  - script.stop: ai_animation_loop
  - lambda: "const char *peer = id(peer_name).empty()\n                       ? \"Video call\"\n               \
      \        : id(peer_name).c_str();\nlv_label_set_text(id(call_video_peer_label), peer);\nid(runtime_rendered_page)\
      \ = \"call_video\";\nif (lv_disp_get_scr_act(nullptr) != id(call_video_page)->obj)\n  lv_disp_load_scr(id(call_video_page)->obj);"
- id: hide_call_video_page
  mode: restart
  then:
  - script.stop: show_call_video_page
  - lambda: "if (id(runtime_rendered_page) == \"call_video\")\n  id(runtime_rendered_page).clear();"
  - script.execute: draw_display
- id: !extend 'draw_display'
  then:
  - if:
      condition:
        lambda: "return id(phone).is_in_call() &&\n       id(p4_video).has_remote_frame();"
      then:
      - lambda: "const char *peer = id(peer_name).empty()\n                       ? \"Video call\"\n           \
          \            : id(peer_name).c_str();\nlv_label_set_text(id(call_video_peer_label), peer);\nif (lv_disp_get_scr_act(nullptr)\
          \ != id(call_video_page)->obj)\n  lv_disp_load_scr(id(call_video_page)->obj);\nid(runtime_rendered_page)\
          \ = \"call_video\";"
defaults:
  _p4_video_has_wake_word: ${ ('voice' in firmware_features and 'wake_word' in firmware_features) if firmware_features is defined else true }
  _p4_video_wake_word_hooks: !include video_mww_policy.yaml
