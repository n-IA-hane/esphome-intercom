# Controls compiled only for endpoints that include a native video pipeline.

switch:
  - platform: voip_stack
    voip_stack_id: phone
    video_send:
      name: Send Video
      # Idle: preference for the next call. In call: SIP direction update.
      # Disabling camera transmission preserves negotiated incoming video.
      # The transport confirms changes; a rejected update restores its state.
      restore_mode: RESTORE_DEFAULT_ON
