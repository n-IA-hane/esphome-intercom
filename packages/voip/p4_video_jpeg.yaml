# Compile-time JPEG video path for ESP32-P4 videophone profiles.
#
# Do not include this together with the H.264 package. Only the selected
# source, decoder and voip_stack codec are emitted into the firmware.

packages:
  video_entities: !include video_entities.yaml

substitutions:
  p4_video_width: "800"
  p4_video_height: "800"
  p4_video_fps: "15"
  p4_camera_rotation: "270"
  p4_jpeg_quality: "10"
  p4_video_max_decode_width: "800"
  p4_video_max_decode_height: "800"

external_components:
  - source: ../../../../esphome-esp-video-camera/components
    components: [esp_video_camera]
  - source: ${ext_components_source}
    components: [esp_jpeg_video_source, p4_video_renderer]

esp_video_camera:
  id: p4_camera
  name: P4 Camera
  i2c_id: internal_i2c
  device: jpeg
  resolution: ${p4_video_width}x${p4_video_height}
  jpeg_quality: ${p4_jpeg_quality}
  max_framerate: ${p4_video_fps}
  rotation: ${p4_camera_rotation}

esp_jpeg_video_source:
  id: p4_jpeg_video
  camera_id: p4_camera
  width: ${p4_video_width}
  height: ${p4_video_height}
  framerate: ${p4_video_fps}

p4_video_renderer:
  id: p4_video
  codec: jpeg
  task_stacks_in_psram: false
  width: ${p4_video_width}
  height: ${p4_video_height}
  framerate: ${p4_video_fps}
  max_decode_width: ${p4_video_max_decode_width}
  max_decode_height: ${p4_video_max_decode_height}
  display_id: main_display
  display_rotation: 270
  on_first_frame:
    - script.execute: show_video_page
  on_video_ended:
    - script.execute: show_phone_page

voip_stack:
  id: phone
  video:
    codec: jpeg
    source: p4_jpeg_video
    sink: p4_video
    width: ${p4_video_width}
    height: ${p4_video_height}
    framerate: ${p4_video_fps}
    rtp_port: 40002
    offer_payload_type: 26
    max_rtp_payload: 1400
