# =============================================================================
# ESP32-P4 platform base
# =============================================================================
#
# Chip-level board/framework selection, hardware accelerator enables and P4
# memory policy for every P4 device in this repo.
#
# Usage:
#   packages:
#     p4_base:
#       url: https://github.com/n-IA-hane/esphome-VoIP
#       file: packages/platform/esp32p4_base.yaml
#       ref: main
# =============================================================================

esp32:
  # This board selects ESPHome's engineering-sample P4 target, including rev1.3.
  # For production P4 rev3 silicon, replace the board selection with:
  #   variant: esp32p4
  #   engineering_sample: false
  # Remove board: esp32-p4-evboard in that variant; keeping this ES board while
  # declaring production silicon is inconsistent and ESPHome rejects it.
  # Silicon-specific libraries are selected at compile time. Rebuild for the
  # new board; an existing rev1.3 firmware does not switch libraries at runtime.
  # Audio Stack uses esp_audio_effects ~1.3 on pre-v3 P4 because newer versions
  # require instructions available on production silicon.
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 32MB
  # 360MHz is the standard ESP-IDF/ESPHome maximum for P4. Some datasheet
  # revisions mention 400MHz only as a special-contact / non-default case, so
  # treat 400MHz as an explicit experiment, not as the baseline.
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    # Qualified DIG-734 FIFO boundary repair, shared by JPEG and H.264.
    components:
      - name: esp_driver_ppa
        source: https://github.com/n-IA-hane/esphome-intercom.git
        ref: dev
        path: idf_components/esp_driver_ppa
    # Omitting version uses the SDK selected by the installed ESPHome release.
    # An explicit newer SDK is a separate candidate: qualify cold boot, restart,
    # normal OTA and simultaneous audio/video before making it the default.
    advanced:
      compiler_optimization: PERF
      enable_idf_experimental_features: true
    sdkconfig_options:
      # Keep P4 instruction/rodata fetches in PSRAM as in the last stable
      # display/audio baseline. Disabling this globally fixed one AFE FFT crash
      # signature but reintroduced display flicker and choppy VoIP TX audio.
      CONFIG_SPIRAM_XIP_FROM_PSRAM: "y"
