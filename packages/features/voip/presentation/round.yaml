# Shared call-page ownership, navigation and content for round displays.
packages:
  lifecycle: !include 'lifecycle.yaml'
  route: !include '../../../lvgl/spotpear_call_media_route.yaml'
  navigation: !include '../../../lvgl/spotpear_voip/nav_full.yaml'
globals:
- id: previous_mode
  type: int
  restore_value: false
  initial_value: '0'
- id: peer_name
  type: std::string
  restore_value: false
  initial_value: '""'
- id: call_ended_active
  type: bool
  restore_value: false
  initial_value: 'false'
- id: voip_dialer_active
  type: bool
  restore_value: false
  initial_value: 'false'
- id: voip_dial_buffer
  type: std::array<char, 33>
  restore_value: false
  initial_value: '{0}'
- id: voip_dial_length
  type: uint8_t
  restore_value: false
  initial_value: '0'
script:
- id: !extend 'ui_call_started'
  then:
  - script.execute: runtime_ui_call_begin
  - script.stop: reply_pagination_timer
  - lambda: |-
      id(peer_name) = peer;
      id(settings_active) = false;
      id(voip_dialer_active) = false;

      id(voip_dial_length) = 0;
      id(voip_dial_buffer)[0] = '\0';
  - script.execute: backlight_timer
  - lvgl.label.update:
      id: call_ringing_out_peer_label
      text: !lambda |-
        return id(peer_name);
  - lvgl.label.update:
      id: call_ringing_in_peer_label
      text: !lambda |-
        return id(peer_name);
  - lvgl.label.update:
      id: call_in_call_peer_label
      text: !lambda |-
        return id(peer_name);
  - script.execute: draw_display
- id: !extend 'ui_call_ended'
  mode: restart
  then:
  - script.execute: runtime_ui_call_end
  - lambda: id(voip_dialer_active) = false;
  - globals.set:
      id: call_ended_active
      value: 'true'
  - lvgl.label.update:
      id: call_ended_peer_label
      text: !lambda |-
        return peer.empty() ? std::string("-") : peer;
  - lvgl.label.update:
      id: call_ended_reason_label
      text: !lambda |-
        std::string r = reason;
        if      (r == "local_hangup")    return std::string("Local hangup");
        else if (r == "remote_hangup")   return std::string("Remote hangup");
        else if (r == "declined")        return std::string("Declined");
        else if (r == "timeout")         return std::string("Timeout");
        else if (r == "busy")            return std::string("Busy");
        else if (r == "unreachable")     return std::string("Unreachable");
        else if (r == "protocol_error")  return std::string("Protocol error");
        else if (r == "bridge_error")    return std::string("Bridge error");
        return r.empty() ? std::string("Ended") : ("Declined: " + r);
  - script.execute: backlight_timer
  - script.execute: draw_display
  - delay: 4s
  - if:
      condition:
        lambda: return id(call_ended_active);
      then:
      - globals.set:
          id: call_ended_active
          value: 'false'
      - script.execute: draw_display
- id: voip_dial_refresh
  mode: restart
  then:
  - lambda: |-
      const bool in_call = id(phone).is_in_call();
      lv_label_set_text(id(call_dial_action_label), in_call ? "\U000F03F5" : "\U000F03F2");
      lv_obj_set_style_bg_color(id(call_dial_call_btn), lv_color_hex(in_call ? 0xEF4444 : 0x22C55E), LV_PART_MAIN);
      if (in_call) {
        id(call_keypad_ui).sync(id(display_visibility).is_visible(id(call_dial_value_label)), id(peer_name).c_str());
      } else if (id(voip_dial_length) == 0) {
        lv_label_set_text(id(call_dial_value_label), "Number / extension");
      } else {
        lv_label_set_text(id(call_dial_value_label), id(voip_dial_buffer).data());
      }
- id: voip_dial_append
  parameters:
    dial_char: int
  then:
  - lambda: |-
      if (id(phone).is_in_call()) {
        id(phone).send_dtmf(static_cast<char>(dial_char));
        return;
      }
      if (!id(phone).is_idle() || dial_char == 0 || id(voip_dial_length) >= 32) return;
      auto &buffer = id(voip_dial_buffer);
      auto &length = id(voip_dial_length);
      buffer[length++] = static_cast<char>(dial_char);
      buffer[length] = '\0';
      id(voip_dial_refresh).execute();
- id: voip_dial_backspace
  then:
  - lambda: |-
      if (!id(phone).is_idle()) return;
      auto &length = id(voip_dial_length);
      if (length == 0) return;
      --length;
      id(voip_dial_buffer)[length] = '\0';
      id(voip_dial_refresh).execute();
- id: voip_dial_clear
  then:
  - lambda: |-
      if (!id(phone).is_idle()) return;
      id(voip_dial_length) = 0;
      id(voip_dial_buffer)[0] = '\0';
      id(voip_dial_refresh).execute();
- id: voip_dial_call
  then:
  - if:
      condition:
        lambda: return id(phone).is_in_call();
      then:
      - voip_stack.call_toggle: null
      else:
      - if:
          condition:
            lambda: return id(phone).is_idle() && id(voip_dial_length) > 0;
          then:
          - voip_stack.call:
              target: !lambda |-
                return std::string(
                    id(voip_dial_buffer).data(),
                    id(voip_dial_length)
                );
- id: call_to_dialer
  then:
  - if:
      condition:
        lambda: return id(phone).is_idle() || id(phone).can_send_dtmf();
      then:
      - lambda: |-
          id(voip_dialer_active) = true;
          id(nav_anim) = LV_SCR_LOAD_ANIM_MOVE_TOP;
          id(nav_anim_ms) = 300;
      - script.execute: reposition_widgets
      - script.execute: voip_dial_refresh
      - script.execute: draw_display
- id: dialer_to_contacts
  then:
  - lambda: |-
      id(voip_dialer_active) = false;
      id(nav_anim) = LV_SCR_LOAD_ANIM_MOVE_BOTTOM;
      id(nav_anim_ms) = 300;
  - script.execute: draw_display
- id: swipe_to_voip
  then:
  - lambda: |-
      id(nav_anim) = LV_SCR_LOAD_ANIM_MOVE_TOP;
      id(nav_anim_ms) = 300;
  - script.execute: switch_to_voip
- id: swipe_to_va
  then:
  - lambda: |-
      id(nav_anim) = LV_SCR_LOAD_ANIM_MOVE_BOTTOM;
      id(nav_anim_ms) = 300;
  - script.execute: switch_to_va
- id: switch_to_voip
  then:
  - script.stop: reply_pagination_timer
  - lambda: id(voip_dialer_active) = false;
  - globals.set:
      id: current_mode
      value: '1'
  - script.execute: update_call_idle_labels
  - script.execute: draw_display
- id: update_call_idle_labels
  then:
  - lambda: |-
      id(peer_name) = id(phone).get_current_destination();
voip_stack:
  on_phonebook_update:
  - lambda: id(peer_name) = destination;
  - script.execute: update_call_idle_labels
  on_destination_changed:
  - lambda: id(peer_name) = destination;
  - script.execute: update_call_idle_labels
  - script.execute: draw_display
defaults:
  _round_phone_state: |
    const bool phone_active = id(phone).is_active();
    const bool phone_ringing = id(phone).is_ringing();
    const bool phone_calling = id(phone).is_calling();
    const bool phone_in_call = id(phone).is_in_call();
    if (phone_active) {
      id(settings_active) = false;
      if (!phone_in_call) id(voip_dialer_active) = false;
    }
  _round_phone_ended_route: |-
    else if (id(call_ended_active) && !id(phone).is_active()) {
      target = id(call_ended_page)->obj;
    }
  _round_phone_active_route: |-

    else if (id(current_mode) == 1) {
      // VoIP mode
      if (phone_ringing) {
        target = id(call_ringing_in_page)->obj;
      } else if (phone_calling) {
        target = id(call_ringing_out_page)->obj;
      } else if (phone_in_call && id(voip_dialer_active)) {
        target = id(call_dialer_page)->obj;
      } else if (phone_in_call ||
                 (phone_active && !phone_ringing && !phone_calling)) {
        target = id(call_in_call_page)->obj;
      } else if (id(voip_dialer_active)) {
        target = id(call_dialer_page)->obj;
      } else {
        target = id(call_idle_page)->obj;
      }
    }
  _round_name_call_idle_page: |-

    else if (target == id(call_idle_page)->obj) page_name = "call_idle";
  _round_name_call_dialer_page: else if (target == id(call_dialer_page)->obj) page_name = "call_dialer";
  _round_name_call_ringing_in_page: else if (target == id(call_ringing_in_page)->obj) page_name = "call_ringing_in";
  _round_name_call_ringing_out_page: else if (target == id(call_ringing_out_page)->obj) page_name = "call_ringing_out";
  _round_name_call_in_call_page: else if (target == id(call_in_call_page)->obj) page_name = "call_in_call";
  _round_name_call_ended_page: else if (target == id(call_ended_page)->obj) page_name = "call_ended";
  _round_draw_phone_tail:
  - if:
      condition:
        lambda: |-
          return id(current_mode) == 1 && id(phone).is_idle()
                 && !id(voip_dialer_active) && !id(init_in_progress);
      then:
      - script.execute: update_call_idle_labels
  _round_render_phone_step:
  - if:
      condition:
        lambda: |-
          return id(ui_state) == ${ui_state_idle} && id(current_mode) == 1
                 && id(phone).is_idle() && !id(voip_dialer_active);
      then:
      - script.execute: update_call_idle_labels
substitutions:
  _round_phone_state: ${_round_phone_state}
  _round_phone_ended_route: ${_round_phone_ended_route}
  _round_phone_active_route: ${_round_phone_active_route}
  _round_name_call_idle_page: ${_round_name_call_idle_page}
  _round_name_call_dialer_page: ${_round_name_call_dialer_page}
  _round_name_call_ringing_in_page: ${_round_name_call_ringing_in_page}
  _round_name_call_ringing_out_page: ${_round_name_call_ringing_out_page}
  _round_name_call_in_call_page: ${_round_name_call_in_call_page}
  _round_name_call_ended_page: ${_round_name_call_ended_page}
  _round_draw_phone_tail: ${_round_draw_phone_tail}
  _round_render_phone_step: ${_round_render_phone_step}
