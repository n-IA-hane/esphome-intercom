# Complete standalone phone operation and its local controls.
voip_stack:
  task_stacks_in_psram: true
  audio_task_stacks_in_psram: true
  signaling_buffers_in_psram: true
  buffers_in_psram: true
  id: phone
  extension: '101'
  conference_groups: CG Casa
  conference_ring: false
  ring_groups: RG Casa
  audio:
    tx:
      codec: opus
      sample_rate: 16000
      pcm_format: s16le
      channels: 1
      frame_ms: 20
    rx:
      codec: opus
      sample_rate: 48000
      pcm_format: s16le
      channels: 1
      frame_ms: 20
  microphone: mic_main
  speaker: voip_speaker_input
  delete_contact_missing_from:
    updates_number: 1
  use_ha_as_first_contact: true
packages:
  callbacks: !include '../../../voip/callbacks.yaml'
  voip_entities_full_duplex: !include '../../../voip/entities_full_duplex.yaml'
  call_settings: !include '../../../voip/call_settings.yaml'
  voip_transport: !include '../../../voip/transport.yaml'
  ringtone_asset: !include '../../../voip/ringtone_asset.yaml'
external_components:
- source: ${voip_stack_components_source}
  components:
  - voip_stack
speaker:
- platform: mixer
  id: audio_mixer
  output_speaker: hw_speaker
  num_channels: 1
  source_speakers:
  - id: voip_mixer_input
    timeout: 10s
    buffer_duration: 128ms
  - id: ringtone_speaker_mix
    timeout: 10s
    buffer_duration: 100ms
- platform: resampler
  id: voip_speaker_input
  output_speaker: voip_mixer_input
  buffer_duration: 128ms
  bits_per_sample: 16
- platform: resampler
  id: ringtone_speaker
  output_speaker: ringtone_speaker_mix
media_source:
- platform: audio_file
  id: ringtone_file_source
media_player:
- platform: speaker_source
  id: speaker_media_player
  name: None
  internal: true
  volume_initial: 1.0
  volume_min: 1.0
  volume_max: 1.0
  announcement_pipeline:
    speaker: ringtone_speaker
    format: FLAC
    sample_rate: 48000
    num_channels: 1
    sources:
    - ringtone_file_source
select:
- platform: template
  name: AEC Mode
  id: aec_mode_select
  icon: mdi:tune-vertical
  options:
  - voip_low_cost
  - voip_high_perf
  initial_option: voip_high_perf
  optimistic: false
  restore_value: true
  set_action:
  - if:
      condition:
        not:
          voip_stack.is_idle: null
      then:
      - logger.log:
          level: WARN
          format: Cannot switch AEC mode during active VoIP call
      else:
      - logger.log:
          format: Switching AEC mode to %s
          args:
          - x.c_str()
      - esp_audio_stack.stop: null
      - esp_aec.set_mode:
          id: aec_processor
          mode: !lambda |-
            return x;
      - esp_audio_stack.start: null
  - lambda: id(aec_mode_select).publish_state(id(aec_processor).get_mode_name());
script:
- id: !extend 'update_status'
  then:
  - if:
      condition:
        voip_stack.is_ringing: null
      then:
      - script.execute: voip_ringing_loop
      else:
      - if:
          condition:
            or:
            - script.is_running: voip_ringing_loop
            - lambda: return id(ringtone_file_source).get_state() != esphome::media_source::MediaSourceState::IDLE;
          then:
          - script.stop: voip_ringing_loop
          - media_player.stop:
              announcement: true
- id: voip_ringing_loop
  mode: restart
  then:
  - while:
      condition:
        voip_stack.is_ringing: null
      then:
      - media_player.play_media:
          id: speaker_media_player
          media_url: audio-file://voip_ringing_sound
          announcement: true
      - wait_until:
          condition:
            media_player.is_announcing: null
          timeout: 2s
      - wait_until:
          condition:
            not:
              media_player.is_announcing: null
          timeout: 5s
      - delay: 1s
binary_sensor:
- id: !extend 'main_button'
  on_multi_click: ${ _phone_buttons_display if 'display' in firmware_features else _phone_buttons_headless }
defaults:
  _phone_buttons_display:
  - timing:
    - ON for 10ms to 500ms
    - OFF for at least 400ms
    then:
    - if:
        condition:
          lambda: return id(voip_dialer_active);
        then:
        - script.execute: voip_dial_call
        else:
        - voip_stack.call_toggle: null
  - timing:
    - ON for 50ms to 500ms
    - OFF for 50ms to 400ms
    - ON for 50ms to 500ms
    - OFF for at least 400ms
    then:
    - if:
        condition:
          lambda: return id(voip_dialer_active);
        then:
        - script.execute: voip_dial_backspace
        else: &id001
        - if:
            condition:
              voip_stack.is_ringing: null
            then:
            - voip_stack.decline_call: null
            else:
            - if:
                condition:
                  voip_stack.is_idle: null
                then:
                - voip_stack.next_contact: null
  - timing:
    - ON for 1s to 3s
    then:
    - switch.toggle: mute
  _phone_buttons_headless:
  - timing:
    - ON for 10ms to 500ms
    - OFF for at least 400ms
    then:
    - voip_stack.call_toggle: {}
  - timing:
    - ON for 50ms to 500ms
    - OFF for 50ms to 400ms
    - ON for 50ms to 500ms
    - OFF for at least 400ms
    then: *id001
  - timing:
    - ON for 1s to 3s
    then:
    - switch.toggle: mute
