# Complete audio telephone binding for either P4 video codec, or audio-only use.
api:
  custom_services: true
voip_stack:
  use_ha_as_first_contact: true
  id: phone
  task_stacks_in_psram: false
  audio_task_stacks_in_psram: false
  buffers_in_psram: false
  audio:
    codecs:
      - codec: pcm
        tx:
          # Prefer 16 kHz / 10 ms to HA; retain 20 ms for compatible peers.
          - sample_rate: 16000
            pcm_format: s16le
            channels: 1
            frame_ms: 10
          - sample_rate: 16000
            pcm_format: s16le
            channels: 1
            frame_ms: 20
        rx:
          # Prefer 48 kHz / 10 ms from HA. 48 kHz / 20 ms exceeds the normal RTP payload budget.
          # 16 kHz alternatives allow compatible PCM peers without unnecessary transcoding.
          - sample_rate: 48000
            pcm_format: s16le
            channels: 1
            frame_ms: 10
          - sample_rate: 16000
            pcm_format: s16le
            channels: 1
            frame_ms: 20
          - sample_rate: 16000
            pcm_format: s16le
            channels: 1
            frame_ms: 10
  microphone: mic_main
  speaker: voip_speaker_input
  ringing_timeout: 30s
  delete_contact_missing_from:
    updates_number: 1
speaker:
- platform: resampler
  id: voip_speaker_input
  output_speaker: hw_speaker
  bits_per_sample: 16
  task_stack_in_psram: false
  buffer_duration: 128ms
external_components:
- source: ${voip_stack_components_source}
  components:
  - voip_stack
packages:
  entities: !include '../../../voip/entities_full_duplex.yaml'
  settings: !include '../../../voip/call_settings.yaml'
  transport: !include '../../../voip/transport.yaml'
