# Complete telephone binding and local controls, without a voice/media coordinator.
voip_stack:
  use_ha_as_first_contact: true
  task_stacks_in_psram: true
  buffers_in_psram: true
  audio:
    codecs:
      - codec: opus
        rx:
          - sample_rate: 48000
            pcm_format: s16le
            channels: 1
            frame_ms: 20
  speaker: hw_speaker
  dc_offset_removal: false
  delete_contact_missing_from:
    updates_number: 1
  on_in_call:
  - output.turn_on: speaker_enable
  on_idle:
  - output.turn_off: speaker_enable
  on_hangup:
  - output.turn_off: speaker_enable
  on_call_failed:
  - output.turn_off: speaker_enable
external_components:
- source: ${voip_stack_components_source}
  components:
  - voip_stack
packages:
  callbacks: !include '../../../voip/callbacks.yaml'
  voip_transport: !include '../../../voip/transport.yaml'
  voip_entities_full_duplex: !include '../../../voip/call_buttons.yaml'
  call_settings: !include '../../../voip/call_settings.yaml'
