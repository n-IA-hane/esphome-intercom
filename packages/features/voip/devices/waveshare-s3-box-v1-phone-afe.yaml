# Complete standalone phone operation and its local controls.
voip_stack:
  use_ha_as_first_contact: true
  id: phone
  transport: udp
  microphone: mic_afe
  speaker: voip_speaker_input
  buffers_in_psram: true
  audio:
    codecs:
      - codec: pcm
        tx:
          - sample_rate: 16000
            pcm_format: s16le
            channels: 1
            frame_ms: 20
        rx:
          - sample_rate: 16000
            pcm_format: s16le
            channels: 1
            frame_ms: 20
packages:
  voip_transport: !include '../../../voip/transport.yaml'
external_components:
- source: ${voip_stack_components_source}
  components:
  - voip_stack
speaker:
- platform: resampler
  id: voip_speaker_input
  output_speaker: hw_speaker
  bits_per_sample: 16
