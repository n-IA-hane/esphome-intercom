# Complete standalone phone operation and its local controls.
voip_stack:
  initial_contact: ${ voip_initial_contact | default('') }
  calling_timeout: ${ voip_calling_timeout | default('120s') }
  id: phone
  transport: udp
  microphone: mic_afe
  speaker: voip_speaker_input
  buffers_in_psram: true
  audio:
    codecs:
      - codec: pcm
        tx:
          - sample_rate: 16000
            pcm_format: s16le
            channels: 1
            frame_ms: 20
          - sample_rate: 16000
            pcm_format: s16le
            channels: 1
            frame_ms: 10
          - sample_rate: 48000
            pcm_format: s16le
            channels: 1
            frame_ms: 10
        rx:
          - sample_rate: 48000
            pcm_format: s16le
            channels: 1
            frame_ms: 10
          - sample_rate: 48000
            pcm_format: s16le
            channels: 1
            frame_ms: 20
          - sample_rate: 16000
            pcm_format: s16le
            channels: 1
            frame_ms: 20
          - sample_rate: 16000
            pcm_format: s16le
            channels: 1
            frame_ms: 10
packages:
  voip_transport: !include '../../../voip/transport.yaml'
external_components:
- source: ${voip_stack_components_source}
  components:
  - voip_stack
speaker:
- platform: resampler
  id: voip_speaker_input
  output_speaker: hw_speaker
  bits_per_sample: 16
