# P4 JPEG video and camera, selected with VoIP, video and a display.
external_components:
- source: ${camera_components_source}
  components:
  - esp_video_camera
esp_video_camera:
  id: p4_camera
  name: P4 Camera
  i2c_id: internal_i2c
  device: jpeg
  resolution: 800x800
  jpeg_quality: 10
  buffer_count: 2
  max_framerate: 10
  rotation: 270
packages:
  video: !include '../../../voip/p4_full_video_jpeg.yaml'

defaults:
  camera_components_source: '${ camera_components_source | default("github://n-IA-hane/esphome-esp-video-camera@dev") }'
