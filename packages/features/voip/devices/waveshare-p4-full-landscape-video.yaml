# P4 JPEG video and camera, selected with VoIP, video and a display.
external_components:
- source: ${camera_components_source}
  components:
  - esp_video_camera
esp_video_camera:
  id: p4_camera
  name: P4 Camera
  i2c_id: internal_i2c
  device: jpeg
  resolution: 800x800
  jpeg_quality: ${p4_jpeg_quality}
  buffer_count: 2
  max_framerate: ${p4_sip_jpeg_fps}
  rotation: 270
packages:
  camera_quality: !include '../../../camera/p4_jpeg_quality.yaml'
  video: !include '../../../voip/p4_full_video_jpeg.yaml'

defaults:
  camera_components_source: '${ camera_components_source | default("github://Psix-anp/esphome-esp-video-camera@main") }'
