# Common text, animation and voice-display hooks for the round layouts.
script:
- id: clear_replying_text
  then: ${ _round_clear_replying_actions if _fw_voice else [] }

- id: !extend 'ui_va_barge_start'
  then:
  - script.stop: reply_pagination_timer
  - script.execute: clear_replying_text
- id: !extend 'ui_va_end'
  then:
  - script.stop: reply_pagination_timer
  - script.execute: backlight_timer
  - text_sensor.template.publish:
      id: text_request
      state: ''
  - text_sensor.template.publish:
      id: text_response
      state: ''
  - script.execute: clear_replying_text
  - script.execute: update_replying_text
- id: !extend 'ui_stt_ended'
  then:
  - text_sensor.template.publish:
      id: text_request
      state: !lambda |-
        return text;
  - script.execute: draw_display
- id: ai_animation_loop
  mode: single
  then:
  - lambda: !lambda |-
      lv_animimg_set_repeat_count(id(idle_anim), 0);
      lv_animimg_start(id(idle_anim));
      lv_anim_del(id(idle_anim), nullptr);
  - while:
      condition:
        lambda: !lambda |-
          return id(current_mode) == 0 &&
                 id(display_visibility).is_visible(id(idle_anim)) &&
                 id(voice_assistant_phase) == ${voice_assist_idle_phase_id} &&
                 !id(init_in_progress);
      then:
      - lambda: !lambda |-
          lv_animimg_start(id(idle_anim));
      - delay: 25s
- id: update_replying_text
  then: ${ _round_update_replying_actions if _fw_voice else [] }

- id: reply_pagination_timer
  mode: restart
  then: ${ _round_reply_pagination_actions if _fw_voice else [] }

defaults:
  _round_clear_replying_actions:
  - lambda: |-
      id(round_text).clear();
      id(reply_total_pages) = 1;
      id(reply_page_index) = 0;
  _round_update_replying_actions:
  - lambda: |-
      if (id(current_mode) != 0 ||
          !id(display_visibility).is_visible(id(reply_line_0)) ||
          id(voice_assistant_phase) != ${voice_assist_replying_phase_id}) {
        return;
      }
      if (!id(round_text).show_reply(id(reply_page_index))) {
        ESP_LOGW("round_text", "Cannot update reply page, preserving previous labels");
      }
  _round_reply_pagination_actions:
  - delay: 14s
  - if:
      condition:
        lambda: |-
          return id(current_mode) == 0 &&
                 id(display_visibility).is_visible(id(reply_line_0)) &&
                 id(voice_assistant_phase) == ${voice_assist_replying_phase_id} &&
                 id(reply_total_pages) > 1;
      then:
      - lambda: |-
          const int next_page = id(reply_page_index) + 1;
          if (id(round_text).show_reply(next_page)) id(reply_page_index) = next_page;
      - script.execute: reply_pagination_timer
