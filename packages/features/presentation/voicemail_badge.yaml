# One shared, event-driven envelope badge; each presentation supplies its idle-page predicate.
packages:
  state: !include
    file: voicemail.yaml
    vars:
      voicemail_changed_code: id(update_voicemail_status).execute();
lvgl:
  top_layer:
    widgets: ${_voicemail_widgets}
script:
- id: update_voicemail_status
  then:
  - lambda: |-
      const bool show = id(ui_voicemail_waiting) && id(phone).is_idle() && (${_voicemail_visible_code});
      const bool hidden = lv_obj_has_flag(id(top_voicemail_label), LV_OBJ_FLAG_HIDDEN);
      if (show && hidden) lv_obj_clear_flag(id(top_voicemail_label), LV_OBJ_FLAG_HIDDEN);
      else if (!show && !hidden) lv_obj_add_flag(id(top_voicemail_label), LV_OBJ_FLAG_HIDDEN);
      ${_voicemail_layout_code}
defaults:
  _voicemail_layout_code: ''
  _voicemail_font_id: font_clock
  _voicemail_y: 72%
  _voicemail_visible_code: false
  _voicemail_widgets:
  - label:
      id: top_voicemail_label
      align: TOP_MID
      y: ${_voicemail_y}
      text: "\U000F01EE"
      text_font: ${_voicemail_font_id}
      text_color: 16762967
      hidden: true
      clickable: true
      on_short_click:
      - lambda: id(phone).call_mailbox();
  _voicemail_font_extra:
  - file: https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf
    glyphs:
    - "\U000F01EE"

substitutions:
  _voicemail_draw:
  - script.execute: update_voicemail_status
  _voicemail_widgets: ${_voicemail_widgets}
  _voicemail_font_extra: ${_voicemail_font_extra}
