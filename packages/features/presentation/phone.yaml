# Contacts and the optional SIP message-waiting badge share one presentation.
substitutions:
  _phone_badge_font: ${ _voicemail_font_id | default('font_clock') }
  _phone_badge_y: ${ _voicemail_y | default('72%') }
  _phone_badge_visible: ${ _voicemail_visible_code | default('false') }
defaults:
  _phone_contacts_view: !include ../voip/presentation/phone_lists.yaml
  _phone_mwi_badge: !include
    file: voicemail_badge.yaml
    vars:
      _voicemail_font_id: ${_phone_badge_font}
      _voicemail_y: ${_phone_badge_y}
      _voicemail_visible_code: ${_phone_badge_visible}
packages:
  keypad_runtime: !include
    file: call_keypad_runtime.yaml
    vars:
      _phone_keypad_name: ${ _keypad_name_label | default('call_dial_value_label') }
      _phone_keypad_duration: ${ _keypad_duration_label | default('call_dial_duration_label') }
      _phone_keypad_peer: ${ _keypad_peer | default('id(peer_name).c_str()') }
  contacts: ${ _phone_contacts_view }
  mwi: ${ _phone_mwi_badge if 'mwi' in firmware_features else {} }
