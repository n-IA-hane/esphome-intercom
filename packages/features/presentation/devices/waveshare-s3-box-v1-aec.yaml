  _v1_setting_15:
  - obj:
      align: TOP_MID
      y: 652
      width: 1
      height: 1
      bg_opa: TRANSP
      border_width: 0
  _v1_gesture_52:
  - script.execute: swipe_to_voip
  _v1_gesture_53:
  - script.execute: swipe_to_voip
  _v1_gesture_54:
  - script.execute: swipe_to_voip
  _v1_gesture_55:
  - script.execute: swipe_to_voip
  _v1_gesture_56:
  - script.execute: swipe_to_voip
  _v1_gesture_57:
  - script.execute: swipe_to_voip
  _v1_gesture_58:
  - script.execute: call_to_settings
  _v1_gesture_59:
  - script.execute: call_to_va
  _v1_phone_state: |
    const std::string s = id(phone).get_state_str();
    bool in_call = (s == "ringing" || s == "calling" ||
                    s == "remote_ringing" || s == "connecting" ||
                    s == "in_call");
    if (in_call) {
      id(settings_active) = false;  // call interrupts settings view
    }
  _v1_phone_ended: |-
    else if (id(call_ended_active) && !id(phone).is_active()) {
      target = id(call_ended_page)->obj;
    }
  _v1_phone_route: |-

    else if (id(current_mode) == 1) {
      // VoIP mode
      const std::string s = id(phone).get_state_str();
      if (s == "ringing") {
        target = id(call_ringing_in_page)->obj;
      } else if (s == "calling" || s == "remote_ringing") {
        target = id(call_ringing_out_page)->obj;
      } else if (s == "in_call" && lv_disp_get_scr_act(nullptr) == id(sip_in_call_keypad_page)->obj) {
        target = id(sip_in_call_keypad_page)->obj;
      } else if (s == "in_call" || s == "connecting") {
        target = id(call_in_call_page)->obj;
      } else {
        target = id(call_idle_page)->obj;
      }
    }
  _v1_route_name_63: |-

    else if (target == id(call_idle_page)->obj) page_name = "call_idle";
  _v1_route_name_64: else if (target == id(call_ringing_in_page)->obj) page_name = "call_ringing_in";
  _v1_route_name_65: else if (target == id(call_ringing_out_page)->obj) page_name = "call_ringing_out";
  _v1_route_name_66: |-
    else if (target == id(sip_in_call_keypad_page)->obj) page_name = "call_keypad";
    else if (target == id(call_in_call_page)->obj) page_name = "call_in_call";
  _v1_route_name_67: else if (target == id(call_ended_page)->obj) page_name = "call_ended";
  _v1_route_name_68: else if (target == id(timer_finished_page)->obj) page_name = "timer_finished";
  _v1_draw_tail_0:
  - lambda: !lambda |-
      // Determine target page
      lv_obj_t* target = nullptr;
      ${ _v1_phone_state if _fw_voip else '' }
      // Timer ringing owns the UI while the alarm is active. This must use
      // the runtime_controller timer activity, not voice_assistant_phase, because media_player
      // callbacks can legitimately update the phase while playing the alarm.
      if (${ 'id(runtime).is_activity_active("timer_ringing")' if _fw_timers else 'false' }) {
        ${ 'target = id(timer_finished_page)->obj;' if _fw_timers else '' }
      } ${ _v1_phone_ended if _fw_voip else '' } else if (id(settings_active) && !id(g_settings_pages).empty()) {
        int idx = id(g_settings_index);
        int n = (int) id(g_settings_pages).size();
        if (idx < 0 || idx >= n) idx = 0;
        target = id(g_settings_pages)[idx];
      } else if (id(init_in_progress)) {
        target = id(initializing_page)->obj;
      } else if (!wifi::global_wifi_component->is_connected()) {
        target = id(no_wifi_page)->obj;
      } else if (id(runtime).is_activity_active("no_ha")) {
        target = id(no_ha_page)->obj;
      } ${ _v1_phone_route if _fw_voip else '' } else {
        // VA mode
        int phase = id(voice_assistant_phase);
        if (phase == ${voice_assist_listening_phase_id}) {
          target = id(listening_page)->obj;
        } else if (phase == ${voice_assist_thinking_phase_id}) {
          target = id(thinking_page)->obj;
        } else if (phase == ${voice_assist_replying_phase_id}) {
          target = id(replying_page)->obj;
        } else if (phase == ${voice_assist_error_phase_id}) {
          target = id(error_page)->obj;
        } else if (phase == ${voice_assist_muted_phase_id}) {
          target = id(muted_page)->obj;
        } else if (phase == ${voice_assist_not_ready_phase_id}) {
          target = id(no_ha_page)->obj;
        } else {
          target = id(idle_page)->obj;
        }
      }

      if (target == nullptr) return;

      const char* page_name = "unknown";
      if (target == id(idle_page)->obj) page_name = "idle";
      else if (target == id(listening_page)->obj) page_name = "listening";
      else if (target == id(thinking_page)->obj) page_name = "thinking";
      else if (target == id(replying_page)->obj) page_name = "replying";
      else if (target == id(error_page)->obj) page_name = "error";
      else if (target == id(muted_page)->obj) page_name = "muted";
      ${ _v1_route_name_63 if _fw_voip else '' }
      ${ _v1_route_name_64 if _fw_voip else '' }
      ${ _v1_route_name_65 if _fw_voip else '' }
      ${ _v1_route_name_66 if _fw_voip else '' }
      ${ _v1_route_name_67 if _fw_voip else '' }
      ${ _v1_route_name_68 if _fw_timers else '' }

      // Skip page load if already showing (avoids redundant SPI transfer)
      bool page_changed = (target != lv_disp_get_scr_act(nullptr));
      if (page_changed) {
        // Stop animation before page switch to prevent split-screen glitch
        lv_anim_del(id(idle_anim), nullptr);
        // Honour swipe-driven animation hint, otherwise instant load.
        if (id(nav_anim) != 0) {
          lv_scr_load_anim(target,
                           (lv_scr_load_anim_t) id(nav_anim),
                           (uint32_t) id(nav_anim_ms),
                           0, false);
        } else {
          lv_disp_load_scr(target);
        }
      }
      // The VA idle animation is stopped before page switches. Start the
      // idle animation loop immediately when VA idle becomes the visible
      // page, instead of waiting for the template binary_sensor refresh.
      id(display_visibility).reconcile();
      if (target == id(idle_page)->obj && id(display_visibility).is_visible(id(idle_anim))) {
        if (!id(ai_animation_loop).is_running()) id(ai_animation_loop).execute();
      } else if (id(ai_animation_loop).is_running()) {
        id(ai_animation_loop).stop();
      }
      // Always consume the hint, even if no page change happened.
      id(nav_anim) = 0;
      id(nav_anim_ms) = 0;

      // Hide top layer status bar on replying/thinking pages (text overlap)
      bool show_status = (target != id(replying_page)->obj && target != id(thinking_page)->obj );
      if (show_status) {
        lv_obj_clear_flag(id(top_clock_label), LV_OBJ_FLAG_HIDDEN);
        lv_obj_clear_flag(id(top_battery_label), LV_OBJ_FLAG_HIDDEN);
      } else {
        lv_obj_add_flag(id(top_clock_label), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(top_battery_label), LV_OBJ_FLAG_HIDDEN);
      }
  _v1_draw_tail_1:
  - if:
      condition:
        binary_sensor.is_on: is_idle_screen
      then:
      - script.execute: update_idle_labels
  _v1_draw_tail_2:
  - if:
      condition:
        lambda: !lambda |-
          return id(current_mode) == 1 && ${ 'id(phone).is_idle()' if _fw_voip else 'true' }
                 && !id(init_in_progress);
      then:
      - script.execute: update_call_idle_labels
  _v1_draw_tail_3:
  - script.execute: update_timer_state
  _v1_timer_geometry_0: |
    lv_obj_set_height(id(timer_overlay), ym[13]);
  _v1_timer_geometry_1: |
    lv_obj_set_width(id(timer_overlay), ym[2]);  // full width = h (square display)
  _v1_timer_geometry_2: |
    lv_obj_set_height(id(timer_bar), ym[13] - 4);
  _v1_timer_geometry_3: lv_obj_set_width(id(timer_bar), ym[2] - 4);
  _v1_render_0:
  - script.execute: runtime_project_ui_phase
  _v1_render_1:
  - script.execute: backlight_timer
  _v1_render_2:
  - if:
      condition:
        lambda: !lambda |-
          return id(ui_state) == ${ui_state_va_listening};
      then:
      - text_sensor.template.publish:
          id: text_request
          state: '...'
      - text_sensor.template.publish:
          id: text_response
          state: '...'
      - script.stop: reply_pagination_timer
  _v1_render_3:
  - if:
      condition:
        lambda: !lambda |-
          return id(ui_state) == ${ui_state_idle} && id(current_mode) == 1
                 && ${ 'id(phone).is_idle()' if _fw_voip else 'true' };
      then:
      - script.execute: update_call_idle_labels
  _v1_render_4:
  - script.execute: draw_display
packages:
  in_call_keypad: !include
    file: ${ '../in_call_keypad.yaml' if _fw_voip else '../../shared/absent.yaml' }
    vars:
      _sip_keypad_font: font_info
      _sip_keypad_duration_font: font_clock
      _sip_keypad_name_width: 50%
      _sip_keypad_return_page: call_in_call_page
  phone_presentation: !include
    file: ${ '../phone.yaml' if _fw_voip else '../../shared/absent.yaml' }
    vars:
      _keypad_name_label: sip_keypad_peer_label
      _keypad_duration_label: sip_keypad_duration_label
      _voicemail_visible_code: (lv_disp_get_scr_act(nullptr) == id(idle_page)->obj || lv_disp_get_scr_act(nullptr) == id(call_idle_page)->obj)${ (' && id(voice_assistant_phase) == ' ~ voice_assist_idle_phase_id) if 'voice' in firmware_features else '' }
  visibility: !include
    file: ../visibility.yaml
    vars:
      _visibility_has_avatar: true
      _visibility_has_pagination: true
      _visibility_idle_widget_id: idle_anim
      _visibility_extra_code: ${ 'id(update_voicemail_status).execute();' if _fw_voip and 'mwi' in firmware_features else '' }
  phase: !include '../phase.yaml'
  settings_navigation: !include '../../../lvgl/lvgl_settings_navigation.yaml'
  settings_volume: !include '../../../lvgl/lvgl_settings_sync_volumes.yaml'
  settings_mute: !include '../../../lvgl/lvgl_settings_sync_mute.yaml'
  settings_aec: !include '../../../lvgl/lvgl_settings_sync_aec.yaml'
  phone: ${ _v1_phone if _fw_voip else {} }
  timers: ${ _v1_timers if _fw_timers else {} }
  artwork: ${ _v1_artwork if _fw_sendspin else {} }
  settings_voice: ${ _v1_settings_voice if _fw_wake_word else {} }
  player: ${ _v1_player if _fw_playback else {} }
  content: !include '../round_content.yaml'
binary_sensor:
- id: !extend 'usb_connected'
  on_press:
  - script.execute: backlight_timer
  on_release:
  - script.execute: backlight_timer
- platform: template
  id: is_idle_screen
  lambda: !lambda |-
    return id(current_mode) == 0 &&
           id(voice_assistant_phase) == ${voice_assist_idle_phase_id} &&
           !id(init_in_progress);
switch:
- id: !extend 'mute'
  on_turn_off:
  - script.execute: draw_display
touchscreen:
- id: !extend 'touch'
  on_touch:
  - script.execute: backlight_timer
  - if:
      condition:
        runtime_controller.is_active:
          id: runtime
          activity: timer_ringing
      then:
      - runtime_controller.event:
          id: runtime
          event: timer_stopped
