# Phone-only screen, including all callbacks and widgets that use it.
wifi:
  on_connect:
  - script.execute: draw_call_screen
  on_disconnect:
  - script.execute: draw_call_screen
api:
  on_client_connected:
  - script.execute: draw_call_screen
voip_stack:
  on_calling:
  - script.execute: draw_call_screen
  on_ringing:
  - script.execute: draw_call_screen
  on_dest_ringing:
  - script.execute: draw_call_screen
  on_in_call:
  - script.execute: draw_call_screen
  on_idle:
  - script.execute: draw_call_screen
  on_hangup:
  - logger.log:
      format: 'Call ended: %s'
      args:
      - reason.c_str()
  - script.execute: draw_call_screen
  on_call_failed:
  - logger.log:
      format: 'Call failed: %s'
      args:
      - reason.c_str()
  - script.execute: draw_call_screen
  on_phonebook_update:
  - script.execute: draw_call_screen
  on_destination_changed:
  - script.execute: draw_call_screen
script:
- id: draw_call_screen
  then:
  - lambda: |-
      const std::string s = id(phone).get_state_str();
      std::string status_text = "IDLE";
      uint32_t status_color = 0x00FF00;
      uint32_t btn_color = 0x00AA00;
      std::string icon = "\U000F03F2";
      std::string peer = id(phone).get_current_destination();

      if (s == "ringing") {
        status_text = "RINGING";
        status_color = 0xFFFF00;
        btn_color = 0x00AA00;
        icon = "\U000F03F2";
      } else if (s == "calling" || s == "remote_ringing") {
        status_text = "CALLING";
        status_color = 0xFFFF00;
        btn_color = 0xAA0000;
        icon = "\U000F03F5";
      } else if (s == "in_call" || s == "connecting") {
        status_text = "IN CALL";
        status_color = 0x00AAFF;
        btn_color = 0xAA0000;
        icon = "\U000F03F5";
      } else {
        status_text = "IDLE";
        status_color = 0x00FF00;
        btn_color = 0x00AA00;
        icon = "\U000F03F2";
      }

      lv_label_set_text(id(call_status_label), status_text.c_str());
      lv_obj_set_style_text_color(id(call_status_label), lv_color_hex(status_color), 0);
      lv_label_set_text(id(call_peer_label), peer.empty() ? "-" : peer.c_str());
      lv_label_set_text(id(call_action_icon), icon.c_str());
      lv_obj_set_style_bg_color(id(call_action_btn), lv_color_hex(btn_color), 0);
font:
- file:
    type: gfonts
    family: Figtree
    weight: 700
  id: font_title
  size: 24
  glyphsets:
  - GF_Latin_Core
- file:
    type: gfonts
    family: Figtree
    weight: 500
  id: font_state
  size: 28
  glyphs: ' ACDEGILNR'
- file: https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf
  id: call_icons
  size: 48
  glyphs:
  - 󰏲
  - 󰏵
lvgl:
  displays:
  - main_display
  touchscreens:
  - touchscreen_id: my_touchscreen
  buffer_size: 50%
  color_depth: 16
  log_level: WARN
  rotation: 180
  pages:
  - id: call_page
    bg_color: 0
    widgets:
    - label:
        align: TOP_MID
        y: 30
        text: ${friendly_name}
        text_color: 16777215
        text_font: font_title
        text_align: CENTER
    - label:
        id: call_status_label
        align: CENTER
        y: -40
        text: IDLE
        text_color: 65280
        text_font: font_state
        text_align: CENTER
    - label:
        id: call_peer_label
        align: CENTER
        y: 10
        text: '-'
        text_color: 16777215
        text_font: font_title
        text_align: CENTER
        width: 260
        long_mode: SCROLL
    - button:
        id: call_action_btn
        align: CENTER
        y: 100
        width: 90
        height: 90
        bg_color: 43520
        radius: 45
        widgets:
        - label:
            id: call_action_icon
            text: 󰏲
            align: CENTER
            text_color: 16777215
            text_font: call_icons
        on_short_click:
        - voip_stack.call_toggle: null
esphome:
  on_boot:
    priority: 600
    then:
    - light.turn_on:
        id: display_backlight
        brightness: 100%
    - script.execute: draw_call_screen

packages:
  visibility: !include '../visibility.yaml'
