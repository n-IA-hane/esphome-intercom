              height: 58
              bg_color: 2435640
              radius: 8
              on_click:
              - lambda: !lambda |-
                  if (!id(phone).is_idle()) return;
                  if (!id(voip_dial_buffer).empty()) id(voip_dial_buffer).pop_back();
                  lv_label_set_text(id(call_keypad_value_label), id(voip_dial_buffer).empty()
                      ? "Enter extension or number" : id(voip_dial_buffer).c_str());
