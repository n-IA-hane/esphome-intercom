                - text: '*'
                - text: '0'
                - text: '#'
              on_click:
              - lambda: !lambda |-
                  static constexpr char KEYS[] = "123456789*0#";
                  if (x >= 12) return;
                  if (id(phone).is_in_call()) {
                    id(phone).send_dtmf(KEYS[x]);
                    return;
                  }
                  if (!id(phone).is_idle() || id(voip_dial_buffer).size() >= 32) return;
                  id(voip_dial_buffer).push_back(KEYS[x]);
                  lv_label_set_text(id(call_keypad_value_label), id(voip_dial_buffer).c_str());
