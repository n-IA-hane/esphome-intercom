                  then:
                  - voip_stack.call_toggle: null
                  else:
                  - if:
                      condition:
                        lambda: !lambda |-
                          return id(phone).is_idle() && !id(voip_dial_buffer).empty();
                      then:
                      - voip_stack.call:
                          target: !lambda |-
