# Phone-only screen, including all callbacks and widgets that use it.
phone_list_view:
- id: !extend contacts_list_view
  row_height: 40
  visible_rows: 5
wifi:
  on_connect:
  - globals.set:
      id: draw_display_pending
      value: 'true'
  on_disconnect:
  - globals.set:
      id: draw_display_pending
      value: 'true'
api:
  on_client_connected:
  - globals.set:
      id: draw_display_pending
      value: 'true'
touchscreen:
- id: !extend 'touch'
  on_touch:
  - script.execute: backlight_timer
voip_stack:
  on_phonebook_update:
  - lambda: id(peer_name) = destination;
  - script.execute: update_call_idle_labels
  on_destination_changed:
  - lambda: id(peer_name) = destination;
  - script.execute: update_call_idle_labels
  - script.execute: draw_display
packages:
  phone_presentation: !include
    file: ../phone.yaml
    vars:
      _voicemail_visible_code: lv_disp_get_scr_act(nullptr) == id(call_idle_page)->obj
  visibility: !include
    file: ../visibility.yaml
    vars:
      _visibility_extra_code: ${ 'id(update_voicemail_status).execute();' if 'mwi' in firmware_features else '' }
  call_media_route: !include '../../../lvgl/spotpear_call_media_route.yaml'
  lvgl_settings_nav: !include '../../../lvgl/lvgl_settings_navigation.yaml'
  lvgl_settings_sync_volumes: !include '../../../lvgl/lvgl_settings_sync_volumes.yaml'
  lvgl_settings_sync_mute: !include '../../../lvgl/lvgl_settings_sync_mute.yaml'
  lvgl_settings_sync_aec: !include '../../../lvgl/lvgl_settings_sync_aec.yaml'
  spotpear_voip_nav: !include '../../../lvgl/spotpear_voip/nav_voip_only.yaml'
script:
- id: !extend 'update_status'
  then:
  - script.execute: draw_display
- id: !extend 'ui_call_started'
  then:
  - lambda: |-
      id(peer_name) = peer;
      id(voip_dialer_active) = false;
  - script.execute: backlight_timer
  - lvgl.label.update:
      id: call_ringing_out_peer_label
      text: !lambda |-
        return id(peer_name);
  - lvgl.label.update:
      id: call_ringing_in_peer_label
      text: !lambda |-
        return id(peer_name);
  - lvgl.label.update:
      id: call_in_call_peer_label
      text: !lambda |-
        return id(peer_name);
  - script.execute: draw_display
- id: !extend 'ui_call_ended'
  mode: restart
  then:
  - lambda: id(voip_dialer_active) = false;
  - globals.set:
      id: call_ended_active
      value: 'true'
  - lvgl.label.update:
      id: call_ended_peer_label
      text: !lambda |-
        return peer.empty() ? std::string("-") : peer;
  - lvgl.label.update:
      id: call_ended_reason_label
      text: !lambda |-
        std::string r = reason;
        if      (r == "local_hangup")    return std::string("Local hangup");
        else if (r == "remote_hangup")   return std::string("Remote hangup");
        else if (r == "declined")        return std::string("Declined");
        else if (r == "timeout")         return std::string("Timeout");
        else if (r == "busy")            return std::string("Busy");
        else if (r == "unreachable")     return std::string("Unreachable");
        else if (r == "protocol_error")  return std::string("Protocol error");
        else if (r == "bridge_error")    return std::string("Bridge error");
        return r.empty() ? std::string("Ended") : ("Declined: " + r);
  - lvgl.page.show: call_ended_page
  - script.execute: backlight_timer
  - delay: 4s
  - if:
      condition:
        lambda: return id(call_ended_active);
      then:
      - globals.set:
          id: call_ended_active
          value: 'false'
      - script.execute: draw_display
- id: draw_display
  mode: restart
  then:
  - lambda: |-
      lv_obj_t* target = nullptr;
      // Active call always wins so we don't hide an incoming/calling screen.
      const std::string s = id(phone).get_state_str();
      bool in_call = (s == "ringing" || s == "calling" ||
                      s == "remote_ringing" || s == "connecting" ||
                      s == "in_call");
      if (in_call) {
        id(settings_active) = false;  // call interrupts settings view
        if (s != "in_call") id(voip_dialer_active) = false;
      }
      // ui_call_ended owns the screen for ~4 s after a terminated
      // call. Any redraw triggered in that window keeps the ended
      // page so the user actually reads the reason.
      if (id(call_ended_active)) {
        target = id(call_ended_page)->obj;
      }  else if (id(settings_active) && !id(g_settings_pages).empty()) {
        int idx = id(g_settings_index);
        int n = (int) id(g_settings_pages).size();
        if (idx < 0 || idx >= n) idx = 0;
        target = id(g_settings_pages)[idx];
      } else if (!wifi::global_wifi_component->is_connected()) {
        target = id(no_wifi_page)->obj;
      } else if (!api::global_api_server->is_connected()) {
        target = id(no_ha_page)->obj;
      } else {
        const std::string s = id(phone).get_state_str();
        if (s == "ringing") {
          target = id(call_ringing_in_page)->obj;
        } else if (s == "calling" || s == "remote_ringing") {
          target = id(call_ringing_out_page)->obj;
        } else if (s == "in_call" && id(voip_dialer_active)) {
          target = id(call_dialer_page)->obj;
        } else if (s == "in_call" || s == "connecting") {
          target = id(call_in_call_page)->obj;
        } else if (id(voip_dialer_active)) {
          target = id(call_dialer_page)->obj;
        } else {
          target = id(call_idle_page)->obj;
        }
      }
      if (target == nullptr) return;
      // Match the full profile: the dialer owns the complete visible disk.
      // Restore both status labels on every other page, including ringing.
      if (target == id(call_dialer_page)->obj) {
        lv_obj_add_flag(id(top_clock_label), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(top_battery_label), LV_OBJ_FLAG_HIDDEN);
      } else {
        lv_obj_clear_flag(id(top_clock_label), LV_OBJ_FLAG_HIDDEN);
        lv_obj_clear_flag(id(top_battery_label), LV_OBJ_FLAG_HIDDEN);
      }
      if (target != lv_disp_get_scr_act(nullptr)) {
        lv_disp_load_scr(target);
        lv_obj_invalidate(lv_disp_get_scr_act(nullptr));
      }
      ${ 'id(update_voicemail_status).execute();' if 'mwi' in firmware_features else '' }
  - if:
      condition:
        voip_stack.is_idle: null
      then:
      - script.execute: update_call_idle_labels
      - script.execute: update_idle_labels
- id: update_call_idle_labels
  then:
  - lambda: id(peer_name) = id(phone).get_current_destination();
- id: layout_call_dialer
  then:
  - lambda: |-
      lv_disp_t *disp = lv_disp_get_default();
      if (disp == nullptr) return;
      const int w = lv_disp_get_hor_res(disp);
      const int h = lv_disp_get_ver_res(disp);
      if (w <= 0 || h <= 0) return;

      const int cy = h / 2;
      const int radius = std::min(w, h) / 2 - 4;
      auto width_for_band = [&](int y, int height, int margin) -> int {
        const int bottom = y + height - 1;
        const int distance = std::max(std::abs(y - cy), std::abs(bottom - cy));
        if (distance >= radius) return 1;

        const int radius_sq = radius * radius;
        const int distance_sq = distance * distance;
        int half = static_cast<int>(
            floorf(sqrtf(static_cast<float>(radius_sq - distance_sq)))
        ) - margin;
        if (half < 1) half = 1;
        return half * 2;
      };
      auto fit_centered_band = [&](lv_obj_t *obj, int y, int height, int margin) {
        const int width = width_for_band(y, height, margin);
        lv_obj_set_size(obj, width, height);
        lv_obj_align(obj, LV_ALIGN_TOP_MID, 0, y);
      };

      const bool connected_keypad = id(phone).is_in_call();
      const int number_y = h * (connected_keypad ? 12 : 16) / 240;
      const int number_h = connected_keypad ? lv_font_get_line_height(lv_obj_get_style_text_font(id(call_dial_value_label), LV_PART_MAIN)) : std::max(24, h * 26 / 240);
      const int row_h = std::max(29, h * (connected_keypad ? 29 : 31) / 240);
      const int call_y = h * 187 / 240;
      const int call_h = std::max(40, h * 43 / 240);
      fit_centered_band(id(call_dial_value_label), number_y, number_h, 6);
      fit_centered_band(id(call_dial_duration_label), h * 36 / 240, lv_font_get_line_height(lv_obj_get_style_text_font(id(call_dial_duration_label), LV_PART_MAIN)), 6);
      fit_centered_band(id(call_dial_row_123)->obj, h * (connected_keypad ? 60 : 46) / 240, row_h, 6);
      fit_centered_band(id(call_dial_row_456)->obj, h * (connected_keypad ? 92 : 81) / 240, row_h, 6);
      fit_centered_band(id(call_dial_row_789)->obj, h * (connected_keypad ? 124 : 116) / 240, row_h, 6);
      fit_centered_band(id(call_dial_row_del0hash)->obj, h * (connected_keypad ? 156 : 151) / 240, row_h, 6);
      fit_centered_band(id(call_dial_call_btn), call_y, call_h, 2);
- id: voip_dial_refresh
  then:
  - lambda: |-
      const bool in_call = id(phone).is_in_call();
      lv_label_set_text(id(call_dial_action_label), in_call ? "\U000F03F5" : "\U000F03F2");
      lv_obj_set_style_bg_color(id(call_dial_call_btn), lv_color_hex(in_call ? 0xEF4444 : 0x22C55E), LV_PART_MAIN);
      if (in_call) {
        id(call_keypad_ui).sync(id(display_visibility).is_visible(id(call_dial_value_label)), id(peer_name).c_str());
      } else if (id(voip_dial_length) == 0) {
        lv_label_set_text(id(call_dial_value_label), "Number / extension");
      } else {
        lv_label_set_text(id(call_dial_value_label), id(voip_dial_buffer).data());
      }
- id: voip_dial_append
  parameters:
    dial_char: int
  then:
  - lambda: |-
      if (id(phone).is_in_call()) {
        id(phone).send_dtmf(static_cast<char>(dial_char));
        return;
      }
      if (!id(phone).is_idle() || dial_char == 0 || id(voip_dial_length) >= 32) return;
      auto &buffer = id(voip_dial_buffer);
      auto &length = id(voip_dial_length);
      buffer[length++] = static_cast<char>(dial_char);
      buffer[length] = '\0';
      id(voip_dial_refresh).execute();
- id: voip_dial_backspace
  then:
  - lambda: |-
      if (!id(phone).is_idle()) return;
      auto &length = id(voip_dial_length);
      if (length > 0) length--;
      id(voip_dial_buffer)[length] = '\0';
      id(voip_dial_refresh).execute();
- id: voip_dial_clear
  then:
  - lambda: |-
      if (!id(phone).is_idle()) return;
      id(voip_dial_length) = 0;
      id(voip_dial_buffer)[0] = '\0';
      id(voip_dial_refresh).execute();
- id: voip_dial_call
  then:
  - if:
      condition:
        lambda: return id(phone).is_in_call();
      then:
      - voip_stack.call_toggle: null
      else:
      - if:
          condition:
            lambda: return id(phone).is_idle() && id(voip_dial_length) > 0;
          then:
          - voip_stack.call:
              target: !lambda |-
                return std::string(
                    id(voip_dial_buffer).data(),
                    id(voip_dial_length)
                );
- id: call_to_dialer
  then:
  - if:
      condition:
        lambda: return id(phone).is_idle() || id(phone).can_send_dtmf();
      then:
      - lambda: |-
          id(settings_active) = false;
          id(voip_dialer_active) = true;
      - script.execute: layout_call_dialer
      - script.execute: voip_dial_refresh
      - script.execute: draw_display
- id: dialer_to_contacts
  then:
  - lambda: id(voip_dialer_active) = false;
  - script.execute: draw_display
- id: update_idle_labels
  then:
  - lvgl.label.update:
      id: top_clock_label
      text:
        format: '%02d:%02d'
        args:
        - id(my_time).now().hour
        - id(my_time).now().minute
  - if:
      condition:
      - lambda: return id(battery_percentage).has_state() && !std::isnan(id(battery_percentage).state);
      then:
      - lvgl.label.update:
          id: top_battery_label
          text: !lambda |-
            bool charging = id(usb_connected).state;
            float bat = id(battery_percentage).state;
            float wifi = ${ 'id(wifi_pct).state' if 'diagnostics' in firmware_features else 'std::max(0.0f, std::min(100.0f, 2.0f * (wifi::global_wifi_component->wifi_rssi() + 100.0f)))' };
            std::string ret;
            if (bat < 10) ret = charging ? "\U000F089F" : "\U000F008E";
            else if (bat < 20) ret = charging ? "\U000F089C" : "\U000F007A";
            else if (bat < 30) ret = charging ? "\U000F0086" : "\U000F007B";
            else if (bat < 40) ret = charging ? "\U000F0087" : "\U000F007C";
            else if (bat < 50) ret = charging ? "\U000F0088" : "\U000F007D";
            else if (bat < 60) ret = charging ? "\U000F089D" : "\U000F007E";
            else if (bat < 70) ret = charging ? "\U000F0089" : "\U000F007F";
            else if (bat < 80) ret = charging ? "\U000F089E" : "\U000F0080";
            else if (bat < 90) ret = charging ? "\U000F008A" : "\U000F0081";
            else if (bat < 100) ret = charging ? "\U000F008B" : "\U000F0082";
            else ret = "\U000F0079";
            if (wifi < 20) ret += "\U000F08BF";
            else if (wifi < 55) ret += "\U000F08BC";
            else if (wifi < 80) ret += "\U000F08BD";
            else ret += "\U000F08BE";
            ret += api::global_api_server->is_connected() ? "\U000F07D0" : "\U000F15D0";
            return ret;
      else:
      - lvgl.label.update:
          id: top_battery_label
          text: !lambda |-
            std::string ret;
            return ret;
- id: backlight_timer
  mode: restart
  then:
  - light.turn_on:
      id: backlight
      brightness: 100%
  - delay: 30s
  - light.turn_on:
      id: backlight
      brightness: 60%
  - delay: 120s
  - if:
      condition:
        binary_sensor.is_on: usb_connected
      then:
      - light.turn_on:
          id: backlight
          brightness: 20%
      else:
      - light.turn_off: backlight
- id: idle_refresh_loop
  mode: single
  then:
  - while:
      condition:
        voip_stack.is_idle: null
      then:
      - script.execute: update_idle_labels
      - delay: 30s
binary_sensor:
- id: !extend 'usb_connected'
  on_press:
  - script.execute: backlight_timer
  on_release:
  - script.execute: backlight_timer
defaults:
  _phone_boot_led_off:
  - light.turn_off: status_led
  _phone_boot_start:
  - light.turn_on:
      id: backlight
      brightness: 100%
  _phone_boot_rest:
  - script.execute: backlight_timer
  - delay: 1s
  - lambda: id(peer_name) = id(phone).get_current_destination();
  - script.execute: update_call_idle_labels
  - lambda: |-
      id(g_settings_pages).clear();
      id(g_settings_pages).push_back(id(settings_volumes_page)->obj);
      id(g_settings_pages).push_back(id(settings_mute_page)->obj);
      id(g_settings_pages).push_back(id(settings_aec_page)->obj);
  - script.execute: layout_call_dialer
  - script.execute: draw_display
font:
- file:
    type: gfonts
    family: Figtree
    weight: 600
  id: font_clock
  size: 20
  glyphs: 0123456789:%
  extras:
  - file: https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf
    glyphs:
    - 󰁹
    - 󰂎
    - 󰁺
    - 󰁻
    - 󰁼
    - 󰁽
    - 󰁾
    - 󰁿
    - 󰂀
    - 󰂁
    - 󰂂
    - 󰢟
    - 󰢜
    - 󰂆
    - 󰂇
    - 󰂈
    - 󰢝
    - 󰂉
    - 󰢞
    - 󰂊
    - 󰂋
    - 󰢿
    - 󰢼
    - 󰢽
    - 󰢾
    - 󰟐
    - 󱗐
    - "\U000F01EE"
- file: https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf
  id: call_icons
  size: 42
  glyphs:
  - 󰏲
  - 󰏵
  - 󰜱
  - 󰜴
- file:
    type: gfonts
    family: Figtree
    weight: 700
  id: font_title
  size: 24
  glyphsets:
  - GF_Latin_Core
  extras:
  - file: https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf
    glyphs:
    - 󰁮
    - 󰛋
    - "\U000F061C"
- file:
    type: gfonts
    family: Figtree
    weight: 500
  id: font_state
  size: 28
  glyphs: ' ACDEFGHILNRWio'
- file:
    type: gfonts
    family: Figtree
    weight: 400
  id: font_info
  size: 20
  glyphsets:
  - GF_Latin_Core
lvgl:
  displays:
  - s3_box_lcd
  buffer_size: 50%
  color_depth: 16
  log_level: WARN
  top_layer:
    widgets:
    - label:
        id: top_clock_label
        align: TOP_MID
        y: 90%
        text: ''
        text_color: 16777215
        text_font: font_clock
    - label:
        id: top_battery_label
        align: TOP_MID
        y: 82%
        text: ''
        text_color: 16777215
        text_font: font_clock
  pages:
  - id: no_wifi_page
    bg_color: 0
    widgets:
    - label:
        align: CENTER
        text: No WiFi
        text_color: 16744576
        text_font: font_state
        text_align: CENTER
  - id: no_ha_page
    bg_color: 0
    widgets:
    - label:
        align: CENTER
        text: No HA
        text_color: 16777088
        text_font: font_state
        text_align: CENTER
  - id: call_idle_page
    scrollable: false
    bg_color: 0x10151F
    on_swipe_up:
    - script.execute: call_to_dialer
    on_swipe_down:
    - script.execute: call_to_va
    widgets:
    - label:
        align: TOP_MID
        y: 8%
        text: Contacts
        text_color: 0xFFFFFF
        text_font: font_info
    - obj:
        id: phone_contacts_container
        align: TOP_MID
        y: 22%
        width: 80%
        height: 50%
        pad_all: 0
        border_width: 0
        bg_opa: TRANSP
        scroll_dir: VER
        scrollbar_mode: AUTO
  - id: call_ringing_in_page
    bg_color: 16711680
    widgets:
    - label:
        align: TOP_MID
        y: 8%
        text: ${friendly_name}
        text_color: 16777215
        text_font: font_title
        text_align: CENTER
        width: ${call_title_width}
        long_mode: SCROLL
    - label:
        align: TOP_MID
        y: 17%
        text: RINGING
        text_color: 16776960
        text_font: font_state
        text_align: CENTER
    - label:
        id: call_ringing_in_peer_label
        align: CENTER
        text: ''
        text_color: 16777215
        text_font: font_title
        text_align: CENTER
        long_mode: SCROLL
        width: ${call_ringing_in_peer_width}
    - button:
        floating: true
        align: LEFT_MID
        x: ${call_btn_offset}
        width: ${call_btn_size}
        height: ${call_btn_size}
        bg_opa: TRANSP
        shadow_opa: TRANSP
        widgets:
        - label:
            text: 󰏲
            align: CENTER
            text_color: 65280
            text_font: call_icons
        on_short_click:
        - voip_stack.call_toggle: null
    - button:
        floating: true
        align: RIGHT_MID
        x: -5
        width: ${call_btn_size}
        height: ${call_btn_size}
        bg_opa: TRANSP
        shadow_opa: TRANSP
        widgets:
        - label:
            text: 󰏵
            align: CENTER
            text_color: 16777215
            text_font: call_icons
        on_short_click:
        - voip_stack.decline_call: null
  - id: call_ringing_out_page
    bg_color: 16750848
    widgets:
    - label:
        align: TOP_MID
        y: 8%
        text: ${friendly_name}
        text_color: 16777215
        text_font: font_title
        text_align: CENTER
        width: ${call_title_width}
        long_mode: SCROLL
    - label:
        align: TOP_MID
        y: 17%
        text: CALLING
        text_color: 0
        text_font: font_state
        text_align: CENTER
    - label:
        id: call_ringing_out_peer_label
        align: CENTER
        text: ''
        text_color: 16777215
        text_font: font_title
        text_align: CENTER
        long_mode: SCROLL
        width: ${call_peer_width}
    - button:
        floating: true
        align: CENTER
        y: ${call_btn_below_center}
        width: ${call_btn_size}
        height: ${call_btn_size}
        bg_opa: TRANSP
        shadow_opa: TRANSP
        widgets:
        - label:
            text: 󰏵
            align: CENTER
            text_color: 16711680
            text_font: call_icons
        on_short_click:
        - voip_stack.decline_call: null
  - id: call_in_call_page
    bg_color: 34816
    widgets:
    - button:
        id: call_keypad_btn
        align: TOP_MID
        y: 2%
        width: 20%
        height: 16%
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        shadow_opa: TRANSP
        on_short_click:
        - script.execute: call_to_dialer
        widgets:
        - label:
            align: CENTER
            text: "\U000F061C"
            text_color: 16777215
            text_font: font_title
    - label:
        align: TOP_MID
        y: 17%
        text: IN CALL
        text_color: 255
        text_font: font_state
        text_align: CENTER
    - label:
        id: call_in_call_peer_label
        align: CENTER
        text: ''
        text_color: 16777215
        text_font: font_title
        text_align: CENTER
        long_mode: SCROLL
        width: ${call_peer_width}
    - button:
        floating: true
        align: CENTER
        y: ${call_btn_below_center}
        width: ${call_btn_size}
        height: ${call_btn_size}
        bg_opa: TRANSP
        shadow_opa: TRANSP
        widgets:
