globals:
- id: peer_name
  type: std::string
  restore_value: false
  initial_value: '""'
- id: y_metrics
  type: std::vector<int>
  restore_value: false
- id: call_ended_active
  type: bool
  restore_value: false
  initial_value: 'false'
- id: voip_dialer_active
  type: bool
  restore_value: false
  initial_value: 'false'
- id: voip_dial_buffer
  type: std::array<char, 33>
  restore_value: false
  initial_value: '{0}'
- id: voip_dial_length
  type: uint8_t
  restore_value: false
  initial_value: '0'
- id: draw_display_pending
  type: bool
  restore_value: false
  initial_value: 'false'
button:
- platform: factory_reset
  id: factory_reset_btn
  internal: true
time:
- platform: sntp
  id: my_time
  timezone: Europe/Rome
  servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org
interval:
- interval: 250ms
  then:
  - if:
      condition:
        lambda: return id(draw_display_pending);
      then:
      - globals.set:
          id: draw_display_pending
          value: 'false'
      - script.execute: draw_display
esphome:
  on_boot:
  - priority: 600
    then: ${ _phone_boot_start + (_phone_boot_led_off if 'status_led' in firmware_features else []) + _phone_boot_rest
      }
