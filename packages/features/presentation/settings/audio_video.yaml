  _settings_mode_widgets:
    - label:
        width: ${_settings_control_width}
        text: Processing mode
        text_align: LEFT
        text_color: 16777215
        text_font: ${_settings_font}
        long_mode: WRAP
    - dropdown:
        id: ui_aec_mode_dd
        width: ${_settings_control_width}
        options: ${_settings_modes}
        on_change:
          - select.set_index:
              id: ${settings_processing_mode_id}
              index: !lambda |-
                return x;
          - script.execute: settings_sync_mode
  _settings_mode_package:
    script:
      - id: settings_sync_mode
        then:
          - if:
              condition:
                lambda: |-
                  if (lv_disp_get_scr_act(nullptr) != id(${_settings_page_id})->obj ||
                      lv_obj_is_scrolling(id(settings_page_wrapper))) return false;
                  const auto selected = id(${settings_processing_mode_id}).active_index();
                  return selected.has_value() && id(ui_aec_mode_dd).get_selected_index() != *selected;
              then:
                # The Select and widget share the configured mode list. Use the
                # native wrapper action so its option mapping stays coherent.
                - lvgl.dropdown.update:
                    id: ui_aec_mode_dd
                    selected_text: !lambda |-
                      return id(${settings_processing_mode_id}).current_option();
  _settings_mode_callback: id(${settings_processing_mode_id}).add_on_state_callback([](size_t) {
    id(settings_sync_mode).execute(); });
