# Audio, processing and voice controls retain their existing owners.
# Only user events write owners; programmatic updates use separate LVGL events.
defaults:
  settings_microphone_gain_id: ${ settings_microphone_gain_id | default('') }
  settings_microphone_gain_label: ${ settings_microphone_gain_label | default('Software microphone gain') }
  settings_input_gain_id: ${ settings_input_gain_id | default('') }
  settings_input_gain_label: ${ settings_input_gain_label | default('Microphone input gain') }
  settings_reference_gain_id: ${ settings_reference_gain_id | default('') }
  settings_reference_gain_label: ${ settings_reference_gain_label | default('AEC reference gain') }
  settings_voip_gain_id: ${ settings_voip_gain_id | default('') }
  _settings_numbers: !include number_controls.yaml
substitutions:
  _settings_modes: ${ firmware_processing_modes | default([]) }
  settings_microphone_gain_id: ${settings_microphone_gain_id}
  settings_microphone_gain_label: ${settings_microphone_gain_label}
  settings_input_gain_id: ${settings_input_gain_id}
  settings_input_gain_label: ${settings_input_gain_label}
  settings_reference_gain_id: ${settings_reference_gain_id}
  settings_reference_gain_label: ${settings_reference_gain_label}
  settings_voip_gain_id: ${settings_voip_gain_id}
  _settings_has_mic_gain: ${ settings_microphone_gain_id != '' and settings_microphone_gain_id not in [settings_input_gain_id, settings_reference_gain_id, settings_voip_gain_id] }
  _settings_number_widgets: ${ (_settings_numbers['mic']['widgets'] if _settings_has_mic_gain else []) + (_settings_numbers['input']['widgets'] if settings_input_gain_id else []) + (_settings_numbers['reference']['widgets'] if settings_reference_gain_id else []) + (_settings_numbers['voip']['widgets'] if settings_voip_gain_id else []) }
  _settings_number_callbacks: |-
    ${ _settings_numbers['mic']['callback'] if _settings_has_mic_gain else '' }
    ${ _settings_numbers['input']['callback'] if settings_input_gain_id else '' }
    ${ _settings_numbers['reference']['callback'] if settings_reference_gain_id else '' }
    ${ _settings_numbers['voip']['callback'] if settings_voip_gain_id else '' }
  _settings_number_refresh: ${ (_settings_numbers['mic']['refresh'] if _settings_has_mic_gain else []) + (_settings_numbers['input']['refresh'] if settings_input_gain_id else []) + (_settings_numbers['reference']['refresh'] if settings_reference_gain_id else []) + (_settings_numbers['voip']['refresh'] if settings_voip_gain_id else []) }
  _settings_speaker_widgets: ${ _settings_numbers['master']['widgets'] }
  _settings_speaker_package: ${ _settings_numbers['master']['package'] }
  _settings_speaker_callback: ${ _settings_numbers['master']['callback'] }
  _settings_playback_widgets:
    - label:
        width: ${_settings_control_width}
        text: !lambda |-
          char text[64];
          snprintf(text, sizeof(text), "Playback volume: %ld%%", std::lround(id(speaker_media_player).volume * 100.0f));
          return std::string(text);
        text_align: LEFT
        text_color: 16777215
        text_font: ${_settings_font}
        long_mode: WRAP
        id: ui_playback_value_label
    - slider:
        id: ui_playback_vol_slider
        width: ${_settings_control_width}
        height: ${settings_slider_height}
        ext_click_area: ${_settings_slider_touch_pad}
        margin_bottom: ${_settings_slider_touch_pad}
        min_value: 0
        max_value: 100
        adv_hittest: true
        on_release:
          - media_player.volume_set:
              id: speaker_media_player
              volume: !lambda |-
                return x / 100.0f;
          - script.execute: settings_sync_playback
  _settings_playback_package:
    script:
      - id: settings_sync_playback
        then:
          - if:
              condition:
                lambda: !lambda |-
                  if (lv_disp_get_scr_act(nullptr) != id(${_settings_page_id})->obj ||
                      lv_obj_is_scrolling(id(settings_page_wrapper)) ||
                      lv_obj_has_state(id(ui_playback_vol_slider), LV_STATE_PRESSED)) return false;
                  char text[64];
                  snprintf(text, sizeof(text), "Playback volume: %ld%%",
                           std::lround(id(speaker_media_player).volume * 100.0f));
                  return lv_slider_get_value(id(ui_playback_vol_slider)) !=
                             std::lround(id(speaker_media_player).volume * 100.0f) ||
                         strcmp(lv_label_get_text(id(ui_playback_value_label)), text) != 0;
              then:
                - lvgl.label.update:
                    id: ui_playback_value_label
                    text: !lambda |-
                      char text[64];
                      snprintf(text, sizeof(text), "Playback volume: %ld%%", std::lround(id(speaker_media_player).volume * 100.0f));
                      return std::string(text);
                - lvgl.slider.update:
                    id: ui_playback_vol_slider
                    value: !lambda |-
                      return std::lround(id(speaker_media_player).volume * 100.0f);
  _settings_playback_callback: id(speaker_media_player).add_on_state_callback([](media_player::MediaPlayerState)
    { id(settings_sync_playback).execute(); });
  _settings_speaker_mute_widgets:
    - obj:
        width: ${_settings_control_width}
        height: SIZE_CONTENT
        min_height: ${_settings_row_height}
        clickable: false
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        scrollable: false
        layout:
          type: FLEX
          flex_flow: ROW
          flex_align_main: SPACE_BETWEEN
          flex_align_cross: CENTER
        widgets:
          - label:
              width: ${_settings_label_width}
              text: Speaker mute
              text_align: LEFT
              text_color: 16777215
              text_font: ${_settings_font}
              long_mode: WRAP
          - switch:
              id: ui_speaker_mute_sw
              width: ${_settings_switch_width}
              height: ${_settings_switch_height}
              on_change:
                - lambda: !lambda |-
                    if (x == id(speaker_mute).state) return;
                    if (x) id(speaker_mute).turn_on();
                    else id(speaker_mute).turn_off();
                - script.execute: settings_sync_speaker_mute
  _settings_speaker_mute_package:
    script:
      - id: settings_sync_speaker_mute
        then:
          - if:
              condition:
                lambda: !lambda |-
                  return lv_disp_get_scr_act(nullptr) == id(${_settings_page_id})->obj &&
                         !lv_obj_is_scrolling(id(settings_page_wrapper)) &&
                         lv_obj_has_state(id(ui_speaker_mute_sw), LV_STATE_CHECKED) != id(speaker_mute).state;
              then:
                - lvgl.widget.update:
                    id: ui_speaker_mute_sw
                    state:
                      checked: !lambda |-
                        return id(speaker_mute).state;
  _settings_speaker_mute_callback: id(speaker_mute).add_on_state_callback([](bool)
    { id(settings_sync_speaker_mute).execute(); });
