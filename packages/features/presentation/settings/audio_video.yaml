                      return std::string(text);
                - lvgl.slider.update:
                    id: ui_mic_vol_slider
                    value: !lambda |-
                      return id(${settings_microphone_gain_id}).state;
  _settings_mic_callback: id(${settings_microphone_gain_id}).add_on_state_callback([](float) { id(settings_sync_mic).execute();
    });
  _settings_speaker_mute_widgets:
    - obj:
        width: ${_settings_control_width}
        height: SIZE_CONTENT
        min_height: ${_settings_row_height}
        clickable: false
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        scrollable: false
        layout:
          type: FLEX
          flex_flow: ROW
          flex_align_main: SPACE_BETWEEN
          flex_align_cross: CENTER
        widgets:
          - label:
              width: ${_settings_label_width}
              text: Speaker mute
              text_align: LEFT
              text_color: 16777215
              text_font: ${_settings_font}
              long_mode: WRAP
          - switch:
              id: ui_speaker_mute_sw
              width: ${_settings_switch_width}
              height: ${_settings_switch_height}
              on_change:
                - lambda: !lambda |-
                    if (x == id(speaker_mute).state) return;
                    if (x) id(speaker_mute).turn_on();
                    else id(speaker_mute).turn_off();
                - script.execute: settings_sync_speaker_mute
  _settings_speaker_mute_package:
    script:
      - id: settings_sync_speaker_mute
        then:
          - if:
              condition:
                lambda: !lambda |-
                  return lv_disp_get_scr_act(nullptr) == id(${_settings_page_id})->obj;
              then:
                - lvgl.widget.update:
                    id: ui_speaker_mute_sw
                    state:
                      checked: !lambda |-
                        return id(speaker_mute).state;
  _settings_speaker_mute_callback: id(speaker_mute).add_on_state_callback([](bool)
    { id(settings_sync_speaker_mute).execute(); });
