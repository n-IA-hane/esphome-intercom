    + (_settings_playback_widgets if _fw_playback else []) + _settings_number_widgets
    + _settings_speaker_mute_widgets + _settings_mic_mute_widgets
    + (_settings_camera_quality_widgets if _settings_camera_jpeg_quality else []) }
  _settings_right_widgets: ${ _settings_processing_widgets + (_settings_aec_widgets if settings_aec_switch_id else []) + (_settings_mode_widgets if settings_processing_mode_id else [])
    + (_settings_ns_widgets if settings_ns_switch_id else []) + (_settings_agc_widgets if settings_agc_switch_id else []) + (_settings_vad_widgets if settings_vad_switch_id else []) + (_settings_voice_heading
    + _settings_wake_word_widgets if _fw_wake_word else [])
    + (_settings_sendspin_widgets if _fw_sendspin else []) }
  _settings_audio_callbacks: !lambda |-
    ${ _settings_speaker_callback }
    ${ _settings_number_callbacks }
    ${ _settings_speaker_mute_callback }
    ${ _settings_mic_mute_callback }
    ${ _settings_aec_callback if settings_aec_switch_id else '' }
    ${ _settings_mode_callback if settings_processing_mode_id else '' }
    ${ _settings_ns_callback if settings_ns_switch_id else '' }
    ${ _settings_agc_callback if settings_agc_switch_id else '' }
    ${ _settings_vad_callback if settings_vad_switch_id else '' }
    ${ _settings_wake_word_callback if _fw_wake_word else '' }
    ${ _settings_playback_callback if _fw_playback else '' }
    ${ _settings_sendspin_callback if _fw_sendspin else '' }
    ${ _settings_camera_quality_callback if _settings_camera_jpeg_quality else '' }
  _settings_audio_sync:
    - script.execute: settings_sync_speaker
    - script.execute: settings_sync_speaker_mute
    - script.execute: settings_sync_mic_mute

  _settings_refresh_aec:
    - script.execute: settings_sync_aec
  _settings_refresh_mode:
    - script.execute: settings_sync_mode
  _settings_refresh_ns:
    - script.execute: settings_sync_ns
  _settings_refresh_agc:
    - script.execute: settings_sync_agc
  _settings_refresh_vad:
    - script.execute: settings_sync_vad
  _settings_refresh_wake_word:
    - script.execute: settings_sync_wake_word
  _settings_refresh_playback:
    - script.execute: settings_sync_playback
  _settings_refresh_sendspin:
    - script.execute: settings_sync_sendspin
  _settings_refresh_audio: ${ _settings_audio_sync + _settings_number_refresh + (_settings_refresh_aec if settings_aec_switch_id else []) + (_settings_refresh_mode if settings_processing_mode_id else []) + (_settings_refresh_ns if settings_ns_switch_id else []) + (_settings_refresh_agc if settings_agc_switch_id else []) + (_settings_refresh_vad if settings_vad_switch_id else []) + (_settings_refresh_wake_word if _fw_wake_word else []) + (_settings_refresh_playback if _fw_playback else []) + (_settings_refresh_sendspin if _fw_sendspin else []) + (_settings_refresh_camera_quality if _settings_camera_jpeg_quality else []) }
packages:
  camera_quality: ${ _settings_camera_quality_package if _settings_camera_jpeg_quality else {} }
  speaker: ${ _settings_speaker_package }
  mic_number: ${ _settings_numbers['mic']['package'] if _settings_has_mic_gain else {} }
  input_gain_number: ${ _settings_numbers['input']['package'] if settings_input_gain_id else {} }
  reference_gain_number: ${ _settings_numbers['reference']['package'] if settings_reference_gain_id else {} }
  voip_gain_number: ${ _settings_numbers['voip']['package'] if settings_voip_gain_id else {} }
  speaker_mute: ${ _settings_speaker_mute_package }
  mic_mute: ${ _settings_mic_mute_package }
  aec: ${ _settings_aec_package if settings_aec_switch_id else {} }
  mode: ${ _settings_mode_package if settings_processing_mode_id else {} }
  ns: ${ _settings_ns_package if settings_ns_switch_id else {} }
  agc: ${ _settings_agc_package if settings_agc_switch_id else {} }
  vad: ${ _settings_vad_package if settings_vad_switch_id else {} }
  wake_word: ${ _settings_wake_word_package if _fw_wake_word else {} }
  playback: ${ _settings_playback_package if _fw_playback else {} }
  sendspin: ${ _settings_sendspin_package if _fw_sendspin else {} }
