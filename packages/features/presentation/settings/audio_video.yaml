        text_align: LEFT
        text_color: 16777215
        text_font: ${_settings_font}
        long_mode: WRAP
    - label:
        width: ${_settings_control_width}
        text: !lambda |-
          const auto &code = id(sendspin_pairing_code).state;
          return code.empty() ? std::string("No pairing code") : std::string("Pairing code: ") + code;
        text_align: LEFT
        text_color: 16777215
        text_font: ${_settings_font}
        long_mode: WRAP
        id: ui_sendspin_pairing_label
    - button:
        id: ui_sendspin_confirm_btn
