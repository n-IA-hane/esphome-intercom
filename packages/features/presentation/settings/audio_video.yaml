  _settings_right_widgets: ${ _settings_processing_widgets + _settings_aec_widgets + _settings_mode_widgets
    + (_settings_ns_widgets + _settings_agc_widgets if _settings_afe and _settings_single_mic
    else []) + (_settings_vad_widgets if _settings_afe else []) + (_settings_voice_heading
    + _settings_wake_word_widgets if _fw_wake_word else [])
    + (_settings_sendspin_widgets if _fw_sendspin else []) }
  _settings_audio_callbacks: !lambda |-
    ${ _settings_speaker_callback }
    ${ _settings_mic_callback if _settings_has_mic_gain else '' }
    ${ _settings_speaker_mute_callback }
    ${ _settings_mic_mute_callback }
    ${ _settings_aec_callback }
    ${ _settings_mode_callback }
    ${ _settings_ns_callback + '\n' + _settings_agc_callback if _settings_afe and _settings_single_mic else '' }
    ${ _settings_vad_callback if _settings_afe else '' }
    ${ _settings_wake_word_callback if _fw_wake_word else '' }
    ${ _settings_playback_callback if _fw_playback else '' }
    ${ _settings_sendspin_callback if _fw_sendspin else '' }
    ${ _settings_camera_quality_callback if _settings_camera_jpeg_quality else '' }
  _settings_audio_sync:
    - script.execute: settings_sync_speaker
    - script.execute: settings_sync_speaker_mute
    - script.execute: settings_sync_mic_mute
    - script.execute: settings_sync_aec
    - script.execute: settings_sync_mode
  _settings_refresh_mic:
    - script.execute: settings_sync_mic
  _settings_refresh_ns:
    - script.execute: settings_sync_ns
  _settings_refresh_agc:
    - script.execute: settings_sync_agc
  _settings_refresh_vad:
    - script.execute: settings_sync_vad
  _settings_refresh_wake_word:
    - script.execute: settings_sync_wake_word
  _settings_refresh_playback:
    - script.execute: settings_sync_playback
  _settings_refresh_sendspin:
    - script.execute: settings_sync_sendspin
  _settings_refresh_audio: ${ _settings_audio_sync + (_settings_refresh_mic if _settings_has_mic_gain else []) + (_settings_refresh_ns + _settings_refresh_agc
    if _settings_afe and _settings_single_mic else []) + (_settings_refresh_vad if
    _settings_afe else []) + (_settings_refresh_wake_word if _fw_wake_word else [])
    + (_settings_refresh_playback if _fw_playback else []) + (_settings_refresh_sendspin
    if _fw_sendspin else []) + (_settings_refresh_camera_quality if _settings_camera_jpeg_quality else []) }
packages:
  camera_quality: ${ _settings_camera_quality_package if _settings_camera_jpeg_quality else {} }
  speaker: ${ _settings_speaker_package }
  mic: ${ _settings_mic_package if _settings_has_mic_gain else {} }
  speaker_mute: ${ _settings_speaker_mute_package }
  mic_mute: ${ _settings_mic_mute_package }
  aec: ${ _settings_aec_package }
  mode: ${ _settings_mode_package }
  ns: ${ _settings_ns_package if _settings_afe and _settings_single_mic else {} }
  agc: ${ _settings_agc_package if _settings_afe and _settings_single_mic else {}
    }
  vad: ${ _settings_vad_package if _settings_afe else {} }
  wake_word: ${ _settings_wake_word_package if _fw_wake_word else {} }
  playback: ${ _settings_playback_package if _fw_playback else {} }
  sendspin: ${ _settings_sendspin_package if _fw_sendspin else {} }
