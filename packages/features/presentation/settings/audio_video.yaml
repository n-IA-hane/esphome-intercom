# Audio, processing and voice controls retain their existing owners.
# Only user events write owners; programmatic updates use separate LVGL events.
substitutions:
  settings_microphone_gain_id: mic_gain
  settings_microphone_gain_label: Microphone gain
  _settings_has_mic_gain: ${ settings_microphone_gain_id != "mic_gain" or firmware_audio_backend == "native" or not _fw_voice }
  _settings_speaker_widgets:
    - label:
        width: ${_settings_control_width}
        text: !lambda |-
          char text[64];
          snprintf(text, sizeof(text), "Master volume: %.0f%%", static_cast<double>(id(master_volume).state));
          return std::string(text);
        text_align: LEFT
        text_color: 16777215
        text_font: ${_settings_font}
        long_mode: WRAP
        id: ui_speaker_value_label
    - slider:
        id: ui_speaker_vol_slider
        width: ${_settings_control_width}
        height: ${settings_slider_height}
        ext_click_area: ${_settings_slider_touch_pad}
        margin_bottom: ${_settings_slider_touch_pad}
        min_value: 0
        max_value: 100
        adv_hittest: true
        on_release:
          - number.set:
              id: master_volume
              value: !lambda |-
                return x;
          - script.execute: settings_sync_speaker
  _settings_speaker_package:
    script:
      - id: settings_sync_speaker
        then:
          - if:
              condition:
                lambda: !lambda |-
                  return lv_disp_get_scr_act(nullptr) == id(${_settings_page_id})->obj && !lv_obj_has_state(id(ui_speaker_vol_slider), LV_STATE_PRESSED);
              then:
                - lvgl.label.update:
                    id: ui_speaker_value_label
                    text: !lambda |-
                      char text[64];
                      snprintf(text, sizeof(text), "Master volume: %.0f%%", static_cast<double>(id(master_volume).state));
                      return std::string(text);
                - lvgl.slider.update:
                    id: ui_speaker_vol_slider
                    value: !lambda |-
                      return id(master_volume).state;
  _settings_speaker_callback: id(master_volume).add_on_state_callback([](float) {
    id(settings_sync_speaker).execute(); });
  _settings_playback_widgets:
    - label:
        width: ${_settings_control_width}
        text: !lambda |-
          char text[64];
          snprintf(text, sizeof(text), "Playback volume: %ld%%", std::lround(id(speaker_media_player).volume * 100.0f));
          return std::string(text);
        text_align: LEFT
        text_color: 16777215
        text_font: ${_settings_font}
        long_mode: WRAP
        id: ui_playback_value_label
    - slider:
        id: ui_playback_vol_slider
        width: ${_settings_control_width}
        height: ${settings_slider_height}
        ext_click_area: ${_settings_slider_touch_pad}
        margin_bottom: ${_settings_slider_touch_pad}
        min_value: 0
        max_value: 100
        adv_hittest: true
        on_release:
          - media_player.volume_set:
              id: speaker_media_player
              volume: !lambda |-
                return x / 100.0f;
          - script.execute: settings_sync_playback
  _settings_playback_package:
    script:
      - id: settings_sync_playback
        then:
          - if:
              condition:
                lambda: !lambda |-
                  if (lv_disp_get_scr_act(nullptr) != id(${_settings_page_id})->obj ||
                      lv_obj_has_state(id(ui_playback_vol_slider), LV_STATE_PRESSED)) return false;
                  char text[64];
                  snprintf(text, sizeof(text), "Playback volume: %ld%%",
                           std::lround(id(speaker_media_player).volume * 100.0f));
                  return lv_slider_get_value(id(ui_playback_vol_slider)) !=
                             std::lround(id(speaker_media_player).volume * 100.0f) ||
                         strcmp(lv_label_get_text(id(ui_playback_value_label)), text) != 0;
              then:
                - lvgl.label.update:
                    id: ui_playback_value_label
                    text: !lambda |-
                      char text[64];
                      snprintf(text, sizeof(text), "Playback volume: %ld%%", std::lround(id(speaker_media_player).volume * 100.0f));
                      return std::string(text);
                - lvgl.slider.update:
                    id: ui_playback_vol_slider
                    value: !lambda |-
                      return std::lround(id(speaker_media_player).volume * 100.0f);
  _settings_playback_callback: id(speaker_media_player).add_on_state_callback([](media_player::MediaPlayerState)
    { id(settings_sync_playback).execute(); });
