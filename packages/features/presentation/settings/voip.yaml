# This final section is included only for VoIP. Video follows the real call pipeline.
defaults:
  _settings_switches: !include switch_controls.yaml
substitutions:
  _settings_auto_answer_widgets: ${ _settings_switches['auto_answer']['widgets'] }
  _settings_auto_answer_package: ${ _settings_switches['auto_answer']['package'] }
  _settings_auto_answer_callback: ${ _settings_switches['auto_answer']['callback'] }
  _settings_auto_answer_refresh: ${ _settings_switches['auto_answer']['refresh'] }
  _settings_dnd_widgets: ${ _settings_switches['dnd']['widgets'] }
  _settings_dnd_package: ${ _settings_switches['dnd']['package'] }
  _settings_dnd_callback: ${ _settings_switches['dnd']['callback'] }
  _settings_dnd_refresh: ${ _settings_switches['dnd']['refresh'] }
  _settings_voip_heading:
    - obj:
        width: ${settings_row_width}
        height: 2
        bg_color: 4473924
        border_width: 0
        pad_all: 0
    - label:
        width: ${settings_row_width}
        text: VoIP
        text_align: LEFT
        text_color: 8956671
        text_font: ${_settings_font}
        long_mode: WRAP
  _settings_voip_controls: ${ _settings_auto_answer_widgets + _settings_dnd_widgets + _settings_conference_ring_widgets }
  _settings_conference_ring_widgets:
    - obj:
        width: ${_settings_control_width}
        height: SIZE_CONTENT
        min_height: ${_settings_row_height}
        clickable: false
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        scrollable: false
        layout:
          type: FLEX
          flex_flow: ROW
          flex_align_main: SPACE_BETWEEN
          flex_align_cross: CENTER
        widgets:
          - label:
              width: ${_settings_label_width}
              text: Conference ringing
              text_align: LEFT
              text_color: 16777215
              text_font: ${_settings_font}
              long_mode: WRAP
          - switch:
              id: ui_conference_ring_sw
              width: ${_settings_switch_width}
              height: ${_settings_switch_height}
              on_change:
                - lambda: !lambda |-
                    if (x == id(phone).get_conference_ring()) return;
                    id(phone).set_conference_ring(x);
                - script.execute: settings_sync_conference_ring
  _settings_conference_ring_sync:
    - script.execute: settings_sync_conference_ring
  _settings_voip_sync: ${ _settings_auto_answer_refresh + _settings_dnd_refresh + _settings_conference_ring_sync }
  _settings_video_widgets: ${ _settings_switches['video']['widgets'] }
  _settings_video_sync: ${ _settings_switches['video']['refresh'] }
  _settings_video_package: ${ _settings_switches['video']['package'] }
  _settings_video_callback: ${ _settings_switches['video']['callback'] }
  _settings_voip_callback: !lambda |-
    ${ _settings_auto_answer_callback }
    ${ _settings_dnd_callback }
    if (auto *setting = id(phone).get_conference_ring_switch())
      setting->add_on_state_callback([](bool) { id(settings_sync_conference_ring).execute(); });
    ${ _settings_video_callback if _settings_video else '' }
  _settings_voip_widgets: ${ _settings_voip_heading + _settings_voip_container }
  _settings_voip_container:
    - obj:
        id: settings_voip_controls
        width: ${settings_row_width}
        height: SIZE_CONTENT
        scrollable: false
        border_width: 0
        pad_all: 0
        bg_opa: TRANSP
        layout:
          type: FLEX
          flex_flow: ROW_WRAP
          flex_align_main: SPACE_BETWEEN
          flex_align_cross: CENTER
          pad_row: ${settings_pad_row}
        widgets: ${ _settings_voip_controls + (_settings_video_widgets if _settings_video
          else []) }
    - label:
        width: ${settings_row_width}
        text: Extension and groups are configured in Home Assistant.
        text_align: LEFT
        text_color: 11184810
        text_font: ${_settings_font}
        long_mode: WRAP
  _settings_refresh_voip: ${ _settings_voip_sync + (_settings_video_sync if _settings_video
    else []) }
  _settings_conference_ring_scripts:
    - id: settings_sync_conference_ring
      then:
        - if:
            condition:
              lambda: !lambda |-
                return lv_disp_get_scr_act(nullptr) == id(${_settings_page_id})->obj &&
                           !lv_obj_is_scrolling(id(settings_page_wrapper)) &&
                           lv_obj_has_state(id(ui_conference_ring_sw), LV_STATE_CHECKED) != id(phone).get_conference_ring();
            then:
              - lvgl.widget.update:
                  id: ui_conference_ring_sw
                  state:
                    checked: !lambda |-
                      return id(phone).get_conference_ring();
script: ${ _settings_auto_answer_package['script'] + _settings_dnd_package['script'] + _settings_conference_ring_scripts }
packages:
  video: ${ _settings_video_package if _settings_video else {} }
