# Native screen/layout events suspend visual work without stopping device tasks.
external_components:
  - source: ${ext_components_source}
    components: [lvgl_visibility]
lvgl_visibility:
  id: display_visibility
  on_change:
    - script.execute: sync_visual_activity
script:
  - id: sync_visual_activity
    mode: restart
    then: ${ _visibility_avatar_actions + _visibility_pager_actions }
defaults:
  _visibility_has_avatar: false
  _visibility_has_pagination: false
  _visibility_idle_widget_id: idle_anim
  _visibility_avatar_actions: ${ _visibility_avatar_steps if _visibility_has_avatar else [] }
  _visibility_pager_actions: ${ _visibility_pager_steps if _visibility_has_pagination else [] }
  _visibility_avatar_steps:
    - if:
        condition:
          lambda: |-
            return id(display_visibility).is_visible(id(${_visibility_idle_widget_id})) &&
                   id(current_mode) == 0 && !id(init_in_progress) &&
                   id(voice_assistant_phase) == ${voice_assist_idle_phase_id};
        then:
          - if:
              condition:
                lambda: return !id(ai_animation_loop).is_running();
              then:
                - script.execute: ai_animation_loop
        else:
          - script.stop: ai_animation_loop
          - lambda: lv_animimg_delete(id(${_visibility_idle_widget_id}));
  _visibility_pager_steps:
    - if:
        condition:
          lambda: |-
            return id(display_visibility).is_visible(id(reply_line_0)) &&
                   id(current_mode) == 0 && id(reply_total_pages) > 1 &&
                   id(voice_assistant_phase) == ${voice_assist_replying_phase_id};
        then:
          - if:
              condition:
                lambda: return !id(reply_pagination_timer).is_running();
              then:
                - script.execute: update_replying_text
                - script.execute: reply_pagination_timer
        else:
          - script.stop: reply_pagination_timer
