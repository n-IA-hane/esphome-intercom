  _round_phone_layout: |-
    const auto &gx = id(layout_x);
    const auto &gy = id(layout_y);
    const int w = gx.back();
    const int h = gy.back();
    if (w <= 0 || h <= 0) return;

    const int cy = gy[20];
    const int edge = std::max(1, std::min(w, h) / 60);
    const int radius = std::min(w, h) / 2 - edge;
    auto width_for_band = [&](int y, int height, int margin) -> int {
      const int bottom = y + height - 1;
      const int distance = std::max(std::abs(y - cy), std::abs(bottom - cy));
      if (distance >= radius) return 1;

      const int radius_sq = radius * radius;
      const int distance_sq = distance * distance;
      int half = static_cast<int>(
          floorf(sqrtf(static_cast<float>(radius_sq - distance_sq)))
      ) - margin;
      if (half < 1) half = 1;
      return half * 2;
    };
    auto fit_centered_band = [&](lv_obj_t *obj, int y, int height, int margin) {
      const int width = width_for_band(y, height, margin);
      lv_obj_set_size(obj, width, height);
      lv_obj_align(obj, LV_ALIGN_TOP_MID, 0, y);
    };

    // Orthogonal call grid: header/state/count at rows 5/10/15,
    // contact and arrows at row 20; call controls at row 28.
    auto place = [&](lv_obj_t *obj, int x, int y) {
      lv_obj_align(obj, LV_ALIGN_CENTER, x - gx[20], y - gy[20]);
    };
    auto label_at = [&](lv_obj_t *obj, int row, int max_width = 0) {
      const int height = lv_font_get_line_height(lv_obj_get_style_text_font(obj, LV_PART_MAIN));
      int width = width_for_band(gy[row] - height / 2, height, edge);
      if (max_width > 0) width = std::min(width, max_width);
      lv_obj_set_size(obj, width, height);
      place(obj, gx[20], gy[row]);
    };
    auto button_at = [&](lv_obj_t *obj, int x, int y, int size) {
      lv_obj_set_size(obj, size, size);
      lv_obj_set_style_pad_all(obj, 0, LV_PART_MAIN);
      place(obj, x, y);
    };
    lv_obj_t *titles[] = {
      id(call_idle_title_label), id(call_ringing_in_title_label),
      id(call_ringing_out_title_label), id(call_in_call_title_label), id(call_ended_title_label)
    };
    for (auto *obj : titles) label_at(obj, 5);
    lv_obj_t *statuses[] = {
      id(call_idle_status_label), id(call_ringing_in_status_label),
      id(call_ringing_out_status_label), id(call_in_call_status_label), id(call_ended_status_label)
    };
    for (auto *obj : statuses) label_at(obj, 10);
    label_at(id(call_idle_contacts_label), 15);

    const int nav_size = std::min(gx[8], gy[8]);
    const int nav_band = width_for_band(gy[20] - nav_size / 2, nav_size, 0);
    const int inset = (w - nav_band) / 2;
    const int left_x = gx.front() + inset + nav_size / 2;
    const int right_x = gx.back() - inset - nav_size / 2;
    button_at(id(call_idle_prev_contact_btn), left_x, gy[20], nav_size);
    button_at(id(call_idle_next_contact_btn), right_x, gy[20], nav_size);
    label_at(id(call_idle_peer_label), 20, right_x - left_x - nav_size - 2 * edge);

    lv_obj_t *peers[] = {
      id(call_ringing_in_peer_label), id(call_ringing_out_peer_label),
      id(call_in_call_peer_label), id(call_ended_peer_label)
    };
    for (auto *obj : peers) label_at(obj, 20);
    const int call_size = std::min(gx[10], gy[10]);
    lv_obj_t *single_actions[] = {id(call_idle_call_btn), id(call_cancel_btn), id(call_hangup_btn)};
    for (auto *obj : single_actions) button_at(obj, gx[20], gy[28], call_size);
    button_at(id(call_answer_btn), gx[12], gy[28], call_size);
    button_at(id(call_decline_btn), gx[28], gy[28], call_size);
    label_at(id(call_ended_reason_caption), 26);
    label_at(id(call_ended_reason_label), 30);

    const int number_y = h * 16 / 240;
    const int number_h = std::max(24, h * 26 / 240);
    const int row_h = std::max(29, h * 31 / 240);
    const int call_y = h * 187 / 240;
    const int call_h = std::max(40, h * 43 / 240);
    fit_centered_band(id(call_dial_value_label), number_y, number_h, 6);
    fit_centered_band(id(call_dial_row_123)->obj, h * 46 / 240, row_h, 6);
    fit_centered_band(id(call_dial_row_456)->obj, h * 81 / 240, row_h, 6);
    fit_centered_band(id(call_dial_row_789)->obj, h * 116 / 240, row_h, 6);
    fit_centered_band(id(call_dial_row_del0hash)->obj, h * 151 / 240, row_h, 6);
    fit_centered_band(id(call_dial_call_btn), call_y, call_h, 2);
  _round_timer_page:
  - id: timer_finished_page
    bg_color: 0
    widgets:
    - image:
        align: CENTER
        src: assistant_gui_timer_finished
  _round_timer_overlay:
  - obj:
      id: timer_overlay
      align: TOP_MID
      width: 1
      height: 1
      bg_color: 16777215
      border_color: 0
      border_width: 1
      hidden: true
      widgets:
      - bar:
          id: timer_bar
          align: CENTER
          width: 1
          height: 1
          min_value: 0
          max_value: 100
          value: 50
          indicator:
            bg_color: 2551098
      - label:
          id: timer_label
          align: CENTER
          text: ''
          text_color: 0
          text_font: font_timer
  _round_timer_layout: |
    lv_obj_set_height(id(timer_overlay), ym[13]);
    lv_obj_set_width(id(timer_overlay), ym[2]);
    lv_obj_set_height(id(timer_bar), ym[13] - 4);
    lv_obj_set_width(id(timer_bar), ym[2] - 4);
globals:
- id: layout_x
  type: std::array<int16_t, 41>
  restore_value: false
  initial_value: '{0}'
- id: layout_y
  type: std::array<int16_t, 41>
  restore_value: false
  initial_value: '{0}'
