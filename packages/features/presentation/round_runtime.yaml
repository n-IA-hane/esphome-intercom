# Round presentation with shared content hooks and board-specific rendering.
wifi:
  on_connect:
  - script.execute: draw_display
  on_disconnect:
  - script.execute: draw_display
api:
  on_client_connected:
  - script.execute: draw_display
binary_sensor:
- platform: template
  id: is_idle_screen
  lambda: |-
    return id(current_mode) == 0 &&
           id(voice_assistant_phase) == ${voice_assist_idle_phase_id} &&
           !id(init_in_progress);
button:
- platform: factory_reset
  id: factory_reset_btn
  internal: true
time:
- platform: sntp
  id: my_time
  timezone: Europe/Rome
  servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org
text_sensor:
- id: text_request
  platform: template
  on_value:
    then:
    - lambda: |-
        static constexpr size_t kRoundTextRows = 10;
        const std::string &text = x;
        lv_obj_t* lines[] = {
          id(think_line_0), id(think_line_1), id(think_line_2), id(think_line_3), id(think_line_4),
          id(think_line_5), id(think_line_6), id(think_line_7), id(think_line_8), id(think_line_9)
        };
        for (size_t i = 0; i < kRoundTextRows; i++) lv_label_set_text(lines[i], "");
        if (text == "...") return;
        std::vector<std::string> words;
        words.reserve(text.size()/5);
        size_t start = 0;
        for (size_t i = 0; i <= text.size(); ++i) {
          if (i == text.size() || text[i] == ' ' || text[i] == '\n' || text[i] == '\r' || text[i] == '\t') {
            if (i > start) words.push_back(text.substr(start, i - start));
            start = i + 1;
          }
        }
        if (words.empty()) return;
        const auto &chords = id(chord_widths_cache);
        const size_t total_rows = kRoundTextRows;
        const lv_font_t *font = lv_obj_get_style_text_font(id(think_line_0), LV_PART_MAIN);
        // Start from middle of display (row total_rows/2 - 3)
        size_t start_row = total_rows / 2 - 3;
        if (start_row >= total_rows) start_row = 0;
        // lines[] already cleared above
        size_t row = start_row;
        size_t word_idx = 0;
        const int avg_char_w = lv_font_get_line_height(font) * 2 / 3;  // ~60% of line height
        while (row < total_rows && word_idx < words.size()) {
          const int chord_w = chords[row];
          if (chord_w <= 0) { row++; continue; }
          const size_t sw = word_idx;
          std::string line;
          line.reserve(chord_w / avg_char_w);
          while (word_idx < words.size()) {
            const auto &word = words[word_idx];
            std::string candidate = line.empty() ? word : (line + ' ' + word);
            if ((int)(candidate.length() * avg_char_w) > chord_w) {
              lv_point_t size;
              lv_text_get_size(&size, candidate.c_str(), font, 0, 0, INT32_MAX, LV_TEXT_FLAG_NONE);
              if (size.x > chord_w) {
                if (word_idx == sw) { line = word; word_idx++; }
                break;
              }
            }
            line = candidate;
            word_idx++;
          }
          if (word_idx > sw) lv_label_set_text(lines[row], line.c_str());
          row++;
        }
- id: text_response
  platform: template
  on_value:
    then:
    - lambda: |-
        static constexpr size_t kRoundTextRows = 10;
        // Skip redundant "..." during replying phase (label text set by update_replying_text)
        if (x == "..." && id(voice_assistant_phase) == ${voice_assist_replying_phase_id}) {
          return;
        }
        const std::string &text = x;
        std::vector<std::string> words;
        words.reserve(text.size()/5);
        size_t start = 0;
        for (size_t i = 0; i <= text.size(); ++i) {
          if (i == text.size() || text[i] == ' ' || text[i] == '\n' || text[i] == '\r' || text[i] == '\t') {
            if (i > start) {
              words.push_back(text.substr(start, i - start));
            }
            start = i + 1;
          }
        }
        id(reply_page_index) = 0;
        id(wrapped_lines_reply).clear();
        id(reply_total_pages) = 1;
        if (words.empty()) return;
        const auto &chords = id(chord_widths_cache);
        const size_t total_rows = kRoundTextRows;
        const lv_font_t *font = lv_obj_get_style_text_font(id(reply_line_0), LV_PART_MAIN);
        const int avg_char_w = lv_font_get_line_height(font) * 2 / 3;
        size_t word_idx = 0;
        size_t safety = 0;
        size_t line_count = 0;
        while (word_idx < words.size() && safety++ < words.size() * 2) {
          int row = line_count % total_rows;
          const int chord_w = chords[row];
          if (chord_w <= 0) { id(wrapped_lines_reply).push_back(""); line_count++; continue; }
          const size_t start_word = word_idx;
          std::string line;
          line.reserve(chord_w / avg_char_w);
          while (word_idx < words.size()) {
            const auto &word = words[word_idx];
            std::string candidate = line.empty() ? word : (line + ' ' + word);
            if ((int)(candidate.length() * avg_char_w) > chord_w) {
              lv_point_t size;
              lv_text_get_size(&size, candidate.c_str(), font, 0, 0, INT32_MAX, LV_TEXT_FLAG_NONE);
              if (size.x > chord_w) {
                if (word_idx == start_word) { line = word; word_idx++; }
                break;
              }
            }
            line = candidate;
            word_idx++;
          }
          if (word_idx > start_word) {
            id(wrapped_lines_reply).push_back(line);
            line_count++;
          }
        }
        while (!id(wrapped_lines_reply).empty() &&
               (id(wrapped_lines_reply).size() % kRoundTextRows) != 0) {
          id(wrapped_lines_reply).push_back("");
        }
        line_count = id(wrapped_lines_reply).size();
        id(reply_total_pages) =
            (line_count + kRoundTextRows - 1) / kRoundTextRows;
        if (id(reply_total_pages) < 1) id(reply_total_pages) = 1;
interval:
- interval: 30s
  then:
  - script.execute: update_idle_labels
globals:
- id: voice_assistant_phase
  type: int
  restore_value: false
  initial_value: ${voice_assist_not_ready_phase_id}
- id: current_mode
  type: int
  restore_value: false
  initial_value: '0'
- id: nav_anim
  type: int
  restore_value: false
  initial_value: '0'
- id: nav_anim_ms
  type: int
  restore_value: false
  initial_value: '0'
- id: reply_page_index
  type: int
  restore_value: false
  initial_value: '0'
- id: reply_total_pages
  type: int
  restore_value: false
  initial_value: '1'
- id: wrapped_lines_reply
  type: std::vector<std::string>
  restore_value: false
- id: chord_widths_cache
  type: std::array<int16_t, 10>
  restore_value: false
  initial_value: '{0}'
- id: text_row_y
  type: std::array<int16_t, 10>
  restore_value: false
  initial_value: '{0}'
- id: y_metrics
  type: std::array<int16_t, 14>
  restore_value: false
  initial_value: '{0}'
script:
- id: round_navigate
  parameters:
    delta: int
  then:
  - lambda: |-
      // Consume a recognized swipe even when an endpoint or priority owner
      // keeps the current page. It must not become a click on its old button.
      auto *input = lv_indev_active();
      if (input != nullptr && lv_indev_get_gesture_dir(input) != LV_DIR_NONE) {
        lv_indev_wait_release(input);
      }
      if (id(g_ota_in_progress) || id(init_in_progress) ||
          ${ 'id(phone).is_active()' if _round_has_phone else 'false' } ||
          ${ 'id(runtime).is_activity_active("timer_ringing")' if _round_has_timers else 'false' }) return;
      if (delta == 0) return;
      ${ 'if (id(ui_voicemail_active)) { id(close_voicemail).execute(); return; }' if _round_has_phone else '' }

      // These are positions in the visible sequence, derived from the
      // existing owners. No additional navigation state is retained.
      int current = id(settings_active) ? 3 :
          ${ '(id(voip_dialer_active) ? 2 : (id(current_mode) == 1 ? 1 : 0))' if _round_has_phone else '0' };
      const int step = delta > 0 ? 1 : -1;
      int next = current + step;
      while (next >= 0 && next <= 3) {
        if ((next == 0 && ${ 'true' if _fw_voice else 'false' }) ||
            ((next == 1 || next == 2) && ${ 'true' if _round_has_phone else 'false' }) || next == 3) break;
        next += step;
      }
      if (next < 0 || next > 3) return;

      id(settings_active) = next == 3;
      id(g_settings_index) = 0;
      id(current_mode) = next == 1 || next == 2 ? 1 : 0;
      ${ 'id(voip_dialer_active) = next == 2;\n      id(call_ended_active) = false;' if _round_has_phone else '' }
      id(nav_anim) = step > 0 ? LV_SCR_LOAD_ANIM_MOVE_TOP : LV_SCR_LOAD_ANIM_MOVE_BOTTOM;
      id(nav_anim_ms) = 300;
      id(draw_display).execute();
- id: apply_media_artwork
  then:
  - lambda: |-
      // The Sendspin artwork extension selects either the decoded cover or
      // mood_neutral atomically. Do not invalidate a neutral intermediate.
- id: !extend 'render_ui_state'
  then: ${ _round_render_before_phone + (_round_render_phone_step if _round_has_phone else []) + _round_render_after_phone
    }
- id: !extend 'ui_tts_started'
  then:
  - lambda: |-
      std::string t = text;
      esphome::image::Image *mood = id(mood_neutral);
      if (t.size() >= 3) {
        std::string prefix = t.substr(0, 3);
        if (prefix == ":-)") {
          mood = id(mood_happy);
        } else if (prefix == ":-(") {
          mood = id(mood_angry);
        } else if (prefix == ":-|") {
          // neutral (default)
        }
        if (prefix == ":-)" || prefix == ":-(" || prefix == ":-|") {
          t = t.substr(3);
          if (!t.empty() && t[0] == ' ') t = t.substr(1);
        }
      }
      lv_img_set_src(id(mood_bg), mood);
      id(text_response).publish_state(t);
      id(runtime_visual_source) = mood == id(mood_happy) ? 2 :
                                  mood == id(mood_angry) ? 3 : 1;
      id(runtime_response_text_ready) = !t.empty();
  - globals.set:
      id: reply_page_index
      value: '0'
  - script.stop: reply_pagination_timer
  - script.stop: backlight_timer
  - light.turn_on:
      id: backlight
      brightness: 100%
  - if:
      condition:
        lambda: return id(current_mode) == 0 && id(ui_state) == ${ui_state_va_replying};
      then:
      - script.execute: update_replying_text
      - if:
          condition:
            lambda: return id(reply_total_pages) > 1;
          then:
          - script.execute: reply_pagination_timer
      - script.execute: draw_display
- id: draw_display
  mode: restart
  then: ${ _round_draw_base + (_round_draw_phone_tail if _round_has_phone else []) + (_round_draw_timer_tail if
    _round_has_timers else []) + (_voicemail_draw if _round_has_phone else []) }
- id: switch_to_va
  then:
  - lambda: !lambda |-
      ${ 'id(voip_dialer_active) = false;' if _round_has_phone else '' }
  - globals.set:
      id: current_mode
      value: '0'
  - script.execute: set_idle_or_mute_phase
  - if:
      condition:
        lambda: return id(voice_assistant_phase) == ${voice_assist_replying_phase_id};
      then:
      - script.execute: update_replying_text
      - if:
          condition:
            lambda: return id(reply_total_pages) > 1;
          then:
          - script.execute: reply_pagination_timer
  - script.execute: draw_display
switch:
- id: !extend 'mute'
  on_turn_off:
  - script.execute: draw_display
packages:
  visibility: !include
    file: visibility.yaml
    vars:
      _visibility_has_avatar: true
      _visibility_has_pagination: true
      _visibility_extra_code: ${ 'id(update_voicemail_status).execute();' if _round_has_phone else '' }
  voicemail: !include
    file: ${ 'voicemail_badge.yaml' if _round_has_phone else '../shared/absent.yaml' }
    vars:
      _voicemail_visible_code: (lv_disp_get_scr_act(nullptr) == id(idle_page)->obj || lv_disp_get_scr_act(nullptr) == id(call_idle_page)->obj) && id(voice_assistant_phase) == ${voice_assist_idle_phase_id}
  phase: !include 'phase.yaml'
  navigation: !include '../../lvgl/lvgl_settings_navigation.yaml'
  settings: !include 'settings/main.yaml'
  player_hooks: ${ _round_player_display if _fw_playback else {} }
  phone: ${ _round_phone_ui if _round_has_phone else {} }
  timers: ${ _round_timer_ui if _round_has_timers else {} }
  artwork: ${ _round_artwork if _fw_sendspin else {} }
  content: !include 'round_content.yaml'
defaults:
  _visibility_has_avatar: true
  _visibility_has_pagination: true
  _round_navigation_up:
  - script.execute:
      id: round_navigate
      delta: 1
  _round_navigation_down:
  - script.execute:
      id: round_navigate
      delta: -1
  _round_player_display:
    media_player:
    - id: !extend 'speaker_media_player'
      on_play:
      - script.execute: backlight_timer
      on_pause:
      - script.execute: backlight_timer
      on_idle:
      - delay: 200ms
      - script.execute: backlight_timer
  _round_draw_base:
  - lambda: !lambda |-
      // Determine target page
      lv_obj_t* target = nullptr;
      ${ _round_phone_state if _round_has_phone else '' }
      // Timer ringing owns the UI while the alarm is active. This must use
      // the runtime_controller timer activity, not voice_assistant_phase, because media_player
      // callbacks can legitimately update the phase while playing the alarm.
      if (${'id(runtime).is_activity_active("timer_ringing")' if _round_has_timers else 'false'}) {
        ${'target = id(timer_finished_page)->obj;' if _round_has_timers else ''}
      } ${ _round_phone_ended_route if _round_has_phone else '' } else if (id(settings_active) && !id(g_settings_pages).empty()) {
        int idx = id(g_settings_index);
        int n = (int) id(g_settings_pages).size();
        if (idx < 0 || idx >= n) idx = 0;
        target = id(g_settings_pages)[idx];
      } else if (id(init_in_progress)) {
        target = id(initializing_page)->obj;
      } else if (!wifi::global_wifi_component->is_connected()) {
        target = id(no_wifi_page)->obj;
      } else if (id(runtime).is_activity_active("no_ha")) {
        target = id(no_ha_page)->obj;
      } ${ _round_phone_active_route if _round_has_phone else '' } else {
        // VA mode
        int phase = id(voice_assistant_phase);
        if (phase == ${voice_assist_listening_phase_id}) {
          target = id(listening_page)->obj;
        } else if (phase == ${voice_assist_thinking_phase_id}) {
          target = id(thinking_page)->obj;
        } else if (phase == ${voice_assist_replying_phase_id}) {
          target = id(replying_page)->obj;
        } else if (phase == ${voice_assist_error_phase_id}) {
          target = id(error_page)->obj;
        } else if (phase == ${voice_assist_muted_phase_id}) {
          target = id(muted_page)->obj;
        } else if (phase == ${voice_assist_not_ready_phase_id}) {
          target = id(no_ha_page)->obj;
        } else {
          target = id(idle_page)->obj;
        }
      }

      ${ _round_video_route | default('') }
      if (target == nullptr) return;

      const char* page_name = "unknown";
      if (target == id(idle_page)->obj) page_name = "idle";
      else if (target == id(listening_page)->obj) page_name = "listening";
      else if (target == id(thinking_page)->obj) page_name = "thinking";
      else if (target == id(replying_page)->obj) page_name = "replying";
      else if (target == id(error_page)->obj) page_name = "error";
      else if (target == id(muted_page)->obj) page_name = "muted";
      ${ _round_name_call_idle_page if _round_has_phone else '' }
      ${ _round_name_call_dialer_page if _round_has_phone else '' }
      ${ _round_name_call_ringing_in_page if _round_has_phone else '' }
      ${ _round_name_call_ringing_out_page if _round_has_phone else '' }
      ${ _round_name_call_in_call_page if _round_has_phone else '' }
      ${ _round_name_call_ended_page if _round_has_phone else '' }
      ${ _round_timer_name if _round_has_timers else '' }
      ${ _round_name_video_page | default('') }
      id(runtime_rendered_page) = page_name;

      // Skip page load if already showing (avoids redundant SPI transfer)
      bool page_changed = (target != lv_disp_get_scr_act(nullptr));
      if (page_changed) {
        // A navigation gesture must not become a click on the old screen.
        auto *input = lv_indev_active();
        if (input != nullptr && lv_indev_get_gesture_dir(input) != LV_DIR_NONE) {
          lv_indev_wait_release(input);
        }
        // Stop animation before page switch to prevent split-screen glitch
        lv_anim_del(id(idle_anim), nullptr);
        // Honour swipe-driven animation hint, otherwise instant load.
        if (id(nav_anim) != 0) {
          lv_scr_load_anim(target,
                           (lv_scr_load_anim_t) id(nav_anim),
                           (uint32_t) id(nav_anim_ms),
                           0, false);
        } else {
          lv_disp_load_scr(target);
        }
      }
      // The VA idle animation is stopped before page switches. Start the
      // idle animation loop immediately when VA idle becomes the visible
      // page, instead of waiting for the template binary_sensor refresh.
      id(display_visibility).reconcile();
      if (target == id(idle_page)->obj && id(display_visibility).is_visible(id(idle_anim))) {
        if (!id(ai_animation_loop).is_running()) id(ai_animation_loop).execute();
      } else if (id(ai_animation_loop).is_running()) {
        id(ai_animation_loop).stop();
      }
      // Always consume the hint, even if no page change happened.
      id(nav_anim) = 0;
      id(nav_anim_ms) = 0;

      // Publish after LVGL has selected the actual screen, not only when
      // the reducer selected its intended policy state.
      id(runtime_rendered_page) = page_name;

      // Dense text, the dialer and scrollable Options use the complete disk.
      const bool show_status =
          target != id(replying_page)->obj &&
          target != id(thinking_page)->obj &&
          target != id(settings_continuous_page)->obj &&
          ${ _round_video_status_allowed | default('true') } &&
          ${ '(target != id(call_dialer_page)->obj && target != id(phone_voicemail_page)->obj)' if _round_has_phone else 'true' };
      if (show_status) {
        lv_obj_clear_flag(id(top_clock_label), LV_OBJ_FLAG_HIDDEN);
        lv_obj_clear_flag(id(top_battery_label), LV_OBJ_FLAG_HIDDEN);
      } else {
        lv_obj_add_flag(id(top_clock_label), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(top_battery_label), LV_OBJ_FLAG_HIDDEN);
      }
  - if:
      condition:
        binary_sensor.is_on: is_idle_screen
      then:
      - script.execute: update_idle_labels
  _round_touch_common:
  - script.execute: backlight_timer
  _round_phone_ui: !include '../voip/presentation/round.yaml'
  _round_timer_ui: !include '../timers/presentation/round.yaml'
  _round_artwork: !include '../../media_player/sendspin_artwork.yaml'
  _round_render_before_phone:
  - script.execute: runtime_project_ui_phase
  - script.execute: backlight_timer
  - if:
      condition:
        lambda: return id(ui_state) == ${ui_state_va_listening};
      then:
      - text_sensor.template.publish:
          id: text_request
          state: '...'
      - text_sensor.template.publish:
          id: text_response
          state: '...'
      - script.stop: reply_pagination_timer
  _round_render_after_phone:
  - script.execute: draw_display
touchscreen:
- id: !extend 'touch'
  on_touch: ${ _round_touch_common + (_round_touch_timer if _round_has_timers else []) }
substitutions:
  _round_has_phone: ${ _fw_display and _fw_voip }
  _round_has_timers: ${ _fw_display and _fw_timers }
  _round_navigation_up: ${_round_navigation_up}
  _round_navigation_down: ${_round_navigation_down}
