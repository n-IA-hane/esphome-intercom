# One event-driven projection of the VoIP owner's aggregate message state.
# The board supplies the existing status refresh code through include vars.
voip_stack:
  ha_integration:
    message_waiting: true
globals:
- id: ui_voicemail_waiting
  type: bool
  restore_value: false
  initial_value: 'false'
esphome:
  on_boot:
  - priority: -250
    then:
    - lambda: |-
        #if defined(USE_ESPHOME_VOIP_MWI) || defined(USE_ESPHOME_VOIP_HA_MWI)
        auto refresh = []() {
          const bool waiting = id(phone).has_waiting_messages();
          if (id(ui_voicemail_waiting) == waiting) return;
          id(ui_voicemail_waiting) = waiting;
          ${voicemail_changed_code}
        };
        id(phone).add_on_message_waiting_callback(refresh);
        refresh();
        #endif
