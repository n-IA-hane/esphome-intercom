# Sendspin artwork support for display devices.
#
# Source and status:
#   - Added for https://github.com/n-IA-hane/esphome-intercom/issues/58.
#   - Uses the official Sendspin image platform available since ESPHome 2026.8.
#
# Include this package on display builds that already define:
#   - sendspin_hub
#   - speaker_media_player
#   - runtime_controller
#   - apply_media_artwork
#   - mood_bg and mood_neutral LVGL image objects

defaults:
  sendspin_artwork_resize: '${ sendspin_artwork_resize | default("240x240") }'
substitutions:
  sendspin_artwork_resize: ${sendspin_artwork_resize}

globals:
  - id: sendspin_artwork_available
    type: bool
    restore_value: false
    initial_value: "false"

media_player:
  - id: !extend speaker_media_player
    # Music and direct announcements share the media display policy, so its
    # on_change alone cannot hide/restore artwork when playback is interrupted.
    on_state:
      - script.execute: apply_media_artwork

image:
  - platform: sendspin
    id: sendspin_artwork_slot
    sendspin_id: sendspin_hub
    format: JPEG
    type: RGB565
    resize: ${sendspin_artwork_resize}
    source: ALBUM
    current_image:
      id: sendspin_cover_art
    on_image_display:
      - lambda: id(sendspin_artwork_available) = true;
      - script.execute: apply_media_artwork
    on_image_clear:
      - lambda: id(sendspin_artwork_available) = false;
      - script.execute: apply_media_artwork
    on_image_error:
      - lambda: id(sendspin_artwork_available) = false;
      - script.execute: apply_media_artwork

script:
  - id: !extend ui_va_end
    then:
      # The response-inactive hook clears the text-ready flag. Reconcile here
      # too when the display policy changed before that content cleanup ran.
      - script.execute: apply_media_artwork
  - id: !extend apply_media_artwork
    then:
      - lambda: |-
          // The legacy replying phase is shared by music and Assist. Only the
          // committed media owner may project album art. TTS content arrives
          // before its deferred runtime observation and already owns the image.
          if (id(ui_state) != ${ui_state_media} || id(runtime_response_text_ready)) {
            return;
          }
          // Read the native state: ANNOUNCING is never music, even before the
          // runtime observer has reconciled its announcement activity.
          const bool show_cover = id(sendspin_artwork_available) &&
              id(speaker_media_player).state == media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;
          esphome::image::Image *image = show_cover ? id(sendspin_cover_art) : id(mood_neutral);
          lv_img_set_src(id(mood_bg), image);
          // The Sendspin image object is stable while its decoded pixels change.
          lv_obj_invalidate(id(mood_bg));
          id(runtime_visual_source) = show_cover ? 4 : 1;
