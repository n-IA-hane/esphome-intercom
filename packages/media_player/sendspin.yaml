# Optional Sendspin source added to the existing player.
substitutions:
  sendspin_audio_ring_buffer_size: "262144"
packages:
  sendspin_compat: !include sendspin_compat.yaml
sendspin:
  id: sendspin_hub
  task_stack_in_psram: true
media_source:
  - platform: sendspin
    id: sendspin_media_source
    sample_rate: 48000
    buffer_size: ${sendspin_audio_ring_buffer_size}
    task_stack_in_psram: true
    decode_memory: psram
media_player:
  - id: !extend speaker_media_player
    media_pipeline:
      sources:
        - sendspin_media_source
