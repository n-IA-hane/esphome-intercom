# =============================================================================
# Shared settings registry, retaining the legacy page-list API.
# FULL round profiles use round_navigate from round_runtime for this sequence:
# Assist -> Contacts -> Dialer -> Options, skipping views not compiled in.
# Swipe bottom to top to advance, top to bottom to go back. Ends do not wrap.
# Inside Options, the title and controls share one scrolling body. Scroll to
# the top, then swipe the visible title down to return to the previous view.
# The device populates g_settings_pages at boot. Older users of the multi-page
# API can still call the legacy cycling action settings_navigate below; FULL
# round navigation does not use that action.
#
# Provides:
#   globals: settings_active (bool), g_settings_pages (vector<lv_obj_t*>),
#            g_settings_index (int)
#   scripts: settings_navigate(delta), settings_open, settings_close,
#            settings_open_transition, settings_close_transition
#
# Prerequisites in the device YAML:
#   - script id `draw_display` (provided by the device's draw_display lambda)
#   - g_settings_pages populated at on_boot
# =============================================================================

globals:
  - id: settings_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_settings_pages
    type: std::vector<lv_obj_t*>
    restore_value: false
  - id: g_settings_index
    type: int
    restore_value: false
    initial_value: "0"

script:
  # Optional transition hooks. Full-experience devices !extend these to set
  # page animation globals before draw_display; voip-only devices can keep
  # the no-op defaults.
  - id: settings_open_transition
    then: []

  - id: settings_close_transition
    then: []

  # Cycle through g_settings_pages by `delta` (typically +1 / -1).
  - id: settings_navigate
    parameters:
      delta: int
    then:
      - lambda: |-
          if (id(g_settings_pages).empty()) return;
          int n = (int) id(g_settings_pages).size();
          int idx = (((id(g_settings_index) + delta) % n) + n) % n;
          id(g_settings_index) = idx;
          lv_scr_load_anim(id(g_settings_pages)[idx],
                           delta >= 0 ? LV_SCR_LOAD_ANIM_MOVE_LEFT : LV_SCR_LOAD_ANIM_MOVE_RIGHT,
                           250, 0, false);

  # Enter settings. Full round profiles register one page.
  - id: settings_open
    then:
      - script.execute: settings_open_transition
      - lambda: |-
          id(settings_active) = true;
          id(g_settings_index) = 0;
      - script.execute: draw_display

  # Exit settings: clear the flag, let draw_display pick the natural page.
  - id: settings_close
    then:
      - script.execute: settings_close_transition
      - lambda: 'id(settings_active) = false;'
      - script.execute: draw_display
