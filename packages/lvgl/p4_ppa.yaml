# =============================================================================
# ESP32-P4 display ownership and PPA policy
# =============================================================================
#
# The display owns transformed video, ordinary UI submissions and framebuffer
# readback under one transaction owner. LVGL acceleration follows ESPHome.
# =============================================================================

external_components:
  - source: ${ext_components_source}
    components: [mipi_dsi]

lvgl:
  draw_rounding: 2

esp32:
  framework:
    type: esp-idf
    sdkconfig_options:
      # LVGL/Espressif PPA requires cache-line aligned draw buffers on P4.
      CONFIG_LV_DRAW_BUF_ALIGN: "64"
      # PPA and MIPI DSI share the DMA2D path. Keep DMA2D control code out of
      # flash-cache stalls on the full display + audio workload. Do not enable
      # CONFIG_DMA2D_ISR_IRAM_SAFE here: ESPHome/LVGL callbacks are not all
      # IRAM-safe and the driver rejects them at runtime.
      CONFIG_DMA2D_OPERATION_FUNC_IN_IRAM: "y"

defaults:
  ext_components_source: '${ ext_components_source | default("github://n-IA-hane/esphome-intercom@dev") }'
