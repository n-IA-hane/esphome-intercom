# HTTP URLs may contain MP3 announcements or WAV chimes even when Home Assistant
# prefers FLAC. Compile those decoders explicitly, without format: NONE enabling
# every decoder (including Opus). Include only in profiles with HTTP playback.
substitutions:
  ext_components_source: github://n-IA-hane/esphome-intercom@dev

esphome:
  min_version: 2026.10.0


audio:
  codecs:
    mp3:
      buffer_memory: psram
    wav: {}
