# Physical audio/backend configuration; local GMF selection is explicit.
esp_audio_stack:
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}
  i2s_din_pin: ${i2s_din_pin}
  i2s_dout_pin: ${i2s_dout_pin}
  sample_rate: 48000
  output_sample_rate: 16000
  slot_bit_width: 32
  correct_dc_offset: true
  processor_id: afe_processor
  aec_reference: previous_frame
  buffers_in_psram: true
esp_afe:
  id: afe_processor
  type: ${ afe_initial_mode.split('_', 1)[0] }
  mode: ${ afe_initial_mode.split('_', 1)[1] }
  mic_num: 1
  aec_enabled: true
  aec_filter_length: 4
  aec_nlp_level: normal
  se_enabled: false
  ns_enabled: true
  vad_enabled: false
  continuous_vad: true
  agc_enabled: true
  memory_alloc_mode: more_psram
  task_core: 1
  task_priority: 5
  ringbuf_size: 8
  feed_task_core: 0
  feed_task_priority: 5
  feed_task_stack_size: 3072
  fetch_task_core: 1
  fetch_task_priority: 5
  fetch_task_stack_size: 3072
  feed_buf_in_psram: false
  feed_ring_in_psram: true
  fetch_ring_in_psram: false
microphone:
- platform: esp_audio_stack
  id: mic_main
speaker:
- platform: esp_audio_stack
  id: hw_speaker
  sample_rate: 48000
  bits_per_sample: 16
  timeout: 1s
packages:
  microphone_mute: !include '../../features/shared/microphone_mute.yaml'
  speaker_mute: !include '../../voip/speaker_mute_runtime.yaml'
  audio_stack_controls: !include '../../esp_audio_stack/controls.yaml'
  afe_entities: !include '../../esp_afe/single_mic_entities.yaml'
  gmf_source: !include '../gmf_source.yaml'
external_components:
- source: ${audio_stack_components_source}
  components:
  - esp_audio_stack
  - esp_afe
