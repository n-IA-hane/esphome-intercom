# BOX-3 audio processor and codec bindings with the existing amp control.
esp_audio_stack:
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}
  i2s_mclk_pin: ${i2s_mclk_pin}
  i2s_din_pin: ${i2s_din_pin}
  i2s_dout_pin: ${i2s_dout_pin}
  sample_rate: 48000
  output_sample_rate: 16000
  processor_id: aec_processor
  aec_reference: previous_frame
  buffers_in_psram: true
  codec:
    i2c_id: internal_i2c
    input:
      type: es7210
      address: 64
      mic_selected: 1
      gain_db: 30.0
    output:
      type: es8311
      address: 24
      use_mclk: true
      no_dac_ref: true
esp_aec:
  id: aec_processor
  sample_rate: 16000
  filter_length: 4
  mode: ${aec_initial_mode}
microphone:
- platform: esp_audio_stack
  id: mic_main
speaker:
- platform: esp_audio_stack
  id: hw_speaker
  sample_rate: 48000
  bits_per_sample: 16
  timeout: 1s
switch:
- platform: gpio
  name: Speaker Enable
  id: speaker_enable
  pin:
    number: GPIO46
    ignore_strapping_warning: true
  restore_mode: RESTORE_DEFAULT_ON
  entity_category: config
external_components:
- source: ${audio_stack_components_source}
  components:
  - esp_audio_stack
  - esp_aec
packages:
  mute: !include '../../features/shared/microphone_mute.yaml'
  speaker_mute: !include '../../voip/speaker_mute_runtime.yaml'
  controls: !include '../../esp_audio_stack/controls.yaml'
  processor_controls: !include '../../esp_audio_stack/aec_controls.yaml'
