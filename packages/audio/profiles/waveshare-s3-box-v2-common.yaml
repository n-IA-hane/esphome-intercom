# Waveshare V2 physical codec, reference and amplifier calibration.
# These properties belong to the board, independently of the selected DSP.
substitutions:
  # Retained for standalone phones; FULL does not instantiate digital Mic Gain.
  mic_gain_initial: "24"
  # Initial NS4150B calibration above typical startup with 1 uF bypass.
  # This is not a guaranteed maximum or an acoustic qualification.
  speaker_amplifier_settle_ms: "250"
esp_audio_stack:
  audio_task_stack_in_psram: true
  buffers_in_psram: true
  # Use esp_codec_dev's native volume curve and the amplifier calibration below.
  task_core: 1
  task_priority: 19
  task_stack_size: 8192
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}
  i2s_mclk_pin: ${i2s_mclk_pin}
  i2s_din_pin: ${i2s_din_pin}
  i2s_dout_pin: ${i2s_dout_pin}
  sample_rate: 48000
  output_sample_rate: 16000
  processor_id: ${ "afe_processor" if _v2_afe else "aec_processor" }
  audio_effects:
    rate_cvt_complexity: 3
    rate_cvt_perf_type: speed
  codec:
    i2c_id: i2c_bus
    input:
      type: es7210
      address: 64
      mic_selected: 15
      # The close speaker overloads the microphone ADC at 24 dB. Keep capture
      # headroom; native processor gain can be calibrated in the device entry.
      gain_db: 0.0
      # Physical MIC3 carries the attenuated DAC reference (TDM slot 1).
      ref_channel: 2
      ref_gain_db: 24.0
    output:
      type: es8311
      address: 24
      use_mclk: true
      no_dac_ref: true
      # NS4150B Av=240k/Rin, R49/R53=100k: 20*log10(2.4).
      # Let esp_codec_dev account for this physical amplifier in its DAC gain.
      pa_gain: 7.6
  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slots: ${ [0, 2] if _v2_afe or _v2_average else [0] }
  mic_mix: ${mic_mix}
  tdm_ref_slot: 1
microphone:
- platform: esp_audio_stack
  id: ${mic_id}
speaker:
- platform: esp_audio_stack
  id: hw_speaker
  sample_rate: 48000
  bits_per_sample: 16
  timeout: 1s
  # Evaluated before amplifier_required stops the existing warm-idle timer.
  # The mute paths below keep that timer stopped whenever PA power is off.
  amplifier_settle_time: !lambda |-
    return id(audio_stack_speaker_idle_powerdown).is_running()
               ? 0 : ${speaker_amplifier_settle_ms};
switch:
- platform: template
  name: Speaker Mute
  id: speaker_mute
  icon: mdi:volume-off
  entity_category: config
  optimistic: true
  restore_mode: RESTORE_DEFAULT_OFF
  on_turn_on:
  - logger.log:
      level: INFO
      tag: mute
      format: 'Speaker mute ON: DAC muted, amplifier off'
  - script.execute: audio_stack_speaker_mute_transition
  on_turn_off:
  - logger.log:
      level: INFO
      tag: mute
      format: 'Speaker mute OFF: amplifier on, DAC unmuted'
  - script.execute: audio_stack_speaker_mute_transition
script:
- id: audio_stack_speaker_mute_transition
  mode: restart
  then:
  # A new intention cancels the preceding branch and all of its delays.
  - script.stop: audio_stack_speaker_idle_powerdown
  - if:
      condition:
        switch.is_on: speaker_mute
      then:
      - speaker.mute_on: hw_speaker
      - delay: ${speaker_amplifier_settle_ms}ms
      - if:
          condition:
            switch.is_on: speaker_mute
          then:
          - output.turn_off: speaker_enable
      else:
      - if:
          condition:
            # Parent intent includes the facade's settling STARTING state.
            lambda: return id(hw_speaker).get_parent()->is_speaker_running();
          then:
          - output.turn_on: speaker_enable
          - delay: ${speaker_amplifier_settle_ms}ms
          - if:
              condition:
                switch.is_off: speaker_mute
              then:
              - speaker.mute_off: hw_speaker
          else:
          - speaker.mute_off: hw_speaker
external_components:
- source: ${audio_stack_components_source}
  components: [esp_audio_stack]
packages:
  mute: !include '../../features/shared/microphone_mute.yaml'
  controls: !include '../../esp_audio_stack/controls.yaml'
  hardware_gain: !include '../../esp_audio_stack/hardware_gain_controls.yaml'
  amplifier: !include '../../esp_audio_stack/speaker_power_output.yaml'
