# Physical audio/backend configuration; local GMF selection is explicit.
esp_audio_stack:
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}
  i2s_mclk_pin: ${i2s_mclk_pin}
  i2s_din_pin: ${i2s_din_pin}
  i2s_dout_pin: ${i2s_dout_pin}
  sample_rate: 48000
  output_sample_rate: 16000
  processor_id: afe_processor
  audio_effects:
    rate_cvt_complexity: 3
    rate_cvt_perf_type: speed
  num_channels: 2
  codec:
    i2c_id: i2c_bus
    input:
      type: es8311
      address: 24
      gain_db: 24.0
      use_mclk: true
      no_dac_ref: false
    output:
      type: es8311
      address: 24
      use_mclk: true
      no_dac_ref: false
  use_stereo_aec_reference: true
  reference_channel: right
  buffers_in_psram: true
  audio_task_stack_in_psram: true
esp_afe:
  id: afe_processor
  type: ${ afe_initial_mode.split('_', 1)[0] }
  mode: ${ afe_initial_mode.split('_', 1)[1] }
  mic_num: 1
  aec_enabled: true
  aec_filter_length: 4
  aec_nlp_level: normal
  se_enabled: false
  ns_enabled: true
  vad_enabled: true
  continuous_vad: true
  agc_enabled: true
  memory_alloc_mode: more_psram
  task_core: 1
  task_priority: 5
  ringbuf_size: 8
  feed_task_core: 0
  feed_task_priority: 5
  feed_task_stack_size: 3072
  fetch_task_core: 1
  fetch_task_priority: 10
  fetch_task_stack_size: 3072
  feed_buf_in_psram: false
  feed_ring_in_psram: true
  fetch_ring_in_psram: false
microphone:
- platform: esp_audio_stack
  id: mic_afe
speaker:
- platform: esp_audio_stack
  id: hw_speaker
  sample_rate: 48000
  bits_per_sample: 16
  timeout: 1s
switch:
- platform: template
  name: Speaker Mute
  id: speaker_mute
  icon: mdi:volume-off
  entity_category: config
  optimistic: true
  restore_mode: RESTORE_DEFAULT_OFF
  on_turn_on:
  - logger.log:
      level: INFO
      tag: mute
      format: 'Speaker mute ON: DAC muted, amplifier off'
  - speaker.mute_on: hw_speaker
  - delay: 50ms
  - output.turn_off: speaker_enable
  on_turn_off:
  - logger.log:
      level: INFO
      tag: mute
      format: 'Speaker mute OFF: amplifier on, DAC unmuted'
  - if:
      condition:
        speaker.is_playing: hw_speaker
      then:
      - output.turn_on: speaker_enable
      - delay: 50ms
  - speaker.mute_off: hw_speaker
external_components:
- source: ${audio_stack_components_source}
  components:
  - esp_audio_stack
  - esp_afe
packages:
  microphone_mute: !include '../../features/shared/microphone_mute.yaml'
  controls: !include '../../esp_audio_stack/controls.yaml'
  afe_controls: !include '../../esp_afe/single_mic_entities.yaml'
  amplifier: !include '../../esp_audio_stack/speaker_power_output.yaml'
  gmf_source: !include '../gmf_source.yaml'
