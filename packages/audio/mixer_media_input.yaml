# Optional media mixer port and resampler.
speaker:
  - id: !extend audio_mixer
    source_speakers:
      - id: media_mixer_input
        timeout: 10s
        buffer_duration: 100ms
        sample_rate: 48000
        bits_per_sample: 16
        num_channels: 1
  - platform: resampler
    id: media_speaker_input
    output_speaker: media_mixer_input
    task_stack_in_psram: true
    sample_rate: 48000
    bits_per_sample: 16
    num_channels: 1
