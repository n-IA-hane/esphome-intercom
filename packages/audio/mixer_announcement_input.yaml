# TTS, ringtone, timer and file announcements share this mixer input.
substitutions:
  announcement_input_attenuation_db: "0"

esphome:
  on_boot:
    - priority: -100
      then:
        - if:
            condition:
              lambda: 'return ${ announcement_input_attenuation_db | default(0) } > 0;'
            then:
              - mixer_speaker.apply_ducking:
                  id: tts_mixer_input
                  decibel_reduction: ${ announcement_input_attenuation_db | default(0) }
                  duration: 0ms

speaker:
  - id: !extend audio_mixer
    source_speakers:
      - id: tts_mixer_input
        timeout: 10s
        buffer_duration: 100ms
        sample_rate: 48000
        bits_per_sample: 16
        num_channels: 1
  - platform: resampler
    id: tts_speaker_input
    output_speaker: tts_mixer_input
    task_stack_in_psram: true
    sample_rate: 48000
    bits_per_sample: 16
    num_channels: 1
