# Device wiring and consumer parameters. Shared feature modules own lifecycle and controls.
substitutions:
  firmware_audio_backend: native
  firmware_led_package: ../../led/status_ws2812_single.yaml
  firmware_voice_binding:
    voice_assistant:
      microphone:
      - id: va_mic_source
        microphone: native_mic_raw
        bits_per_sample: 16
        channels:
        - 1
        gain_factor: 1
      media_player: speaker_media_player
      noise_suppression_level: 2
      auto_gain: 31dBFS
      volume_multiplier: 2.0
  firmware_wake_word_binding:
    micro_wake_word:
      microphone:
        id: mww_mic_source
        microphone: native_mic_raw
        bits_per_sample: 16
        channels:
        - 1
        gain_factor: 1
      models:
      - model: alexa
  firmware_voip_binding:
    voip_stack:
      use_ha_as_first_contact: true
      task_stacks_in_psram: true
      signaling_buffers_in_psram: true
      buffers_in_psram: true
      audio:
        codecs:
          - codec: pcm
            tx:
              # Prefer 16 kHz / 20 ms TX (50 packets/s); keep 10 ms as a compatible alternative.
              - sample_rate: 16000
                pcm_format: s16le
                channels: 1
                frame_ms: 20
              - sample_rate: 16000
                pcm_format: s16le
                channels: 1
                frame_ms: 10
            rx:
              # Prefer 48 kHz / 10 ms from HA. 48 kHz / 20 ms exceeds the normal RTP payload budget.
              # 16 kHz alternatives allow compatible PCM peers without unnecessary transcoding.
              - sample_rate: 48000
                pcm_format: s16le
                channels: 1
                frame_ms: 10
              - sample_rate: 16000
                pcm_format: s16le
                channels: 1
                frame_ms: 20
              - sample_rate: 16000
                pcm_format: s16le
                channels: 1
                frame_ms: 10
      microphone_source:
        id: voip_mic_source
        microphone: native_mic_raw
        bits_per_sample: 16
        channels:
        - 1
        gain_factor: 1
      speaker: voip_speaker_input
      delete_contact_missing_from:
        updates_number: 1
  firmware_button_stops_timer: false
  firmware_primary_voice_event: manual_voice_toggle
  firmware_controls:
    packages:
      primary: !include '../features/controls/primary_button.yaml'
      native_audio: !include '../features/audio_controls/native_controls.yaml'
  _fw_diagnostics: !include '../diagnostics/native.yaml'
packages:
  feature_validation: !include ../profiles/feature_validation.yaml
  hardware: !include '../board/generic-s3-native.yaml'
  audio: !include '../audio/profiles/generic-s3-native.yaml'
  application: !include '../profiles/application.yaml'
  diagnostics: ${ _fw_diagnostics if 'diagnostics' in firmware_features else {} }
  flac_memory: !include '../audio/flac_codecs_psram.yaml'
runtime_controller:
  storage_in_psram: true
