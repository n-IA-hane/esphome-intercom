# Device wiring and consumer parameters. Shared feature modules own lifecycle and controls.
substitutions:
  firmware_voice_binding:
    voice_assistant:
      microphone: mic_main
      media_player: speaker_media_player
      noise_suppression_level: 0
      auto_gain: 0dBFS
      volume_multiplier: 2.0
  firmware_wake_word_binding:
    micro_wake_word:
      microphone: mic_main
      task_stack_in_psram: true
      models:
      - model: alexa
  firmware_voip_binding:
    voip_stack:
      use_ha_as_first_contact: true
      task_stacks_in_psram: true
      signaling_buffers_in_psram: true
      audio_task_stacks_in_psram: true
      buffers_in_psram: true
      conference_groups: CG Casa
      conference_ring: false
      ring_groups: RG Casa
      audio:
        codecs:
          - codec: pcm
            tx:
              # 20 ms reduces RTP packet count; 10 ms remains an explicit alternative.
              - sample_rate: 16000
                pcm_format: s16le
                channels: 1
                frame_ms: 20
              - sample_rate: 16000
                pcm_format: s16le
                channels: 1
                frame_ms: 10
            rx:
              # Prefer 48 kHz / 10 ms from HA. 48 kHz / 20 ms exceeds the normal RTP payload budget.
              # 16 kHz alternatives allow compatible PCM peers without unnecessary transcoding.
              - sample_rate: 48000
                pcm_format: s16le
                channels: 1
                frame_ms: 10
              - sample_rate: 16000
                pcm_format: s16le
                channels: 1
                frame_ms: 20
              - sample_rate: 16000
                pcm_format: s16le
                channels: 1
                frame_ms: 10
      microphone: mic_main
      speaker: voip_speaker_input
      delete_contact_missing_from:
        updates_number: 1
  firmware_music_binding:
    media_source:
    - id: !extend 'media_http_source'
      persistent_ring_buffer: true
  firmware_announcement_binding:
    media_source:
    - id: !extend 'announcement_http_source'
      persistent_ring_buffer: true
  firmware_controls:
    packages:
      buttons: !include '../features/controls/waveshare_s3.yaml'
      processing: !include '../features/audio_controls/afe_mode.yaml'
  _fw_diagnostics: !include '../diagnostics/native.yaml'
  _fw_voip_debug: !include '../voip/debug.yaml'
packages:
  feature_validation: !include ../profiles/feature_validation.yaml
  hardware: !include '../board/waveshare_s3_audio.yaml'
  audio: !include '../audio/profiles/waveshare_s3_afe.yaml'
  application: !include '../profiles/application.yaml'
  diagnostics: ${ _fw_diagnostics if 'diagnostics' in firmware_features else {} }
  voip_debug: ${ _fw_voip_debug if 'voip' in firmware_features else {} }
  flac_memory: !include '../audio/flac_codecs_psram.yaml'
runtime_controller:
  storage_in_psram: true
