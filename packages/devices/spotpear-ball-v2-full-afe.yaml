# Device wiring and consumer parameters. Shared feature modules own lifecycle and controls.
substitutions:
  firmware_lvgl: true
  firmware_led_package: ../../led/status_spotpear_ball_v2.yaml
  firmware_primary_button_id: main_button
  afe_initial_mode: sr_high_perf
  afe_mode_restore_value: false
  firmware_music_binding:
    media_source:
    - id: !extend 'media_http_source'
      buffer_size: ${http_media_ring_buffer_size}
      task_stack_in_psram: true
      persistent_ring_buffer: ${http_media_persistent_ring_buffer}
  firmware_announcement_binding:
    media_source:
    - id: !extend 'announcement_http_source'
      buffer_size: ${http_media_ring_buffer_size}
      task_stack_in_psram: true
      persistent_ring_buffer: ${http_media_persistent_ring_buffer}
  firmware_voice_binding:
    voice_assistant:
      id: va
      microphone: mic_afe
      media_player: speaker_media_player
      noise_suppression_level: 0
      auto_gain: 0dBFS
      volume_multiplier: 2.0
  firmware_wake_word_binding:
    micro_wake_word:
      id: mww
      microphone: mic_afe
      stop_after_detection: false
      models:
      - model: alexa
  firmware_voip_binding:
    voip_stack:
      use_ha_as_first_contact: true
      task_stacks_in_psram: true
      audio_task_stacks_in_psram: ${voip_audio_task_stacks_in_psram}
      tx_task_stack_size: ${voip_tx_task_stack_size}
      rx_task_stack_size: ${voip_rx_task_stack_size}
      signaling_buffers_in_psram: true
      buffers_in_psram: true
      id: phone
      extension: '101'
      conference_groups: CG Casa
      conference_ring: false
      ring_groups: RG Casa
      audio:
        tx:
          sample_rate: 16000
          pcm_format: s16le
          channels: 1
          frame_ms: 16
        tx_formats:
        - sample_rate: 16000
          pcm_format: s16le
          channels: 1
          frame_ms: 10
        rx:
          sample_rate: 48000
          pcm_format: s16le
          channels: 1
          frame_ms: 10
        rx_formats:
        - sample_rate: 32000
          pcm_format: s16le
          channels: 1
          frame_ms: 16
        - sample_rate: 16000
          pcm_format: s16le
          channels: 1
          frame_ms: 10
        - sample_rate: 16000
          pcm_format: s16le
          channels: 1
          frame_ms: 16
        - sample_rate: 16000
          pcm_format: s16le
          channels: 1
          frame_ms: 32
      microphone: mic_afe
      speaker: voip_speaker_input
      delete_contact_missing_from:
        updates_number: 1
  firmware_display_package: ../features/presentation/devices/spotpear.yaml
  _spotpear_full_buttons: !include '../features/controls/spotpear_full.yaml'
  _spotpear_simple_buttons: !include '../features/controls/primary_button.yaml'
  firmware_controls:
    packages:
      buttons: ${ _spotpear_full_buttons if _fw_display and _fw_voice and _fw_voip else _spotpear_simple_buttons
        }
      processing: !include '../features/audio_controls/afe_mode.yaml'
  _spotpear_diagnostics: !include '../diagnostics/native.yaml'
  # JPEG reception follows display + VoIP; audio-only builds omit the renderer.
  s3_sip_jpeg_width: '240'
  s3_sip_jpeg_height: '240'
  s3_sip_jpeg_fps: '10'
runtime_controller:
  id: runtime
  storage_in_psram: true
packages:
  feature_validation: !include ../profiles/feature_validation.yaml
  hardware: !include '../board/spotpear_ball_v2.yaml'
  display_hardware: !include '${ ''../board/spotpear_display.yaml'' if ''display'' in firmware_features else ''../features/shared/absent.yaml''
    }'
  video_receive: !include ${ '../voip/s3_video_call_page.yaml' if 'display' in firmware_features and 'voip' in firmware_features else '../features/shared/absent.yaml' }
  audio: !include '../audio/profiles/spotpear_afe.yaml'
  boot: !include '../features/shared/spotpear_boot.yaml'
  diagnostics: ${ _spotpear_diagnostics if 'diagnostics' in firmware_features else {} }
  flac_memory: !include '../audio/flac_codecs_psram.yaml'
  application: !include '../profiles/application.yaml'
defaults:
  afe_mode_options: ${ afe_mode_options | default(["sr_low_cost", "sr_high_perf"])
    }
  firmware_processing_modes: ${afe_mode_options}
