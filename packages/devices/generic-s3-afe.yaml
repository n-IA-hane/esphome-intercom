# Device wiring and consumer parameters. Shared feature modules own lifecycle and controls.
substitutions:
  firmware_audio_backend: audio_stack
  firmware_led_package: ../../led/status_ws2812_single.yaml
  firmware_voice_binding:
    voice_assistant:
      microphone: mic_main
      media_player: speaker_media_player
      noise_suppression_level: 2
      auto_gain: 31dBFS
      volume_multiplier: 2.0
  firmware_wake_word_binding:
    micro_wake_word:
      microphone: mic_main
      models:
      - model: alexa
  firmware_voip_binding:
    voip_stack:
      use_ha_as_first_contact: true
      task_stacks_in_psram: true
      buffers_in_psram: true
      audio:
        tx_formats:
        - sample_rate: 16000
          pcm_format: s16le
          channels: 1
          frame_ms: 10
        rx:
          sample_rate: 48000
          pcm_format: s16le
          channels: 1
          frame_ms: 10
        rx_formats:
        - sample_rate: 32000
          pcm_format: s16le
          channels: 1
          frame_ms: 16
        - sample_rate: 16000
          pcm_format: s16le
          channels: 1
          frame_ms: 10
        - sample_rate: 16000
          pcm_format: s16le
          channels: 1
          frame_ms: 16
        - sample_rate: 16000
          pcm_format: s16le
          channels: 1
          frame_ms: 32
      microphone: mic_main
      speaker: voip_speaker_input
      delete_contact_missing_from:
        updates_number: 1
  firmware_button_stops_timer: false
  afe_initial_mode: sr_high_perf
  afe_mode_restore_value: false
  firmware_controls:
    packages:
      primary: !include '../features/controls/primary_button.yaml'
      processing: !include '../features/audio_controls/afe_mode.yaml'
  _fw_diagnostics: !include '../diagnostics/native.yaml'
packages:
  feature_validation: !include ../profiles/feature_validation.yaml
  hardware: !include '../board/generic-s3-afe.yaml'
  audio: !include '../audio/profiles/generic-s3-afe.yaml'
  application: !include '../profiles/application.yaml'
  diagnostics: ${ _fw_diagnostics if 'diagnostics' in firmware_features else {} }
  flac_memory: !include '../audio/flac_codecs_psram.yaml'
defaults:
  afe_mode_options: ${ afe_mode_options | default(["sr_low_cost", "sr_high_perf"]) }
