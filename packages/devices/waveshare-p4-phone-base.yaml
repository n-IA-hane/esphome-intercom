# Complete standalone telephone composition with the shared OTA lifecycle.
substitutions:
  name: waveshare-p4-touch
  friendly_name: Waveshare P4 Touch
  ext_components_source: github://n-IA-hane/esphome-intercom@main
  voip_stack_components_source: github://n-IA-hane/esphome-voip-stack@main
  audio_stack_components_source: github://n-IA-hane/esphome-audio-stack@main
  voip_transport: udp
  voip_sip_port: '5060'
  voip_rtp_port: '40000'
  p4_video_width: '800'
  p4_video_height: '800'
  p4_video_fps: '15'
  p4_camera_rotation: '270'
  p4_jpeg_quality: '10'
  p4_video_max_decode_width: '800'
  p4_video_max_decode_height: '800'
  mic_gain_min: '-20'
  mic_gain_max: '30'
  audio_stack_speaker_idle_delay: 2s
  p4_afe_task_priority: '18'
  p4_afe_feed_task_priority: '18'
  p4_afe_fetch_task_priority: '18'
  firmware_phone_has_display: true
  firmware_phone_redraw:
  - script.execute: update_status
defaults:
  _p4_phone: !include '../features/voip/devices/waveshare-p4-phone.yaml'
  _p4_phone_display: !include '../board/waveshare-p4-phone-display.yaml'
packages:
  hardware: !include '../board/waveshare-p4-phone.yaml'
  audio: !include '../audio/profiles/waveshare-p4-phone.yaml'
  hook: !include '../features/voip/no_status_light.yaml'
  telephone: ${ _p4_phone if 'voip' in firmware_features else {} }
  display_hardware: ${ _p4_phone_display if 'voip' in firmware_features and 'display' in firmware_features else
    {} }
  display: !include ${ '../features/presentation/devices/waveshare-p4-phone.yaml' if 'voip' in firmware_features and 'display' in firmware_features else '../features/shared/absent.yaml' }
  maintenance: !include '../features/shared/standalone_phone_maintenance.yaml'
