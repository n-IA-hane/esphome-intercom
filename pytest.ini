[pytest]
testpaths = tests
norecursedirs = .git .hypothesis .venv mutants test_captures
addopts = -x --strict-config --strict-markers
asyncio_mode = auto
xfail_strict = true
markers =
    fault: deterministic failure, cancellation and stale-callback qualification
    architecture: static source, packaging, documentation, or policy checks
    js_runtime: frontend tests executed in Node with controlled browser APIs
    browser_real: end-to-end tests executed by an actual browser engine
    ha: tests that load the integration through supported Home Assistant APIs
    integration: multi-module runtime tests using real production code
    live: opt-in tests requiring Home Assistant, SIP peers, or physical devices
    mutation: mutation and deliberate fault qualification
    slow: deterministic tests too expensive for the fast developer loop
    unit: isolated protocol, codec, value object, or lifecycle primitive tests
timeout = 30
