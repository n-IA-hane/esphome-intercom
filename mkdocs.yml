site_name: VoIP Stack
site_description: SIP phones, calls and automations in Home Assistant, with optional ESPHome endpoints.
repo_url: https://github.com/n-IA-hane/esphome-intercom
repo_name: n-IA-hane/esphome-intercom
extra:
  source_ref: main
docs_dir: docs
site_dir: site
hooks:
  - scripts/docs_site.py
theme:
  name: mkdocs
  navigation_depth: 3
extra_css:
  - stylesheets/documentation.css
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
nav:
  - Overview: index.md
  - Get started:
      - Phones and basic concepts: CONCEPTS.md
      - User guide: USER_GUIDE.md
      - Installation and firmware: DEPLOYMENT_GUIDE.md
      - Documentation map: README.md
  - Calls and routing:
      - PBX walkthrough: PBX_WORKFLOWS.md
      - Phone defaults: PHONE_ROUTING.md
      - Automations: AUTOMATION_DIALPLAN.md
      - Assist voice commands: ASSIST_INTENTS.md
      - Voicemail: VOICEMAIL.md
      - Parking and pickup: CALL_PARKING.md
      - Conversation recording: CALL_RECORDING.md
      - SIP trunks: SIP_TRUNK.md
      - Groups and conferences: GROUPS.md
      - Video: SIP_VIDEO.md
      - Dahua door stations: DAHUA.md
      - ESP with a classic PBX: CLASSIC_PBX.md
  - ESP firmware:
      - Phone entities and migration: ESP_ENTITY_SURFACE.md
      - Sound and announcement actions: ESPHOME_SOUND_ACTIONS.md
      - P4 hardware and media: P4_HARDWARE_AND_MEDIA.md
      - Espressif dependencies: ESPRESSIF_COMPONENTS.md
  - Reference:
      - Actions: SERVICES.md
      - Configuration: reference.md
      - Architecture: ARCHITECTURE.md
      - Call flows: CALL_FLOWS.md
      - Destination resolution: DIALPLAN_RESOLVER.md
      - Phonebook protocol: PHONEBOOK_PROTOCOL.md
      - ESP SIP profile: voip_profile.md
      - Qualification matrix: voip_test_matrix.md
      - Troubleshooting: troubleshooting.md
      - Tests and diagnostics: TESTING_AND_DEBUG.md
      - Upgrade notes: BREAKING_CHANGES.md
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
