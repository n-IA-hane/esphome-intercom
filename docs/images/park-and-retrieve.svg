<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc"><title id="title">Park once. Retrieve from another phone.</title><desc id="desc">700 requests parking. 701 is an example of the assigned slot. Do not transfer to 700 after pressing Park. Directed pickup answers a ringing phone and is a different operation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8fb4d8"/></marker></defs><rect width="1100" height="530" rx="18" fill="#0d1117"/><g font-family="Arial, sans-serif"><text x="36" y="49" font-size="28" font-weight="700" fill="#e6edf3">Park once. Retrieve from another phone.</text><text x="36" y="80" font-size="17" fill="#9fb3c8">700 requests parking. 701 is an example of the assigned slot.</text><path d="M315,245 L400,245" fill="none" stroke="#8fb4d8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M660,245 L745,245" fill="none" stroke="#8fb4d8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="175" width="280" height="140" rx="12" fill="#161b22" stroke="#3d5369" stroke-width="2"/><text x="53" y="205" font-size="20" font-weight="700" fill="#79c0ff">1. Kitchen is on a call</text><text x="53" y="233" font-size="16" fill="#c9d1d9">Press Park in the HA card</text><text x="53" y="257" font-size="16" fill="#c9d1d9">OR transfer to 700 on a handset</text><rect x="400" y="175" width="260" height="140" rx="12" fill="#161b22" stroke="#3d5369" stroke-width="2"/><text x="418" y="205" font-size="20" font-weight="700" fill="#79c0ff">2. HA retains the caller</text><text x="418" y="233" font-size="16" fill="#c9d1d9">Example assigned slot: 701</text><text x="418" y="257" font-size="16" fill="#c9d1d9">Kitchen is free for other calls</text><rect x="745" y="175" width="315" height="140" rx="12" fill="#161b22" stroke="#3d5369" stroke-width="2"/><text x="763" y="205" font-size="20" font-weight="700" fill="#79c0ff">3. Office dials 701</text><text x="763" y="233" font-size="16" fill="#c9d1d9">Office takes the parked call</text><text x="763" y="257" font-size="16" fill="#c9d1d9">The caller does not redial</text><text x="36" y="493" font-size="16" fill="#9fb3c8">Do not transfer to 700 after pressing Park. Directed pickup answers a ringing phone and is a different operation.</text></g></svg>