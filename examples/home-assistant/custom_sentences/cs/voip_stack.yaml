language: cs
intents:
  VoipCall:
    data:
      - sentences:
          - "zavolej {target}"
          - "volej {target}"
          - "zavolej na {target}"
  VoipHangup:
    data:
      - sentences:
          - "típni to"
          - "zavěsit"
          - "ukonči hovor"
  VoipAnswer:
    data:
      - sentences:
          - "přijmi hovor"
          - "zvedni to"
          - "přijmout"
  VoipDecline:
    data:
      - sentences:
          - "odmítni hovor"
          - "odmítnout"

responses:
  intents:
    VoipCall:
      default: "Volám..."
    # Nepoužívejte, pokud se má přehrát běžný zvuk rozpoznání
    # VoipHangup:
    #   default: "Ok"
    # VoipAnswer:
    #   default: "Ok"
    # VoipDecline:
    #   default: "Ok"
  errors:
    voip_stack_calling_failed_unknown_origin: "Nevím, které VoIP zařízení to slyšelo."
    voip_stack_calling_failed_missing_target: "Komu mám zavolat?"
    voip_stack_calling_failed_no_contact: "Kontakt s tímto jménem jsem nenašel."
    voip_stack_calling_failed_ambiguous: "Existuje více kontaktů s tímto jménem."
    voip_stack_calling_failed_ambiguous_area: "Existuje více oblastí s tímto názvem."
    voip_stack_calling_failed_no_devices: "V oblasti není žádné VoIP zařízení."
    voip_stack_calling_failed_multiple_devices: "V oblasti je více než jedno zařízení."
    voip_stack_calling_failed: "Hovor se nezdařil."
    voip_stack_hangup_failed: "Zavěšení se nezdařilo."
    voip_stack_answer_failed: "Hovor se nepodařilo spojit."
    voip_stack_decline_failed: "Odmítnutí se nezdařilo."

lists:
  target:
    wildcard: true
