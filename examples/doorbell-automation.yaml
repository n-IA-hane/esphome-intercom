# Actionable Doorbell Notification
#
# Replace:
# - event.casa_call with the Call Event Entity attached to the receiving phone;
# - Front Door with the exact caller value exposed by that entity;
# - notify.mobile_app_your_phone with the real Companion notification action;
# - /lovelace/phones with the view containing the card for that phone;
# - <casa_phone_device_id> through the HA Device selector/editor.
#
# Answer opens the card because only the browser/Companion session can request
# media permission. Decline uses the authoritative phone Device and needs no
# SIP Call-ID while exactly one call is ringing there.

alias: VoIP - Actionable doorbell notification
mode: restart
triggers:
  - trigger: event.received
    target:
      entity_id: event.casa_call
    options:
      event_type:
        - ringing
conditions:
  - condition: state
    entity_id: event.casa_call
    attribute: caller
    state: Front Door
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: "🔔 Front door"
      message: "Front Door is calling Casa"
      data:
        tag: voip_front_door
        channel: doorbell
        importance: high
        ttl: 0
        priority: high
        actions:
          - action: URI
            title: Answer
            uri: /lovelace/phones?voip_answer=1
          - action: VOIP_DECLINE_CASA
            title: Decline
  - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: VOIP_DECLINE_CASA
    timeout: "00:00:30"
  - if:
      - condition: template
        value_template: "{{ wait.trigger is not none }}"
    then:
      - action: voip_stack.decline
        data:
          device_id: <casa_phone_device_id>
  - action: notify.mobile_app_your_phone
    data:
      message: clear_notification
      data:
        tag: voip_front_door
