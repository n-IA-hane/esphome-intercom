# Customize the notification service, receiving Casa Device ID, caller and view.
# /lovelace/phones must contain the existing Casa HA softphone card. Popups are
# optional. Answer opens that view; the card prepares media before answering.
# Keep both endpoint and Call-ID in the URI. Do not replace URI with a backend
# answer action: a notification alone does not own the microphone/audio path.
alias: VoIP - Actionable doorbell notification
mode: parallel
triggers:
- trigger: voip_stack.call_received
  options:
    destination: Casa
    caller: Front Door
actions:
- variables:
    decline_action: '{{ ''VOIP_DECLINE_'' ~ context.id }}'
    notification_tag: '{{ ''voip_'' ~ context.id }}'
- action: notify.mobile_app_your_phone
  data:
    title: 🔔 Front door
    message: Front Door is calling Casa
    data:
      tag: '{{ notification_tag }}'
      channel: doorbell  # Notification category, not an Android phone-call service.
      importance: high
      ttl: 0
      priority: high
      actions:
      - action: URI
        title: Answer
        uri: >-
          /lovelace/phones?voip_answer=1&voip_endpoint={{ trigger.call.endpoint_id | urlencode }}&voip_call_id={{ trigger.call.call_id | urlencode }}
      - action: '{{ decline_action }}'
        title: Decline
- wait_for_trigger:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: '{{ decline_action }}'
  timeout: 00:00:30
- if:
  - condition: template
    value_template: '{{ wait.trigger is not none }}'
  then:
  - action: voip_stack.decline
    data:
      device_id: <casa_phone_device_id>
      call_id: "{{ trigger.call.call_id }}"
    continue_on_error: true
- action: notify.mobile_app_your_phone
  data:
    message: clear_notification
    data:
      tag: '{{ notification_tag }}'
