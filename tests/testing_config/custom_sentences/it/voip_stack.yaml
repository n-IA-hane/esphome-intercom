intents:
  VoipAnswer:
    data:
    - response: default
      sentences:
      - rispondi
      - rispondi alla chiamata
      slots:
        voip_response: template
  VoipCall:
    data:
    - response: default
      sentences:
      - chiama {target}
      - chiama{target}
      slots:
        voip_response: template
  VoipDecline:
    data:
    - response: default
      sentences:
      - rifiuta
      - rifiuta la chiamata
      slots:
        voip_response: template
  VoipHangup:
    data:
    - response: default
      sentences:
      - riaggancia
      - termina la chiamata
      slots:
        voip_response: template
language: it
lists:
  target:
    wildcard: true
