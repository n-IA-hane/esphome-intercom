intents:
  VoipAnswer:
    data:
    - response: default
      sentences:
      - přijmi hovor
      - zvedni to
      - přijmout
      slots:
        voip_response: template
  VoipCall:
    data:
    - response: default
      sentences:
      - zavolej {target}
      - volej {target}
      - zavolej na {target}
      slots:
        voip_response: template
  VoipDecline:
    data:
    - response: default
      sentences:
      - odmítni hovor
      - odmítnout
      slots:
        voip_response: template
  VoipHangup:
    data:
    - response: default
      sentences:
      - típni to
      - zavěsit
      - ukonči hovor
      slots:
        voip_response: template
language: cs
lists:
  target:
    wildcard: true
