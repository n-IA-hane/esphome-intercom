intents:
  VoipAnswer:
    data:
    - response: default
      sentences:
      - anruf annehmen
      - annehmen
      slots:
        voip_response: template
  VoipCall:
    data:
    - response: default
      sentences:
      - rufe {target} an
      - '{target} anrufen'
      slots:
        voip_response: template
  VoipDecline:
    data:
    - response: default
      sentences:
      - '[anruf ]ablehnen[.]'
      slots:
        voip_response: template
  VoipHangup:
    data:
    - response: default
      sentences:
      - auflegen
      - anruf beenden
      slots:
        voip_response: template
language: de
lists:
  target:
    wildcard: true
responses:
