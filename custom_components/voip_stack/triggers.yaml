phone_state_changed:
  fields:
    phone:
      required: true
      selector:
        device:
          filter:
          - integration: voip_stack
            model: SIP account
    from:
      selector:
        select:
          options:
          - idle
          - unavailable
          - calling
          - ringing
          - in_call
          - held
          translation_key: phone_state
    to:
      selector:
        select:
          options:
          - idle
          - unavailable
          - calling
          - ringing
          - in_call
          - held
          translation_key: phone_state
