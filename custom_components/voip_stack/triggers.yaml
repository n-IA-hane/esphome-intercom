voicemail_received:
  fields:
    mailbox:
      selector:
        device:
          filter:
          - integration: voip_stack
            model: SIP account
call_started:
  fields:
    caller_account: &id002
      selector:
        device:
          filter:
          - integration: voip_stack
            model: SIP account
    caller_number: &id001
      selector:
        text: {}
    caller_extension: *id001
    caller_match: &id003
      default: exact
      selector:
        select:
          options:
          - exact
          - prefix
          - range
          - pattern
          translation_key: call_match
    caller_range_end: *id001
    destination_account: *id002
    destination_number: *id001
    destination_extension: *id001
    destination_match: *id003
    destination_range_end: *id001
    caller: &id004
      selector:
        text: {}
    destination: &id005
      selector:
        text: {}
    ingress: &id006
      selector:
        select:
          options:
          - extension
          - trunk
          translation_key: call_ingress
call_received:
  fields:
    caller_account: *id002
    caller_number: *id001
    caller_extension: *id001
    caller_match: *id003
    caller_range_end: *id001
    destination_account: *id002
    destination_number: *id001
    destination_extension: *id001
    destination_match: *id003
    destination_range_end: *id001
    caller: *id004
    destination: *id005
    ingress: *id006
    trunk:
      selector:
        device:
          filter:
          - integration: voip_stack
            model: SIP trunk
    called_number:
      selector:
        text: {}
